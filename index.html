      state.pendingFinalUnlock = true;
      render();
    }, { once: true });

    const lockAll = () => { [crank, back, release, lever].concat(clutchBtns).forEach((b) => { b.disabled = true; }); };
    const isOpen = () => [0, 1, 2].every((i) => wheelNumAt(i, pos[i]) === wheelTarget(i));
    function showOpened(fresh) {
      opened = true;
      state.vaultOpened = true;
      lockAll();
      stage.classList.add('solved');
      feedback.className = 'feedback good';
      feedback.textContent = T('All three rings lock with one deep sound. The great wheel begins to turn on its own\u2026');
      if (fresh) {
        state.endTime = Date.now();
        clearInterval(state.timerHandle);
        if (state.soundOn) playLockUnlockSound();
        // The team opens the vault themselves, when they are ready.
        setTimeout(() => openBtn.classList.add('ready'), 1200);
      } else {
        openBtn.classList.add('ready');
      }
    }
    let armDeg = 0;
    function turnCrank(dir) {
      if (opened || turning) return;
      turning = true;
      for (let i = 0; i < 3; i++) if (engaged[i]) pos[i] += dir * WHEEL_RATE[i];
      state.wheelTurns += dir;
      setCounter();
      armDeg += dir * 360;
      const arm = crank.querySelector('.crank-arm');
      arm.style.transition = 'transform ' + WHEEL_TURN_MS + 'ms cubic-bezier(0.45, 0, 0.3, 1)';
      arm.style.transform = 'rotate(' + armDeg + 'deg)';
      paint(true);
      playCrankSound();
      feedback.className = 'feedback';
      feedback.textContent = '';
      setTimeout(() => { turning = false; }, WHEEL_TURN_MS);
    }
    crank.addEventListener('click', () => turnCrank(1));
    back.addEventListener('click', () => turnCrank(-1));
    release.addEventListener('click', () => {
      if (opened || turning) return;
      for (let i = 0; i < 3; i++) pos[i] = WHEEL_START[i];
      state.wheelTurns = 0;
      setCounter();
      paint(true);
      playCrankSound();
      feedback.className = 'feedback nudge';
      feedback.textContent = T('The clutches let go, and the rings swing back to where they started.');
    });

    // The lever: the vault only ever opens when the team decides to try it.
    lever.addEventListener('click', () => {
      if (opened || turning || leverResting) return;
      const arm = lever.querySelector('.vault-lever-arm');
      arm.classList.remove('pulled'); void arm.getBoundingClientRect(); arm.classList.add('pulled');
      if (isOpen()) { showOpened(true); return; }
      leverResting = true;
      lever.disabled = true;
      lever.querySelector('.cw-lever-text').textContent = T('The lever is resetting\u2026');
      playCrankSound();
      const plain = 'The great wheel strains against the lock, then stops. The rings are not right yet.';
      registerMiss(FINAL_VAULT, feedback, hint, plain, 3);
      setTimeout(() => {
        leverResting = false;
        if (opened) return;
        lever.disabled = false;
        lever.querySelector('.cw-lever-text').textContent = T('Pull the lever');
      }, WHEEL_LEVER_REST_MS);
    });

    panel.appendChild(el('div', { class: 'cw-crank-row' }, [crank, counter]));
    panel.appendChild(el('div', { class: 'cw-crank-row small' }, [back, release]));
    panel.appendChild(el('div', { class: 'cw-crank-row lever-row' }, [lever]));
    panel.appendChild(feedback);
    panel.appendChild(el('div', { class: 'dial-set-row' }, [openBtn]));
    panel.appendChild(hint.box);
    paint(false);
    if (opened) showOpened(false);
    return el('div', {}, [panel]);
  }

  function doorForRune(rune) {
    return DOORS.find((d) => d.rareSeal === rune) || DOORS[0];
  }

  // ---------- The journal: everything the team has uncovered, always to hand ----------
  const SEAL_RECORDS = {
    d0p0: 'Answered: BOOKMARK',
    d0p1: 'The worn number: 38',
    d0p2: 'Changes found: 7',
    d0p3: 'Found: a crown with only two dots',
    d1p0: 'Decoded: TEAMWORK WINS',
    books: 'Shelf order: key, crown, hourglass, eye, flame, star, moon',
    d1p2: 'Sigil pairs matched: 6',
    d1p3: 'Changes found: 7',
    d2p0: 'Wards broken: 8',
    d2p1: 'The Archivist\u2019s sum: 13',
    rings: 'The crown\u2019s mark made whole',
    d2p3: 'Answered: EMBER'
  };

  let journalEl = null, journalReturnFocus = null;
  function openJournal() {
    if (journalEl) return;
    state.journalUnseen = false;
    const dot = document.querySelector('.journal-btn .journal-dot');
    if (dot) dot.remove();
    journalReturnFocus = document.activeElement;

    const overlay = el('div', { class: 'journal-overlay' });
    const sheet = el('div', { class: 'journal-sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Journal' });
    const close = text('button', 'journal-close', 'Close');
    close.type = 'button';
    close.addEventListener('click', closeJournal);
    sheet.appendChild(el('div', { class: 'journal-head' }, [text('h2', null, 'Journal'), close]));
    sheet.appendChild(text('p', 'journal-sub', 'Everything your team has uncovered. Nothing written here is ever lost.'));

    sheet.appendChild(text('p', 'journal-section', 'THE ANCIENT SCROLL'));
    sheet.appendChild(text('p', 'journal-scroll', SCROLL_TEXT));
    sheet.appendChild(text('p', 'journal-scroll journal-scroll-sign', '\u2014 A., the Archivist'));

    DOORS.forEach((door, di) => {
      const reached = di <= state.doorIndex;
      const earned = state.rareSeals.includes(door.rareSeal);
      const head = el('div', { class: 'journal-door' }, [
        el('span', { class: 'journal-swatch', style: 'background:' + door.accent + ';' }),
        text('span', 'journal-door-name', reached ? door.name
          : PL('Door ' + (di + 1) + ' \u2014 not yet reached', 'Porte ' + (di + 1) + ' \u2014 pas encore atteinte'))
      ]);
      if (earned) {
        head.appendChild(el('span', { class: 'journal-rune', title: 'Rune earned', html: runeIconSVG(door.rareSeal) }));
      }
      sheet.appendChild(head);
      if (!reached) return;
      const list = el('ul', { class: 'journal-list' });
      door.puzzles.forEach((p) => {
        const solved = state.solvedIds.includes(p.id);
        const li = el('li', { class: solved ? 'solved' : 'sealed' });
        if (solved) {
          li.appendChild(text('span', 'journal-seal-title', p.title));
          li.appendChild(text('span', 'journal-seal-record', SEAL_RECORDS[p.id] || 'Opened'));
        } else {
          li.appendChild(text('span', 'journal-seal-title', 'Still sealed'));
        }
        list.appendChild(li);
      });
      sheet.appendChild(list);
      if (earned) {
        const nth = state.rareSeals.indexOf(door.rareSeal);
        sheet.appendChild(text('p', 'journal-rune-note', PL(
          'Rune earned \u2014 the ' + (['first', 'second', 'third'][nth] || '') + ' one you earned.',
          'Rune obtenue \u2014 la ' + (['premi\u00e8re', 'deuxi\u00e8me', 'troisi\u00e8me'][nth] || '') + ' que vous avez obtenue.')));
      }
    });

    overlay.appendChild(sheet);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeJournal(); });
    document.addEventListener('keydown', journalKeys);
    document.body.appendChild(overlay);
    journalEl = overlay;
    requestAnimationFrame(() => overlay.classList.add('open'));
    close.focus();
    if (state.soundOn) playScrollUnrollSound();
  }
  function journalKeys(e) {
    if (e.key === 'Escape') closeJournal();
    if (e.key === 'Tab' && journalEl) { e.preventDefault(); journalEl.querySelector('.journal-close').focus(); }
  }
  function closeJournal() {
    if (!journalEl) return;
    document.removeEventListener('keydown', journalKeys);
    journalEl.remove();
    journalEl = null;
    if (journalReturnFocus && journalReturnFocus.focus) journalReturnFocus.focus();
  }

  const WIN_GEMS = { R: '#2A5E54', V: '#5A3F86', A: '#8E2E1C' };
  function winCrownSVG(runes) {
    const flame = (x, y, sc, d) => `<g class="win-flame" style="transform-origin:${x}px ${y}px; animation-delay:${d}s">
      <g transform="translate(${x} ${y}) scale(${sc})">
        <path d="M0 -22 C8 -12 10 -6 10 0 A10 10 0 0 1 -10 0 C-10 -6 -5 -9 -4 -15 C-1 -10 0 -11 0 -22 Z" fill="#E8762B"/>
        <path d="M0 -11 C3.5 -6 4.5 -3 4.5 0 A4.5 4.5 0 0 1 -4.5 0 C-4.5 -3 -2 -5 0 -11 Z" fill="#FFE6A8"/>
      </g></g>`;
    const gemX = [126, 160, 194], gemY = [136, 132, 136];
    const gems = gemX.map((x, k) => {
      const r = runes[k];
      const y = gemY[k];
      return `<circle cx="${x}" cy="${y}" r="${k === 1 ? 10 : 9}" fill="${(r && WIN_GEMS[r]) || '#3A2A1C'}" stroke="#3A2408" stroke-width="2"/>
        <circle cx="${x - 3}" cy="${y - 3}" r="2" fill="#FFFFFF" opacity="0.35"/>` +
        (r ? `<g transform="translate(${x} ${y}) scale(0.34)"><path d="${RUNE_PATHS[r]}" stroke="#F3D48C" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>` : '');
    }).join('');
    return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="winGlow"><stop offset="0" stop-color="#FFB347" stop-opacity="0.6"/><stop offset="0.55" stop-color="#E8762B" stop-opacity="0.15"/><stop offset="1" stop-color="#E8762B" stop-opacity="0"/></radialGradient>
        <linearGradient id="winGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE3A4"/><stop offset="0.55" stop-color="#D9A444"/><stop offset="1" stop-color="#8E621F"/></linearGradient>
      </defs>
      <ellipse class="win-glow" cx="160" cy="110" rx="150" ry="100" fill="url(#winGlow)"/>
      <ellipse cx="160" cy="180" rx="80" ry="8" fill="#000000" opacity="0.4"/>
      <g class="win-crown">
        <path d="M86 160 L92 70 L124 110 L160 52 L196 110 L228 70 L234 160 Z" fill="url(#winGold)" stroke="#3A2408" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M92 70 L124 110 L160 52 L196 110 L228 70" fill="none" stroke="#FFF1C8" stroke-opacity="0.6" stroke-width="1.2"/>
        <rect x="82" y="156" width="156" height="16" rx="2" fill="url(#winGold)" stroke="#3A2408" stroke-width="2.5"/>
        <path d="M90 164 H230" stroke="#8E621F" stroke-width="1" stroke-dasharray="3 5"/>
        ${gems}
        ${flame(92, 66, 1, 0)}${flame(160, 48, 1.25, 0.2)}${flame(228, 66, 1, 0.4)}
      </g>
    </svg>`;
  }

  function buildWin() {
    if (!state.victoryPlayed) {
      state.victoryPlayed = true;
      stopAmbience();
      playVictoryMusic();
    }
    const finalSecs = elapsedSecs();
    const m = Math.floor(finalSecs / 60), s = finalSecs % 60;
    const panel = el('div', { class: 'panel win' });
    const hintsTaken = Object.values(state.hintTier).reduce((a, b) => a + b, 0);
    // The crown, set with the three runes the team earned, burning again
    const stage = el('div', { class: 'win-stage', html: winCrownSVG(state.rareSeals) });
    for (let i = 0; i < 18; i++) {
      const e = el('span', { class: 'win-ember' });
      e.style.left = (18 + Math.random() * 64) + '%';
      e.style.animationDelay = (0.4 + Math.random() * 3.6) + 's';
      e.style.animationDuration = (2.6 + Math.random() * 2.2) + 's';
      const size = (2 + Math.random() * 2.5).toFixed(1);
      e.style.width = size + 'px'; e.style.height = size + 'px';
      stage.appendChild(e);
    }
    panel.appendChild(stage);
    panel.appendChild(text('p', 'panel-label', state.teamName ? state.teamName.toUpperCase() : PL('THE TEAM', 'L\u2019\u00c9QUIPE')));
    panel.appendChild(text('div', 'stamp', 'THE CROWN IS YOURS'));
    panel.appendChild(text('p', null, PL(
      'You cleared all three doors and twelve seals to reclaim the Ember Crown in ' + m + 'm ' + String(s).padStart(2, '0') + 's. Now, back to business \u2014 on to today\u2019s agenda.',
      'Vous avez franchi les trois portes et bris\u00e9 les douze sceaux pour reprendre la Couronne de Braise en ' + m + '\u00a0min ' + String(s).padStart(2, '0') + '\u00a0s. Et maintenant, au travail\u00a0: place \u00e0 l\u2019ordre du jour.')));
    const plate = (label, value) => el('div', { class: 'win-plate' }, [text('span', 'win-plate-label', label), text('span', 'win-plate-value', value)]);
    panel.appendChild(el('div', { class: 'win-plates' }, [
      plate('TIME', formatClock(finalSecs)),
      plate('SEALS', '12 / 12'),
      plate('HINTS', hintsTaken === 0 ? 'None' : String(hintsTaken))
    ]));
    const again = text('button', 'win-again', 'Play again');
    again.addEventListener('click', () => {
      state.started = false;
      state.doorIndex = 0;
      state.puzzleInDoor = 0;
      state.collected = [];
      state.rareSeals = [];
      state.selectedRunes = [];
      state.hintShown = {};
      state.hintTier = {};
      state.wrongCount = {};
      state.endTime = null;
      state.diffFound = {};
      state.matchState = {};
      state.dialValue = {};
      state.pendingAdvance = null;
      state.pendingCrossing = null;
      state.pendingFinalUnlock = null;
      state.wonGame = false;
      state.victoryPlayed = false;
      state.calloutFired = [false, false, false];
      state.gearTiles = {};
      state.scrollOpened = false;
      state.pairBudget = null;
      state.solvedIds = [];
      state.bookOrder = null;
      state.bookCelebrating = false;
      state.ringRot = null;
      state.progressSeen = null;
      state.lockTaps = 0;
      state.journalUnseen = false;
      state.finalStage = 1;
      state.altarSoundPlayed = false;
      state.finalTray = null;
      state.wheelPos = null;
      state.wheelEngaged = null;
      state.wheelTurns = 0;
      state.vaultOpened = false;
      flattenPuzzles().forEach(p => { p._solved = false; });
      clearInterval(state.timerHandle);
      stopAmbience();
      stopVictoryMusic();
      render();
    });
    const journalBtn = text('button', 'ghost win-journal', 'View journal');
    journalBtn.addEventListener('click', () => openJournal());
    panel.appendChild(el('div', { class: 'win-actions' }, [again, journalBtn]));
    return el('div', {}, [panel]);
  }


  // Sound is decoration: if any sound fails on a device, the game carries on
  // silently instead of stopping mid-seal.
  function guardAudio(fn) {
    return function () {
      try { return fn.apply(this, arguments); } catch (e) { return undefined; }
    };
  }
  playLockUnlockSound = guardAudio(playLockUnlockSound);
  playDoorCrossingSound = guardAudio(playDoorCrossingSound);
  playFinalRevealSound = guardAudio(playFinalRevealSound);
  playCalloutSting = guardAudio(playCalloutSting);
  playAltarSinkSound = guardAudio(playAltarSinkSound);
  playTreasureFanfare = guardAudio(playTreasureFanfare);
  playSoftTap = guardAudio(playSoftTap);
  playBookThud = guardAudio(playBookThud);
  playScrollUnrollSound = guardAudio(playScrollUnrollSound);
  startAmbience = guardAudio(startAmbience);
  stopAmbience = guardAudio(stopAmbience);
  setAmbienceMuted = guardAudio(setAmbienceMuted);
  duckAmbience = guardAudio(duckAmbience);
  stopVictoryMusic = guardAudio(stopVictoryMusic);
  playVictoryMusic = guardAudio(playVictoryMusic);
  playAdventureTheme = guardAudio(playAdventureTheme);
  stopAdventureTheme = guardAudio(stopAdventureTheme);
  playGrandRevealSound = guardAudio(playGrandRevealSound);

  applyLangToPage();
  render();
})();
</script>
</body>
