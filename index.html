  const BOOK_SYMBOLS = {
    crown: '<path d="M4 17 L4 8.5 L8 12 L12 5.5 L16 12 L20 8.5 L20 17 Z" fill="currentColor"/><rect x="3.5" y="17.5" width="17" height="2.6" rx="0.8" fill="currentColor"/>',
    flame: '<path d="M12 2.5 C7.5 8 6.8 12.5 8.6 16.2 C9.7 18.4 11 19.5 12 19.5 C13 19.5 14.3 18.4 15.4 16.2 C17.2 12.5 16.5 8 12 2.5 Z M12 10 C10.6 12.5 10.7 14.8 12 17 C13.3 14.8 13.4 12.5 12 10 Z" fill="currentColor" fill-rule="evenodd"/>',
    key: '<circle cx="7.5" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11.3 12 H21 M17.5 12 V15.5 M20.3 12 V14.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    moon: '<path d="M16 3.5 A8.8 8.8 0 1 0 16 20.5 A10.5 10.5 0 0 1 16 3.5 Z" fill="currentColor" transform="translate(2.5 0)"/>',
    star: '<path d="M12 2.8 L14.6 8.9 L21.2 9.4 L16.2 13.7 L17.7 20.2 L12 16.7 L6.3 20.2 L7.8 13.7 L2.8 9.4 L9.4 8.9 Z" fill="currentColor"/>',
    eye: '<path d="M2 12 C5.5 6.5 9 5 12 5 C15 5 18.5 6.5 22 12 C18.5 17.5 15 19 12 19 C9 19 5.5 17.5 2 12 Z" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3.3" fill="currentColor"/>',
    hourglass: '<path d="M6 3 H18 M6 21 H18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M7.5 3.5 C7.5 9 12 10 12 12 C12 14 7.5 15 7.5 20.5 H16.5 C16.5 15 12 14 12 12 C12 10 16.5 9 16.5 3.5 Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20 C9.5 17.5 14.5 17.5 15 20 Z" fill="currentColor"/>'
  };
  // Seven books: each has a height (tall, middle, short) and a thickness (wide,
  // thin). Outlines come in pairs except the hourglass; the two readable symbols
  // and the librarian's note ("the moon was shelved beside the star") leave
  // exactly one order that fits.
  const BOOKS = {
    crown: { h: 'T', w: 'W', spine: '#8C6420' }, flame: { h: 'T', w: 'W', spine: '#9C3A28' },
    key: { h: 'M', w: 'N', spine: '#2F6E68' },   moon: { h: 'M', w: 'N', spine: '#4B3F7A' },
    star: { h: 'S', w: 'W', spine: '#7A2E48' },  eye: { h: 'S', w: 'W', spine: '#4A4A52' },
    hourglass: { h: 'M', w: 'W', spine: '#5E6A3A' }
  };
  // Spoken names of the seven book symbols, for screen readers.
  const BOOK_NAMES_FR = { crown: 'couronne', flame: 'flamme', key: 'cl\u00e9', moon: 'lune', star: '\u00e9toile', eye: '\u0153il', hourglass: 'sablier' };
  const BOOK_HEIGHT = { T: 132, M: 112, S: 92 };
  const BOOK_WIDTH = { W: 42, N: 28 };
  const BOOK_ANSWER = ['key', 'crown', 'hourglass', 'eye', 'flame', 'star', 'moon'];
  const BOOK_READABLE = [1, 5];               // symbols still legible on the card
  const BOOK_START = ['flame', 'moon', 'star', 'key', 'hourglass', 'crown', 'eye'];
  const BOOK_NOTE = 'The moon was shelved beside the star. \u2014 A.';
  const bookSymbolSVG = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${BOOK_SYMBOLS[name]}</svg>`;

  function buildBooksPuzzle(puzzle, panel, hint, solve) {
    const id = puzzle.id;
    if (!state.bookOrder) state.bookOrder = {};
    if (!state.bookOrder[id]) state.bookOrder[id] = BOOK_START.slice();
    const order = state.bookOrder[id];

    const card = el('div', { class: 'library-card book-sweep' });
    card.appendChild(text('p', 'library-card-title', 'LIBRARY CARD \u00b7 THIS SHELF'));
    const sky = el('div', { class: 'library-card-sky' });
    BOOK_ANSWER.forEach((name, i) => {
      const slot = el('div', { class: 'card-slot' + (BOOK_READABLE.includes(i) ? ' inked' : ''), 'data-name': name, style: 'height:' + Math.round(BOOK_HEIGHT[BOOKS[name].h] * 0.5) + 'px; width:' + Math.round(BOOK_WIDTH[BOOKS[name].w] * 0.62) + 'px;' });
      slot.appendChild(BOOK_READABLE.includes(i)
        ? el('span', { class: 'card-ink', html: bookSymbolSVG(name) })
        : el('span', { class: 'card-faded', 'aria-hidden': 'true' }));
      sky.appendChild(slot);
    });
    card.appendChild(sky);
    const pencil = text('p', 'library-card-pencil', BOOK_NOTE);
    card.appendChild(pencil);
    panel.appendChild(card);
    panel.appendChild(howTo('Tap a book to pick it up, then tap another book to swap them. Tap the same book again to put it back.'));

    const shelf = el('div', { class: 'book-shelf book-sweep', role: 'group', 'aria-label': 'Bookshelf' });
    const board = el('div', { class: 'book-shelf-board' });
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    let selected = null, solved = false, landed = [];

    function draw() {
      shelf.innerHTML = '';
      order.forEach((name, pos) => {
        const b = BOOKS[name];
        const book = el('button', {
          class: 'book' + (selected === pos ? ' selected' : '') + (landed.includes(pos) ? ' landed' : ''),
          type: 'button',
          style: 'height:' + BOOK_HEIGHT[b.h] + 'px; width:' + BOOK_WIDTH[b.w] + 'px; --spine:' + b.spine + ';',
          'aria-label': PL('Book ' + (pos + 1) + ', ' + name, 'Livre ' + (pos + 1) + ', ' + BOOK_NAMES_FR[name])
        });
        book.appendChild(el('span', { class: 'book-band' }));
        book.appendChild(el('span', { class: 'book-symbol', html: bookSymbolSVG(name) }));
        book.appendChild(el('span', { class: 'book-band' }));
        book.addEventListener('click', () => tap(pos));
        shelf.appendChild(book);
      });
      landed = [];
    }
    function tap(pos) {
      if (solved) return;
      if (selected === null) { selected = pos; playSoftTap('tick'); draw(); return; }
      if (selected !== pos) {
        [order[selected], order[pos]] = [order[pos], order[selected]];
        landed = [selected, pos];
        playBookThud();
        registerMiss(puzzle, null, hint, '', 16);
      }
      selected = null;
      draw();
      if (order.every((name, i) => name === BOOK_ANSWER[i])) {
        solved = true;
        state.collected.push(puzzle.title);
        state.bookCelebrating = true;
        celebrate(false);
      } else {
        const close = showNearMissLine();
        if (close) nearMiss();
      }
    }
    // Every outline fits but the order is wrong. The line is written on every
    // build too, so it survives a language change instead of vanishing.
    function showNearMissLine() {
      const close = !solved && order.every((name, i) =>
        BOOKS[name].h === BOOKS[BOOK_ANSWER[i]].h && BOOKS[name].w === BOOKS[BOOK_ANSWER[i]].w);
      feedback.className = close ? 'feedback nudge' : 'feedback';
      feedback.textContent = close ? T('Every outline matches the card, but the books are not in order yet.') : '';
      return close;
    }

    // Every outline fits, but the order is wrong: one shudder across the whole
    // shelf, and a flicker of the pencilled note. Nothing singles out a book,
    // so the near miss never says which one is in the wrong place.
    function nearMiss() {
      shelf.classList.remove('shudder');
      void shelf.offsetWidth;
      shelf.classList.add('shudder');
      pencil.classList.remove('flicker');
      void pencil.offsetWidth;
      setTimeout(() => { if (pencil.isConnected) pencil.classList.add('flicker'); }, 180);
    }

    // The shelf is right: the books settle in turn, the faded card inks itself
    // in beside them, and a warm sweep crosses the card and then the shelf.
    // `atOnce` finishes it immediately, for a rebuild or for reduced motion.
    function inkSlot(slot, animate) {
      if (slot.classList.contains('inked') || slot.dataset.filled) return;
      slot.dataset.filled = '1';
      const ghost = slot.querySelector('.card-faded');
      if (ghost) {
        if (animate) ghost.classList.add('dissolving');
        else ghost.remove();
      }
      const ink = el('span', { class: 'card-ink' + (animate ? ' arriving' : ''), html: bookSymbolSVG(slot.dataset.name) });
      slot.appendChild(ink);
      slot.classList.add('inking');
    }
    function finishCelebration() {
      if (!panel.isConnected) return;       // a rebuild took over
      state.bookCelebrating = false;
      solve();
    }
    function celebrate(atOnce) {
      const slots = [...card.querySelectorAll('.card-slot')];
      const books = [...shelf.querySelectorAll('.book')];
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (atOnce || reduced) {
        slots.forEach((slot) => inkSlot(slot, false));
        setTimeout(finishCelebration, atOnce ? 300 : 650);
        return;
      }
      books.forEach((book, i) => setTimeout(() => { if (book.isConnected) book.classList.add('settle'); }, i * 55));
      slots.forEach((slot, i) => setTimeout(() => { if (slot.isConnected) inkSlot(slot, true); }, 560 + i * 95));
      setTimeout(() => {
        if (!card.isConnected) return;
        card.classList.add('run', 'glow');
      }, 1340);
      setTimeout(() => {
        if (!shelf.isConnected) return;
        shelf.classList.add('run');
        board.classList.add('lit');
        books.forEach((book, i) => setTimeout(() => { if (book.isConnected) book.classList.add('lit'); }, i * 60));
      }, 1620);
      setTimeout(finishCelebration, 2600);
    }

    draw();
    panel.appendChild(shelf);
    panel.appendChild(board);
    panel.appendChild(feedback);
    showNearMissLine();
    // A language change rebuilds this panel mid-celebration. The old panel's
    // timers stop themselves (they check isConnected), and the new one picks
    // the moment up where it left off rather than replaying it.
    if (state.bookCelebrating && !solved) {
      solved = true;
      celebrate(true);
    }
  }

  function playBookThud() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    playNoiseBurst(ctx, { duration: 0.08, gain: 0.07, filterType: 'lowpass', filterFreq: 700, q: 0.8 });
    playTone(ctx, { freq: 140, freqEnd: 90, type: 'sine', duration: 0.07, gain: 0.06, attack: 0.003, release: 0.12 });
  }

  // ---------- The seal of rings (Deep Archive) ----------
  // One picture of the Ember Crown's mark, carved across a fixed centre stone and
  // three rings. Each ring turns around the same centre point when dragged, in
  // either direction, and settles into one of twelve positions when let go. A tap
  // never moves a ring, and a ring stays chosen until it is released.
  const RING_BANDS = [[46, 76], [76, 108], [108, 143]];
  // A fresh scramble every game: each ring starts 30-330 degrees out, never in place.
  function randomRingStart() {
    return [0, 1, 2].map(() => (1 + Math.floor(Math.random() * 11)) * 30 * (Math.random() < 0.5 ? 1 : -1));
  }

  // The mark of the Ember Crown, carved across the centre stone and three rings.
  // No pattern repeats around a ring, so each ring lines up in exactly one place:
  //   inner ring  - the crown's points, two keys and a run of eight runes
  //   middle ring - the flame and the EMBER · CROWN banner
  //   outer ring  - the laurel, the flame's tip and a star
  function ringsEmblemSVG() {
    const P = (x) => x.toFixed(1);
    const studs = Array.from({ length: 36 }).map((_, i) => {
      const a = (i / 36) * Math.PI * 2;
      return `<circle cx="${P(150 + Math.cos(a) * 138)}" cy="${P(150 + Math.sin(a) * 138)}" r="${i % 3 ? 1.5 : 2.6}" fill="${i % 3 ? '#D9A441' : '#F3D27A'}" stroke="#4A3210" stroke-width="0.5"/>`;
    }).join('');
    const leaves = [];
    [-1, 1].forEach((side) => {
      for (let i = 0; i < 8; i++) {
        const a = Math.PI / 2 + side * (0.3 + i * 0.26);
        const x = 150 + Math.cos(a) * 124, y = 150 + Math.sin(a) * 124;
        leaves.push(`<ellipse cx="${P(x)}" cy="${P(y)}" rx="8" ry="3.4" fill="${i % 2 ? '#C9962E' : '#8C6420'}" stroke="#4A3210" stroke-width="0.6" transform="rotate(${P(a * 180 / Math.PI + side * 55)} ${P(x)} ${P(y)})"/>`);
      }
    });
    const runePaths = ['M0 -7 V7 M0 -3 L5 -7', 'M0 -7 V7 M-4 -7 L0 -2 L4 -7', 'M-4 -7 L4 7 M4 -7 L-4 7', 'M-4 7 L0 -7 L4 7', 'M0 -7 V7 M-4 -2 H4', 'M-4 -6 L0 0 L-4 6 M0 0 H4', 'M0 7 V-7 L4 -3 L0 1', 'M-4 -7 V7 M-4 0 L4 -7 M-4 0 L4 7'];
    const runes = [30, 52, 74, 96, 118, 140, 162, 184].map((deg, i) => {
      const a = deg * Math.PI / 180;
      return `<g transform="translate(${P(150 + Math.cos(a) * 61)} ${P(150 + Math.sin(a) * 61)}) rotate(${deg + 90})"><path d="${runePaths[i]}" stroke="#E3B560" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`;
    }).join('');
    // banner letters placed one by one along the lower arc, upright when solved
    const word = PL('EMBER \u00b7 CROWN', 'COURONNE DE BRAISE');
    const bannerStep = PL(7.2, 6.4);
    const letters = word.split('').map((ch, i) => {
      const deg = 90 + (i - (word.length - 1) / 2) * -bannerStep;
      const a = deg * Math.PI / 180;
      return `<text x="0" y="3.5" text-anchor="middle" transform="translate(${P(150 + Math.cos(a) * 88)} ${P(150 + Math.sin(a) * 88)}) rotate(${P(deg - 90)})" font-family="Cinzel, Georgia, serif" font-size="10" font-weight="700" fill="#F3D27A">${ch}</text>`;
    }).join('');
    const key = (x, y, r) => `<g transform="translate(${x} ${y}) rotate(${r})"><path d="M0 0 H24 M18 0 V5 M22 0 V4" stroke="#D9A441" stroke-width="3" stroke-linecap="round"/><circle cx="-5" cy="0" r="5" fill="none" stroke="#D9A441" stroke-width="2.6"/></g>`;
    return `
      <circle cx="150" cy="150" r="143" fill="url(#rgStone)"/>
      ${[58, 92, 126].map((r) => `<circle cx="150" cy="150" r="${r}" fill="none" stroke="#6E4A14" stroke-width="0.8" opacity="0.5"/>`).join('')}
      <circle cx="150" cy="150" r="133" fill="none" stroke="#8C6420" stroke-width="2"/>
      ${studs}
      ${leaves.join('')}
      <path d="M150 118 L145 124 L150 130 L155 124 Z" fill="#F3D27A" stroke="#4A3210" stroke-width="0.8"/>
      <path d="M150 24 C124 54 128 80 140 96 C132 72 146 60 150 46 C154 60 168 72 160 96 C172 80 176 54 150 24 Z" fill="url(#rgFlame)" stroke="#5A1E10" stroke-width="1.6"/>
      <path d="M150 52 C138 70 140 86 150 100 C160 86 162 70 150 52 Z" fill="#F2A93B"/>
      <path d="M150 72 C145 82 146 92 150 100 C154 92 155 82 150 72 Z" fill="#FFE39A"/>
      <path d="M86 214 A84 84 0 0 0 214 214 L206 204 A74 74 0 0 1 94 204 Z" fill="#6A1E14" stroke="#3A0A06" stroke-width="1"/>
      ${letters}
      ${key(96, 108, -35)}${key(204, 108, 215)}
      ${runes}
      <path d="M92 176 L92 120 L112 140 L130 104 L150 126 L170 104 L188 140 L208 120 L208 176 Z" fill="url(#rgGold)" stroke="#4A3210" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M100 170 L100 136 L112 150 L130 120 L150 140 L170 120 L188 150 L200 136 L200 170 Z" fill="#FFE39A" opacity="0.25"/>
      ${[[92, 118], [130, 102], [170, 102], [208, 118]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#FFF1C4" stroke="#4A3210" stroke-width="1.5"/>`).join('')}
      <rect x="86" y="172" width="128" height="22" rx="3" fill="url(#rgBand)" stroke="#4A3210" stroke-width="2.6"/>
      <circle cx="115" cy="183" r="7" fill="#4E9490" stroke="#4A3210" stroke-width="2"/>
      <circle cx="150" cy="183" r="7.5" fill="#7B5EA7" stroke="#4A3210" stroke-width="2"/>
      <circle cx="185" cy="183" r="7" fill="#C1533E" stroke="#4A3210" stroke-width="2"/>
      <circle cx="113" cy="181" r="2" fill="#FFFFFF" opacity="0.45"/><circle cx="148" cy="181" r="2" fill="#FFFFFF" opacity="0.45"/><circle cx="183" cy="181" r="2" fill="#FFFFFF" opacity="0.45"/>
      <path d="M150 262 L153 269 L160 269 L154.5 273.5 L156.5 280.5 L150 276 L143.5 280.5 L145.5 273.5 L140 269 L147 269 Z" fill="#F3D27A" stroke="#4A3210" stroke-width="0.8"/>`;
  }
  // small brass cogs drawn on the ring joints to show the rings are geared together
  function ringPinionSVG(deg, r) {
    const a = deg * Math.PI / 180, cx = 150 + Math.cos(a) * r, cy = 150 + Math.sin(a) * r;
    const teeth = Array.from({ length: 10 }).map((_, k) => `<rect x="${(cx - 1.8).toFixed(1)}" y="${(cy - 9).toFixed(1)}" width="3.6" height="5" rx="0.6" transform="rotate(${k * 36} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="#C9962E" stroke="#3A2408" stroke-width="0.6"/>`).join('');
    return `<g class="ring-pinion">${teeth}<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#C9962E" stroke="#3A2408" stroke-width="1"/><circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="2.4" fill="#3A2408"/></g>`;
  }

  function buildRingsPuzzle(puzzle, panel, hint, solve, setReveal) {
    const id = puzzle.id;
    if (!state.ringRot) state.ringRot = {};
    if (!state.ringRot[id]) state.ringRot[id] = randomRingStart();
    const rot = state.ringRot[id];
    const masks = RING_BANDS.map(([r0, r1], i) =>
      `<mask id="rgMask${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300"><circle cx="150" cy="150" r="${r1}" fill="#fff"/><circle cx="150" cy="150" r="${r0}" fill="#000"/></mask>`).join('');
    const svgHTML = `
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A round stone seal with three rings that turn when dragged, or with the turn buttons below">
        <defs>
          <radialGradient id="rgStone" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#5A3E1A"/><stop offset="1" stop-color="#2A1C0C"/></radialGradient>
          <linearGradient id="rgGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE39A"/><stop offset="0.55" stop-color="#D9A441"/><stop offset="1" stop-color="#8C6420"/></linearGradient>
          <linearGradient id="rgBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9962E"/><stop offset="1" stop-color="#7A5414"/></linearGradient>
          <linearGradient id="rgFlame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2A93B"/><stop offset="1" stop-color="#C1533E"/></linearGradient>
          <radialGradient id="rgHold" cx="50%" cy="50%" r="50%"><stop offset="0.6" stop-color="#FFE9A8" stop-opacity="0"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0.35"/></radialGradient>
          <g id="rgEmblem">${ringsEmblemSVG()}</g>
          ${masks}
          <clipPath id="rgCentre"><circle cx="150" cy="150" r="46"/></clipPath>
        </defs>
        <circle cx="150" cy="150" r="148" fill="#1A120B" stroke="#8C6420" stroke-width="2"/>
        ${[2, 1, 0].map((i) => `<g mask="url(#rgMask${i})"><g class="ring-turn" data-ring="${i}"><use href="#rgEmblem"/></g></g>`).join('')}
        <use href="#rgEmblem" clip-path="url(#rgCentre)"/>
        <g fill="none" stroke="#120C06" stroke-width="3.2">
          <circle cx="150" cy="150" r="46"/><circle cx="150" cy="150" r="76"/><circle cx="150" cy="150" r="108"/><circle cx="150" cy="150" r="143"/>
        </g>
        <g fill="none" stroke="#FFE9A8" stroke-width="0.8" opacity="0.25">
          <circle cx="150" cy="150" r="47.5"/><circle cx="150" cy="150" r="77.5"/><circle cx="150" cy="150" r="109.5"/>
        </g>
        ${ringPinionSVG(-20, 76)}${ringPinionSVG(200, 108)}
        <circle class="ring-hold" cx="150" cy="150" r="0" fill="none" stroke="#FFE9A8" opacity="0"/>
        <circle class="ring-glow" cx="150" cy="150" r="146" fill="none" stroke="#F2C35A" stroke-width="5" opacity="0"/>
      </svg>`;
    const stage = el('div', { class: 'rings-stage', html: svgHTML });
    panel.appendChild(howTo('Drag a ring to turn it, in either direction, or use the turn buttons below the seal. The rings are geared: when you turn a ring, the ring inside it turns the other way. Let go, and the rings settle into place. The centre stone does not move.'));
    panel.appendChild(stage);
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    panel.appendChild(feedback);

    const svg = stage.querySelector('svg');
    const groups = [0, 1, 2].map((i) => svg.querySelector('.ring-turn[data-ring="' + i + '"]'));
    const hold = svg.querySelector('.ring-hold');
    const glow = svg.querySelector('.ring-glow');
    const anim = [0, 0, 0];
    let solved = false, drag = null;
    const set = (i, deg) => groups[i].setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' 150 150)');
    const isHome = (d) => ((Math.round(d) % 360) + 360) % 360 === 0;
    function snapTo(i, target) {
      cancelAnimationFrame(anim[i]);
      const from = rot[i], t0 = performance.now();
      rot[i] = target;
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 200), e = 1 - Math.pow(1 - k, 3);
        set(i, from + (target - from) * e);
        if (k < 1) anim[i] = requestAnimationFrame(step);
      };
      anim[i] = requestAnimationFrame(step);
    }
    function checkSolved() {
      if (solved || !rot.every(isHome)) return;
      solved = true;
      glow.setAttribute('opacity', '1');
      stage.classList.add('solved');
      state.collected.push(puzzle.title);
      setTimeout(solve, 900);
    }
    function point(e) {
      const r = svg.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * 300 - 150, y: (e.clientY - r.top) / r.height * 300 - 150 };
    }
    const angle = (p) => Math.atan2(p.y, p.x) * 180 / Math.PI;
    svg.addEventListener('pointerdown', (e) => {
      if (solved || drag) return;
      const p = point(e), d = Math.hypot(p.x, p.y);
      const i = RING_BANDS.findIndex(([r0, r1]) => d >= r0 && d <= r1);
      if (i < 0) return;
      cancelAnimationFrame(anim[i]);
      if (i > 0) cancelAnimationFrame(anim[i - 1]);
      drag = { i, last: angle(p), moved: false, lastDetent: Math.round(rot[i] / 30), start: rot.slice() };
      svg.setPointerCapture(e.pointerId);
      stage.classList.add('dragging');
      hold.setAttribute('r', (RING_BANDS[i][0] + RING_BANDS[i][1]) / 2);
      hold.setAttribute('stroke-width', RING_BANDS[i][1] - RING_BANDS[i][0]);
      hold.setAttribute('opacity', '0.16');
      e.preventDefault();
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const a = angle(point(e));
      let d = a - drag.last;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      drag.last = a;
      if (!drag.moved && Math.abs(d) < 1.5) return;   // a tap never turns a ring
      drag.moved = true;
      rot[drag.i] += d;
      set(drag.i, rot[drag.i]);
      if (drag.i > 0) { rot[drag.i - 1] -= d; set(drag.i - 1, rot[drag.i - 1]); }   // geared to the ring inside
      const detent = Math.round(rot[drag.i] / 30);
      if (detent !== drag.lastDetent) { drag.lastDetent = detent; playSoftTap('tick'); }
    });
    const release = () => {
      if (!drag) return;
      const i = drag.i, moved = drag.moved, start = drag.start;
      drag = null;
      stage.classList.remove('dragging');
      hold.setAttribute('opacity', '0');
      const target = Math.round(rot[i] / 30) * 30;
      snapTo(i, target);
      if (i > 0) snapTo(i - 1, start[i - 1] - (target - start[i]));
      if (moved) {
        playBookThud();
        registerMiss(puzzle, null, hint, '', 18);
      }
      checkSolved();
    };
    svg.addEventListener('pointerup', release);
    svg.addEventListener('pointercancel', release);
    rot.forEach((deg, i) => set(i, deg));

    // Turn buttons: the same geared move as a drag, one notch at a time, for
    // anyone who finds dragging in a circle awkward (or is using a keyboard).
    function stepRing(i, dir) {
      if (solved || drag) return;
      const target = Math.round(rot[i] / 30) * 30 + dir * 30;
      if (i > 0) snapTo(i - 1, Math.round(rot[i - 1] / 30) * 30 - dir * 30);   // geared to the ring inside
      snapTo(i, target);
      playSoftTap('tick');
      registerMiss(puzzle, null, hint, '', 18);
      setTimeout(checkSolved, 220);
    }
    const controls = el('div', { class: 'ring-controls' });
    [[2, 'OUTER'], [1, 'MIDDLE'], [0, 'INNER']].forEach(([i, name]) => {
      const lower = name.toLowerCase();
      const anti = text('button', 'ghost ring-arrow', '\u21BA');
      anti.type = 'button';
      anti.setAttribute('aria-label', PL('Turn the ' + lower + ' ring anticlockwise',
        'Tourner l\u2019anneau ' + RING_NAMES_FR[name] + ' dans le sens inverse des aiguilles d\u2019une montre'));
      const clock = text('button', 'ghost ring-arrow', '\u21BB');
      clock.type = 'button';
      clock.setAttribute('aria-label', PL('Turn the ' + lower + ' ring clockwise',
        'Tourner l\u2019anneau ' + RING_NAMES_FR[name] + ' dans le sens des aiguilles d\u2019une montre'));
      anti.addEventListener('click', () => stepRing(i, -1));
      clock.addEventListener('click', () => stepRing(i, 1));
      controls.appendChild(el('div', { class: 'ring-ctrl' }, [anti, text('span', 'ring-ctrl-name', PL(name + ' RING', 'ANNEAU ' + RING_NAMES_FR[name].toUpperCase())), clock]));
    });
    stage.after(controls);

    // Final hint: turn one ring that is out of place into position for the team.
    setReveal(() => {
      if (solved) return;
      // the outermost ring that is out of place, so the team can carry on inwards
      let i = -1;
      for (let k = 2; k >= 0; k--) if (!isHome(rot[k])) { i = k; break; }
      if (i < 0) return;
      snapTo(i, Math.round(rot[i] / 360) * 360);
      playBookThud();
      setTimeout(checkSolved, 250);
    });
  }

  // ---------- Tiered hints ----------
  // Tier 1 nudges, tier 2 gives a real clue, tier 3 is the last resort. For
  // spot-the-difference and memory puzzles, tier 3 is an action (a glowing ring
  // or a brief peek) so the team still makes the final find themselves.
  // Ring names used inside built-up sentences, where French needs the noun first.
  const RING_NAMES_FR = { OUTER: 'ext\u00e9rieur', MIDDLE: 'du milieu', INNER: 'int\u00e9rieur' };
  // "Rune of the Deep Archive" contracts to "des" in French, so each door
  // carries its whole phrase rather than a name glued onto "de".
  const RUNE_OF_FR = {
    'The Reading Room': 'Rune de la Salle de lecture',
    'The Cipher Vault': 'Rune de la Crypte des chiffres',
    'The Deep Archive': 'Rune des Archives profondes'
  };
  const HINT_TIER_LABELS = ['HINT 1 \u00b7 A NUDGE', 'HINT 2 \u00b7 A CLUE', 'HINT 3 \u00b7 FINAL HELP'];

  function buildHint(puzzle, onRevealAction) {
    const id = puzzle.id;
    const hints = puzzle.hints || [];
    if (state.hintTier[id] === undefined) state.hintTier[id] = 0;

    const box = el('div', { class: 'hint-box' });
    const controls = el('div', { class: 'hint-controls' });
    const stack = el('div', { class: 'hint-stack' });
    const mainBtn = el('button', { class: 'hint-toggle', type: 'button' });
    const hideBtn = el('button', { class: 'hint-toggle secondary', type: 'button' });

    function addItem(i, animate) {
      const item = el('div', { class: 'hint-item tier-' + (i + 1) });
      if (!animate) item.style.animation = 'none';
      item.appendChild(text('span', 'hint-tier', HINT_TIER_LABELS[i]));
      item.appendChild(document.createTextNode(T(hints[i])));
      stack.appendChild(item);
    }
    function refresh() {
      const tier = state.hintTier[id];
      const collapsed = tier > 0 && state.hintShown[id] === false;
      stack.className = 'hint-stack' + (collapsed ? ' collapsed' : '');
      if (tier === 0) mainBtn.textContent = T('Need a hint?');
      else if (tier === 1) mainBtn.textContent = T('Need a stronger hint?');
      else if (tier === 2) mainBtn.textContent = T(puzzle.reveal === 'ring' ? 'Set one ring for me'
        : puzzle.reveal === 'diff' ? 'Show me one I have not found'
        : puzzle.reveal === 'peek' ? 'Show all symbols briefly' : 'Reveal the answer');
      else mainBtn.textContent = T(puzzle.reveal === 'ring' ? 'Set another ring' : puzzle.reveal === 'diff' ? 'Show me another' : puzzle.reveal === 'peek' ? 'Show them again' : '');
      mainBtn.style.display = mainBtn.textContent ? '' : 'none';
      hideBtn.textContent = T(collapsed ? 'Show hints' : 'Hide hints');
      hideBtn.style.display = tier > 0 ? '' : 'none';
    }

    for (let i = 0; i < state.hintTier[id]; i++) addItem(i, false);

    mainBtn.addEventListener('click', () => {
      mainBtn.classList.remove('nudge');
      const tier = state.hintTier[id];
      state.hintShown[id] = true;
      if (tier < hints.length) {
        state.hintTier[id] = tier + 1;
        addItem(tier, true);
        if (tier === 2 && onRevealAction) onRevealAction();
      } else if (onRevealAction) {
        onRevealAction();
      }
      refresh();
    });
    hideBtn.addEventListener('click', () => {
      state.hintShown[id] = state.hintShown[id] === false;
      refresh();
    });

    controls.appendChild(mainBtn);
    controls.appendChild(hideBtn);
    box.appendChild(controls);
    box.appendChild(stack);
    refresh();
    return { box, button: mainBtn };
  }

  // Wrong attempts are met first with a plain response, then with a gentle,
  // in-world pointer toward the hints — never an automatic reveal.
  function registerMiss(puzzle, feedback, hint, plainMsg, threshold) {
    const id = puzzle.id;
    state.wrongCount[id] = (state.wrongCount[id] || 0) + 1;
    const n = state.wrongCount[id];
    const hintsLeft = (state.hintTier[id] || 0) < (puzzle.hints || []).length;
    const nudgeNow = hintsLeft && n >= threshold && (n - threshold) % 2 === 0;
    if (!feedback) { if (nudgeNow) pulseHint(hint); return nudgeNow; }
    if (plainMsg) {
      const pnl = feedback.closest('.panel');
      if (pnl) fxWrong(pnl);
      // The pennants and the pictures already make their own miss sound.
      if (puzzle.type !== 'grid' && puzzle.type !== 'diff') playSoftTap('miss');
    }
    if (nudgeNow) {
      const tier = state.hintTier[id] || 0;
      const line = tier === 0
        ? plainMsg + ' If the team is stuck, a hint below may help you see it another way.'
        : plainMsg + ' A stronger hint is waiting below whenever you want it.';
      feedback.className = 'feedback bad';
      feedback.textContent = T(line);
      pulseHint(hint);
    } else {
      feedback.className = 'feedback bad';
      feedback.textContent = T(plainMsg);
    }
    // restart the shake animation on repeat attempts
    void feedback.offsetWidth;
    return nudgeNow;
  }
  function pulseHint(hint) {
    hint.button.classList.remove('nudge');
    void hint.button.offsetWidth;
    hint.button.classList.add('nudge');
  }

  function playSoftTap(kind) {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (kind === 'miss') {
      playTone(ctx, { freq: 150, freqEnd: 95, type: 'sine', duration: 0.09, gain: 0.07, release: 0.08 });
    } else if (kind === 'find') {
      playTone(ctx, { freq: 1175, type: 'sine', duration: 0.12, gain: 0.05, release: 0.35 });
      playTone(ctx, { freq: 1568, type: 'sine', start: 0.07, duration: 0.12, gain: 0.035, release: 0.4 });
    } else if (kind === 'tick') {
      playNoiseBurst(ctx, { duration: 0.02, gain: 0.05, filterType: 'bandpass', filterFreq: 2600, q: 3 });
    }
  }

  function buildPuzzle(doorIndex, puzzleInDoor) {
    const door = DOORS[doorIndex];
    const puzzle = door.puzzles[puzzleInDoor];
    const solve = () => triggerSolve(doorIndex, puzzleInDoor, puzzle.successNote);

    const panel = el('div', { class: 'panel' });
    panel.appendChild(text('p', 'panel-label', PL('SEAL ' + (puzzleInDoor + 1) + ' OF ' + door.puzzles.length,
      'SCEAU ' + (puzzleInDoor + 1) + ' SUR ' + door.puzzles.length)));
    panel.appendChild(text('h2', null, puzzle.title));
    panel.appendChild(text('p', null, puzzle.prompt));
    if (puzzle.visual) panel.appendChild(text('div', 'puzzle-visual', puzzle.visual));
    if (puzzle.rim) panel.appendChild(el('div', { class: 'rim-stage', html: wornRimSVG(puzzle.rim) }));

    // Built up front so each puzzle can point players toward it; appended last.
    let revealAction = null;
    const hint = buildHint(puzzle, () => { if (revealAction) revealAction(); });

    if (puzzle.type === 'text') {
      const input = el('input', { type: 'text', id: 'answerInput', placeholder: 'Your answer', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
      const submit = text('button', null, 'Try it');
      const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
      function attempt() {
        const val = input.value;
        if (!val.trim()) return;
        if (puzzle.check(val)) {
          submit.disabled = true; input.disabled = true;
          state.collected.push(puzzle.title);
          solve();
        } else {
          registerMiss(puzzle, feedback, hint, 'Not quite \u2014 try again.', 2);
          input.select();
        }
      }
      submit.addEventListener('click', attempt);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
      panel.appendChild(el('div', { class: 'answer-row' }, [input, submit]));
      panel.appendChild(feedback);
    }

    if (puzzle.type === 'diff') {
      const id = puzzle.id;
      const sceneFn = puzzle.sceneFn || sceneSVG;
      const spots = puzzle.spots || DIFF_SPOTS;
      if (!state.diffFound[id]) state.diffFound[id] = new Set();
      const foundSet = state.diffFound[id];
      let solved = foundSet.size >= spots.length;
      panel.appendChild(howTo(PL('Compare the two pictures. Whenever you see something that is different between them, tap or click it on either picture. A ring marks each one you find \u2014 find all ' + spots.length + ' to open the seal.', 'Comparez les deux images. D\u00e8s que vous voyez quelque chose de diff\u00e9rent entre elles, touchez-le ou cliquez dessus, sur l\u2019une ou l\u2019autre image. Un cercle marque chaque changement trouv\u00e9\u00a0: trouvez les ' + spots.length + ' pour ouvrir le sceau.')));
      const progress = el('div', { class: 'diff-progress', 'aria-live': 'polite' }, [document.createTextNode(PL('Found ' + foundSet.size + ' of ' + spots.length, 'Trouv\u00e9s\u00a0: ' + foundSet.size + ' sur ' + spots.length))]);
      panel.appendChild(progress);
      const nudgeLine = el('div', { class: 'feedback' });

      // Keep each ring fully inside the frame (the chandelier and lantern sit
      // right against the top edge), without moving it off its object.
      const pad = 0.8;
      const placed = spots.map((sp) => ({
        id: sp.id,
        x: Math.min(100 - sp.wPct / 2 - pad, Math.max(sp.wPct / 2 + pad, sp.xPct)),
        y: Math.min(100 - sp.hPct / 2 - pad, Math.max(sp.hPct / 2 + pad, sp.yPct)),
        w: sp.wPct, h: sp.hPct
      }));

      const rings = {}; // spot id -> [ringA, ringB]
      const frames = [];
      let progressTimer = null;
      // Rapid-fire tapping is guessing, not looking: after several quick misses
      // the pictures rest for a moment. Honest searching never triggers it.
      const INK_MISSES = 4, INK_WINDOW_MS = 5000, INK_REST_MS = 2500;
      let recentMisses = [], inkRestUntil = 0;
      function setProgress(msg, miss) {
        progress.textContent = T(msg);
        progress.className = 'diff-progress' + (miss ? ' miss' : '');
      }
      function showCount() { setProgress(PL('Found ' + foundSet.size + ' of ' + spots.length, 'Trouv\u00e9s\u00a0: ' + foundSet.size + ' sur ' + spots.length), false); }

      const gallery = el('div', { class: 'gallery' });
      ['A', 'B'].forEach((variant) => {
        const frame = el('div', { class: 'frame', html: sceneFn(variant), role: 'img', 'aria-label': T(variant === 'A' ? 'Yesterday' : 'Today') + PL(': illustration ', '\u00a0: illustration ') + variant });
        placed.forEach((sp) => {
          const ring = el('div', {
            class: 'diff-ring' + (foundSet.has(sp.id) ? ' found' : ''),
            style: 'left:' + sp.x + '%; top:' + sp.y + '%; width:' + sp.w + '%; height:' + sp.h + '%;'
          });
          if (foundSet.has(sp.id)) ring.style.animation = 'none';
          (rings[sp.id] = rings[sp.id] || []).push(ring);
          frame.appendChild(ring);
        });
        frame.addEventListener('click', (e) => {
          if (solved) return;
          if (Date.now() < inkRestUntil) {
            clearTimeout(progressTimer);
            setProgress('The ink needs a moment to settle. Look closely before you mark again.', true);
            return;
          }
          const r = frame.getBoundingClientRect();
          const px = e.clientX - r.left, py = e.clientY - r.top;
          // Hit-test every spot as an ellipse, generous enough for a fingertip
          // (at least ~24px radius), and take the closest match.
          let best = null, bestScore = Infinity;
          placed.forEach((sp) => {
            const cx = sp.x / 100 * r.width, cy = sp.y / 100 * r.height;
            const rx = Math.max(sp.w / 200 * r.width, 24), ry = Math.max(sp.h / 200 * r.height, 24);
            const score = Math.pow((px - cx) / rx, 2) + Math.pow((py - cy) / ry, 2);
            if (score <= 1 && score < bestScore) { best = sp; bestScore = score; }
          });
          if (best && foundSet.has(best.id)) {
            rings[best.id].forEach((ring) => { ring.classList.remove('again'); void ring.offsetWidth; ring.classList.add('again'); });
            clearTimeout(progressTimer);
            setProgress(PL('Already marked \u2014 ' + foundSet.size + ' of ' + spots.length + ' found',
              'D\u00e9j\u00e0 marqu\u00e9 \u2014 ' + foundSet.size + ' sur ' + spots.length + ' trouv\u00e9s'), false);
            progressTimer = setTimeout(showCount, 1400);
            return;
          }
          if (best) {
            foundSet.add(best.id);
            rings[best.id].forEach((ring) => { ring.classList.remove('reveal'); ring.style.animation = ''; ring.classList.add('found'); });
            clearTimeout(progressTimer);
            showCount();
            playSoftTap('find');
            if (foundSet.size >= spots.length && !puzzle._solved) {
              solved = true;
              puzzle._solved = true;
              state.collected.push(puzzle.title);
              setTimeout(solve, 550); // let the last ring land before the seal breaks
            }
            return;
          }
          // A miss: a small mark where they tapped, a muted thud, a brief line.
          const mark = el('div', { class: 'miss-mark', style: 'left:' + px + 'px; top:' + py + 'px;' });
          frame.appendChild(mark);
          setTimeout(() => mark.remove(), 700);
          playSoftTap('miss');
          clearTimeout(progressTimer);
          const now = Date.now();
          recentMisses = recentMisses.filter((t) => now - t < INK_WINDOW_MS);
          recentMisses.push(now);
          if (recentMisses.length >= INK_MISSES) {
            recentMisses = [];
            inkRestUntil = now + INK_REST_MS;
            gallery.classList.add('ink-resting');
            setTimeout(() => gallery.classList.remove('ink-resting'), INK_REST_MS);
            setProgress('The ink needs a moment to settle. Look closely before you mark again.', true);
            progressTimer = setTimeout(showCount, INK_REST_MS);
          } else {
            setProgress('Nothing has changed there', true);
            progressTimer = setTimeout(showCount, 1200);
          }
          if (registerMiss(puzzle, null, hint, '', 6)) {
            nudgeLine.className = 'feedback nudge';
            nudgeLine.textContent = T((state.hintTier[id] || 0) === 0
              ? 'These changes are small. If your eyes are tired, a hint waits below.'
              : 'Still searching? A stronger hint is waiting below.');
          }
        });
        frames.push(frame);
        gallery.appendChild(el('figure', { class: 'frame-fig' }, [text('figcaption', 'frame-cap', variant === 'A' ? 'Yesterday' : 'Today'), frame]));
      });
      panel.appendChild(gallery);
      panel.appendChild(nudgeLine);

      revealAction = () => {
        const missing = placed.filter((sp) => !foundSet.has(sp.id));
        if (!missing.length) return;
        const pick = missing[Math.floor(Math.random() * missing.length)];
        rings[pick.id].forEach((ring) => {
          ring.classList.remove('reveal'); void ring.offsetWidth; ring.classList.add('reveal');
          setTimeout(() => { if (!foundSet.has(pick.id)) ring.classList.remove('reveal'); }, 2600);
        });
        if (frames[0].scrollIntoView) frames[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
      };

      if (solved && !puzzle._solved) {
        puzzle._solved = true;
        state.collected.push(puzzle.title);
        solve();
      }
    }

    if (puzzle.type === 'grid') {
      // The makers' rules, with small pictures of the two end shapes.
      const plaque = el('div', { class: 'rules-plaque' });
      plaque.appendChild(text('p', 'rules-title', 'THE MAKERS\u2019 RULES'));
      const list = el('ol', { class: 'rules-list' });
      PENNANT_RULES.forEach((rule) => list.appendChild(text('li', null, rule.text)));
      plaque.appendChild(list);
      plaque.appendChild(text('p', 'rules-pencil', 'I copied out these rules before the ink faded. One pennant breaks them. \u2014 A.'));
      plaque.appendChild(el('div', { class: 'rules-key' }, [
        el('span', { class: 'rules-key-item' }, [el('span', { class: 'rules-key-pic', html: pennantShapeKey('tails') }), TN('two tails')]),
        el('span', { class: 'rules-key-item' }, [el('span', { class: 'rules-key-pic', html: pennantShapeKey('point') }), TN('one point')])
      ]));
      panel.appendChild(plaque);
      panel.appendChild(howTo('Pennants can look different from each other and still follow every rule. Check them one by one, and tap the one that breaks a rule.'));

      const grid = el('div', { class: 'icon-grid pennant-grid' });
      const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
      let done = false;
      PENNANTS.forEach((spec, i) => {
        const isOdd = i === ODD_INDEX;
        const cell = el('div', { class: 'icon-cell', html: pennantIcon(spec, i) });
        cell.addEventListener('click', () => {
          if (done) return;
          if (isOdd) {
            done = true;
            cell.classList.add('correct');
            state.collected.push(puzzle.title);
            setTimeout(solve, 700);
          } else {
            cell.classList.remove('shake');
            void cell.offsetWidth;
            cell.classList.add('shake');
            setTimeout(() => cell.classList.remove('shake'), 900);
            playSoftTap('miss');
            registerMiss(puzzle, feedback, hint, 'That pennant follows all three rules.', 3);
          }
        });
        grid.appendChild(cell);
      });
      panel.appendChild(grid);
      panel.appendChild(feedback);
    }

    if (puzzle.type === 'books') buildBooksPuzzle(puzzle, panel, hint, solve);
    if (puzzle.type === 'rings') buildRingsPuzzle(puzzle, panel, hint, solve, (fn) => { revealAction = fn; });
    if (puzzle.type === 'gears') buildGearCipher(puzzle, panel, hint, solve);

    if (puzzle.type === 'match') {
      const id = puzzle.id;
      if (!state.matchState[id]) {
        const order = dealPairs(puzzle.shapes);
        state.matchState[id] = { order, revealed: [], matched: [], busy: false, mismatches: 0 };
      }
      const ms = state.matchState[id];
      panel.appendChild(howTo('Flip two sigils at a time. If they match, they stay face up. Find all pairs to open the seal.'));
      const cols = ms.order.length <= 6 ? 3 : 4;
      const grid = el('div', { class: 'match-grid', style: 'grid-template-columns: repeat(' + cols + ', 1fr);' });
      const nudgeLine = el('div', { class: 'feedback' });

      // Build every card once; flips, mismatches, and matches are then handled
      // by toggling classes on these same elements directly (no full re-render),
      // so the CSS flip transition always plays cleanly with no layout jump.
      const cardEls = [];
      ms.order.forEach((shape, i) => {
        const isUp = ms.matched.includes(i) || ms.revealed.includes(i);
        const cell = el('button', { class: 'match-card' + (isUp ? ' flipped' : '') + (ms.matched.includes(i) ? ' matched' : '') });
        const inner = el('div', { class: 'match-card-inner' });
        const front = el('div', { class: 'match-card-face match-card-front', html: CARD_BACK_SVG });
        const back = el('div', { class: 'match-card-face match-card-back', html: matchIcon(shape, puzzle.colors[shape]) });
        inner.appendChild(front);
        inner.appendChild(back);
        cell.appendChild(inner);
        cell.disabled = ms.busy || ms.matched.includes(i) || ms.revealed.includes(i);
        cardEls.push(cell);

        cell.addEventListener('click', () => {
          if (ms.busy || ms.matched.includes(i) || ms.revealed.includes(i)) return;
          ms.revealed.push(i);
          cell.classList.add('flipped');

          if (ms.revealed.length === 2) {
            ms.busy = true;
            cardEls.forEach((c, ci) => { if (!ms.matched.includes(ci) && !ms.revealed.includes(ci)) c.disabled = true; });
            const [a, b] = ms.revealed;
            const isMatch = ms.order[a] === ms.order[b];
            // A mismatch stays up long enough for a team to call it out loud.
            setTimeout(() => {
              if (isMatch) {
                ms.matched.push(a, b);
                ms.revealed = [];
                ms.busy = false;
                cardEls[a].classList.add('matched');
                cardEls[b].classList.add('matched');
                cardEls.forEach((c, ci) => { if (!ms.matched.includes(ci)) c.disabled = false; });
                if (ms.matched.length === ms.order.length) {
                  state.collected.push(puzzle.title);
                  solve();
                }
              } else {
                cardEls[a].classList.remove('flipped');
                cardEls[b].classList.remove('flipped');
                ms.revealed = [];
                ms.busy = false;
                cardEls.forEach((c, ci) => { if (!ms.matched.includes(ci)) c.disabled = false; });
                ms.mismatches += 1;
                if (ms.mismatches >= 10 && registerMiss(puzzle, null, hint, '', 1)) {
                  nudgeLine.className = 'feedback nudge';
                  nudgeLine.textContent = T('These symbols are hard to remember. A hint below can help.');
                }
              }
            }, isMatch ? 700 : 1100);
          }
        });
        grid.appendChild(cell);
      });
      panel.appendChild(grid);
      panel.appendChild(nudgeLine);

      revealAction = () => {
        if (ms.busy) return;
        ms.busy = true;
        const hidden = [];
        cardEls.forEach((c, ci) => {
          c.disabled = true;
          if (!ms.matched.includes(ci) && !ms.revealed.includes(ci)) { hidden.push(ci); c.classList.add('flipped'); }
        });
        setTimeout(() => {
          hidden.forEach((ci) => cardEls[ci].classList.remove('flipped'));
          ms.busy = false;
          cardEls.forEach((c, ci) => { if (!ms.matched.includes(ci) && !ms.revealed.includes(ci)) c.disabled = false; });
        }, 1800);
      };
    }

    if (puzzle.type === 'dial') {
      const id = puzzle.id;
      if (state.dialValue[id] === undefined) state.dialValue[id] = puzzle.min;
      panel.appendChild(howTo('Drag the wheel up or down to turn it, or press and hold \u2212 / +. When it shows your number, set the dial.'));

      const ROW = 52;
      const clamp = (v) => Math.min(puzzle.max, Math.max(puzzle.min, v));
      const drum = el('div', {
        class: 'dial-drum', tabindex: '0', role: 'spinbutton',
        'aria-label': 'Combination dial', 'aria-valuemin': String(puzzle.min), 'aria-valuemax': String(puzzle.max)
      });
      const strip = el('div', { class: 'dial-strip' });
      drum.appendChild(strip);
      drum.appendChild(el('div', { class: 'dial-window' }));

      let pos = state.dialValue[id]; // continuous position while dragging
      let lastShown = null;
      function paint(snap) {
        const v = Math.round(pos);
        strip.classList.toggle('snap', !!snap);
        if (v !== lastShown) {
          strip.innerHTML = '';
          for (let n = v - 2; n <= v + 2; n++) {
            if (n < puzzle.min || n > puzzle.max) continue;
            const num = text('div', 'dial-num' + (n === v ? ' current' : ''), String(n).padStart(2, '0'));
            num.style.top = ((n - v) * ROW - ROW / 2) + 'px';
            strip.appendChild(num);
          }
          if (lastShown !== null) playSoftTap('tick');
          lastShown = v;
          state.dialValue[id] = v;
          drum.setAttribute('aria-valuenow', String(v));
        }
        strip.style.transform = 'translateY(' + (-(pos - v) * ROW) + 'px)';
      }
      function setValue(v) { pos = clamp(v); paint(true); }
      paint(false);

      // Drag the drum: works for mouse, pen and touch through pointer events.
      let dragStartY = 0, dragStartPos = 0, dragging = false;
      drum.addEventListener('pointerdown', (e) => {
        if (dragging) return;
        dragging = true;
        dragStartY = e.clientY; dragStartPos = pos;
        drum.classList.add('dragging');
        drum.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      drum.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        pos = clamp(dragStartPos - (e.clientY - dragStartY) / ROW * 1.15);
        paint(false);
      });
      const endDrag = () => {
        if (!dragging) return;
        dragging = false;
        drum.classList.remove('dragging');
        setValue(Math.round(pos));
      };
      drum.addEventListener('pointerup', endDrag);
      drum.addEventListener('pointercancel', endDrag);
      drum.addEventListener('wheel', (e) => {
        e.preventDefault();
        setValue(Math.round(pos) + (e.deltaY > 0 ? 1 : -1));
      }, { passive: false });
      drum.addEventListener('keydown', (e) => {
        const v = Math.round(pos);
        const map = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5 };
        if (map[e.key] !== undefined) { e.preventDefault(); setValue(v + map[e.key]); }
        else if (e.key === 'Home') { e.preventDefault(); setValue(puzzle.min); }
        else if (e.key === 'End') { e.preventDefault(); setValue(puzzle.max); }
        else if (e.key === 'Enter') { e.preventDefault(); setBtn.click(); }
      });

      // Press and hold − / + to keep turning, speeding up the longer it's held.
      function holdButton(btn, step) {
        let timer = null, count = 0;
        const tickOnce = () => setValue(Math.round(pos) + step);
        const stop = () => { clearTimeout(timer); timer = null; };
        const loop = () => {
          tickOnce(); count += 1;
          timer = setTimeout(loop, count < 4 ? 260 : count < 10 ? 130 : 70);
        };
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
          count = 0; stop(); loop();
        });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((ev) => btn.addEventListener(ev, stop));
        btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tickOnce(); } });
        btn.addEventListener('contextmenu', (e) => e.preventDefault());
      }
      const dec = text('button', 'dial-btn', '\u2212');
      const inc = text('button', 'dial-btn', '+');
      dec.type = 'button'; inc.type = 'button';
      dec.setAttribute('aria-label', T('Turn down'));
      inc.setAttribute('aria-label', T('Turn up'));
      holdButton(dec, -1);
      holdButton(inc, 1);
      panel.appendChild(el('div', { class: 'dial-row' }, [dec, drum, inc]));

      const setBtn = text('button', null, 'Set the dial');
      const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
      setBtn.addEventListener('click', () => {
        if (state.dialValue[id] === puzzle.target) {
          setBtn.disabled = true;
          state.collected.push(puzzle.title);
          solve();
        } else {
          registerMiss(puzzle, feedback, hint, 'The dial clicks, but nothing opens.', 2);
        }
      });
      panel.appendChild(el('div', { class: 'dial-set-row' }, [setBtn]));
      panel.appendChild(feedback);
    }

    panel.appendChild(hint.box);

    const wrap = el('div', {}, [panel]);
    if (state.collected.length) {
      const solvedList = state.collected.map(T).join('  \u00b7  ');
      wrap.appendChild(text('p', 'footer-note', PL('Solved so far in this door: ' + solvedList,
        'Pour cette porte, vous avez d\u00e9j\u00e0 r\u00e9solu\u00a0: ' + solvedList)));
    }
    return wrap;
  }

  // ---------- The finale: two beats, then the reveal ----------
  // Beat 1 (the altar): the runes must be seated in the order they were earned —
  // the rule comes from the scroll unsealed on the title screen, kept in the journal.
  // Beat 2 (the vault door): the crown's wheel, three rings driven by one crank.
  // The rim's inscription points each ring back to a number the team already
  // earned, also in the journal.
  const FINAL_ALTAR = {
    id: 'final1',
    hints: [
      'You have read about this altar before, at the very start, before the first door. The words are in your journal.',
      'The scroll says: \u201cThe first rune you are given goes in the first place.\u201d The rune you earned first belongs in the first socket. Your journal shows which door gave you each rune.',
      'Left to right: the Reading Room\u2019s rune, then the Cipher Vault\u2019s, then the Deep Archive\u2019s.'
    ]
  };
  const FINAL_VAULT = {
    id: 'final2',
    hints: [
      'Each line on the door points to a seal you have already opened, and your journal shows what each seal gave you. Then turn the crank once and watch how far each ring moves before you turn it again.',
      'Outer ring 38 (the worn sequence), middle ring 7 (the Gearworks Chamber), inner ring 13 (the Archivist\u2019s Sum). The outer ring moves one number per turn and can never be held, so it decides how many turns you have. The middle ring moves two numbers and the inner ring three: hold each one still for the turns it does not need. When all three are set, pull the lever.',
      'Release the wheel first. Then turn the crank six times in all: let the middle ring turn for two of those turns and the inner ring for one, and hold them still for the rest. Then pull the lever.'
    ]
  };
  const VAULT_LINES = [
    { rune: 'R', target: 38, line: 'In the Reading Room, I left the number that was worn away.' },
    { rune: 'V', target: 7, line: 'In the Cipher Vault, I left the number of changes hidden among the gears.' },
    { rune: 'A', target: 13, line: 'In the Deep Archive, I left the number I added up myself.' }
  ];

  function buildFinalVault() {
    if (state.finalStage === 2) return buildVaultDoor();
    if (state.finalStage === 1.5) return buildAltarCinematic();
    return buildAltar();
  }

  // ---------- Between the altar and the vault door: a short cinematic ----------
  // The seated runes flare in their doors' colours, the altar shudders and sinks
  // into the floor, dust rises, and the vault door behind it wakes and lights.
  // Nothing moves on by itself: the team continues when they are ready.
  const ALTAR_SINK_MS = 4400;
  function altarSinkSVG() {
    const runes = state.rareSeals.map((seal, i) => {
      const door = DOORS.find((d) => d.rareSeal === seal) || DOORS[i];
      const x = 145 + i * 35;
      return `
        <g class="as-rune" style="animation-delay:${0.15 + i * 0.25}s">
          <circle cx="${x}" cy="176" r="12" fill="#12101C" stroke="${door.accent}" stroke-width="2"/>
          <circle cx="${x}" cy="176" r="15" fill="none" stroke="${door.accent}" stroke-width="1" opacity="0.5" class="as-rune-halo"/>
          <g transform="translate(${x} 176) scale(0.46)"><path d="${RUNE_PATHS[seal]}" stroke="#F2C35A" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
        </g>`;
    }).join('');
    const bolts = Array.from({ length: 12 }).map((_, i) => {
      const a = (i / 12) * Math.PI * 2;
      return `<circle cx="${(180 + Math.cos(a) * 68).toFixed(1)}" cy="${(100 + Math.sin(a) * 68).toFixed(1)}" r="3.4" fill="#8C6420" stroke="#2A1E0C" stroke-width="1"/>`;
    }).join('');
    const spokes = [0, 60, 120].map((deg) =>
      `<line x1="162" y1="100" x2="198" y2="100" transform="rotate(${deg} 180 100)" stroke="#C9962E" stroke-width="4" stroke-linecap="round"/>`).join('');
    const dust = [[118, 0.2], [146, 0.55], [178, 0.1], [210, 0.4], [240, 0.7], [128, 0.9], [226, 1.1]].map(([x, d]) =>
      `<ellipse class="as-dust" cx="${x}" cy="196" rx="${14 + (x % 9)}" ry="6" fill="#8C7C66" style="animation-delay:${(1.1 + d).toFixed(2)}s"/>`).join('');
    return `
    <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The altar sinks into the floor, and the vault door behind it lights up">
      <defs>
        <linearGradient id="asWall" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2A2338"/><stop offset="1" stop-color="#15111F"/>
        </linearGradient>
        <radialGradient id="asGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.85"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="asDoor" cx="45%" cy="40%" r="70%">
          <stop offset="0" stop-color="#5A4A2C"/><stop offset="1" stop-color="#241C12"/>
        </radialGradient>
        <linearGradient id="asStone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6E6377"/><stop offset="1" stop-color="#3E3548"/>
        </linearGradient>

  function playAltarSinkSound() {
    const ctx = getAudioCtx();
    if (!ctx) return;
    // the runes flare: three soft rising notes
    [523.3, 659.3, 784].forEach((f, i) => playTone(ctx, { freq: f, type: 'sine', start: 0.15 + i * 0.25, duration: 0.5, gain: 0.04, attack: 0.02, release: 0.9 }));
    // a heavy shudder, then stone grinding down into stone
    playTone(ctx, { freq: 48, freqEnd: 36, type: 'sine', start: 0.95, duration: 0.3, gain: 0.22, attack: 0.01, release: 0.4 });
    playNoiseBurst(ctx, {
      start: 1.05, duration: 2.4, gain: 0.13, filterType: 'bandpass', q: 4,
      filterFreqPath: [[0, 260], [0.4, 200], [0.9, 300], [1.4, 190], [1.9, 250], [2.4, 150]]
    });
    playIronGroan(ctx, { start: 1.2, duration: 2.0, gain: 0.06 });
    // it settles below the floor with a deep thud and falling grit
    playTone(ctx, { freq: 55, freqEnd: 30, type: 'sine', start: 3.45, duration: 0.3, gain: 0.26, attack: 0.005, release: 0.6 });
    playNoiseBurst(ctx, { start: 3.45, duration: 0.8, gain: 0.07, filterFreq: 1400, filterType: 'bandpass', q: 1.5 });
    // the vault door wakes: a slow brass chord
    [196, 293.7, 392].forEach((f, i) => playTone(ctx, { freq: f, type: 'triangle', start: 2.6 + i * 0.12, duration: 1.6, gain: 0.035, attack: 0.5, release: 1.4 }));
  }

  function buildAltar() {
    if (!state.selectedRunes) state.selectedRunes = [];
    if (!state.finalTray) {
      // Offer the runes in a scrambled order, never the order they were earned.
      const t = state.rareSeals.slice();
      do {
        for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
      } while (t.length > 1 && t.every((s, i) => s === state.rareSeals[i]));
      state.finalTray = t;
    }
    const panel = el('div', { class: 'panel vault-final passage-final' });
    panel.appendChild(text('p', 'panel-label', 'THE VAULT PASSAGE'));
    panel.appendChild(text('h2', null, 'Set the sacred runes'));
    panel.appendChild(text('p', null, 'The passage ends at a stone altar with three empty sockets carved into its face. The stone is a little warm. Words are carved above them, in the same hand you have seen all through the vault: \u201cI did not hide the crown. I put it where one person alone could never reach it.\u201d You have read about this altar before.'));
    panel.appendChild(el('div', { class: 'journal-inline-row' }, [journalLink('Open your journal')]));

    const hint = buildHint(FINAL_ALTAR);
    const slotsWrap = el('div', { class: 'rune-slots' });
    const tokensWrap = el('div', { class: 'rune-tokens' });
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    let settled = false;

    function renderSlotsAndTokens() {
      slotsWrap.innerHTML = '';
      state.rareSeals.forEach((_, i) => {
        const placed = state.selectedRunes[i];
        const slot = el('button', { class: 'rune-slot' + (placed ? ' filled' : ''), type: 'button', 'aria-label': placed ? PL('Remove rune from socket ' + (i + 1), 'Retirer la rune de l\u2019emplacement ' + (i + 1))
            : PL('Empty socket ' + (i + 1), 'Emplacement ' + (i + 1) + ' vide') });
        if (placed) {
          slot.innerHTML = runeIconSVG(placed);
          slot.title = 'Tap to take it back';
          slot.addEventListener('click', () => {
            if (settled) return;
            state.selectedRunes.splice(i, 1);
            renderSlotsAndTokens();
          });
        } else {
          slot.disabled = true;
        }
        slotsWrap.appendChild(slot);
      });

      tokensWrap.innerHTML = '';
      state.finalTray.forEach((seal) => {
        if (state.selectedRunes.includes(seal)) return; // already seated
        const btn = el('button', { class: 'rune-token', type: 'button', 'aria-label': PL('Rune of ' + doorForRune(seal).name, RUNE_OF_FR[doorForRune(seal).name]) });
        btn.innerHTML = runeIconSVG(seal);
        btn.addEventListener('click', () => {
          if (settled || state.selectedRunes.length >= state.rareSeals.length) return;
          state.selectedRunes.push(seal);
          renderSlotsAndTokens();
          if (state.selectedRunes.length === state.rareSeals.length) checkAltar();
        });
        tokensWrap.appendChild(btn);
      });
    }

    function checkAltar() {
      const correct = state.rareSeals.every((s, i) => state.selectedRunes[i] === s);
      if (correct) {
        settled = true;
        feedback.className = 'feedback good';
        feedback.textContent = T('The runes hold. Deep in the stone, something moves\u2026');
        if (state.soundOn) playLockUnlockSound();
        panel.classList.add('seal-solved');
        const stepBack = text('button', 'continue-btn', 'Step back');
        stepBack.addEventListener('click', () => { shieldInput(); state.finalStage = 1.5; render(); }, { once: true });
        feedback.after(stepBack);
        setTimeout(() => stepBack.classList.add('ready'), 700);
      } else {
        registerMiss(FINAL_ALTAR, feedback, hint, 'The runes will not stay. The order is wrong, and they fall back into your hand.', 2);
        setTimeout(() => { state.selectedRunes = []; renderSlotsAndTokens(); }, 1000);
      }
    }

    panel.appendChild(slotsWrap);
    panel.appendChild(howTo('Tap a rune below to set it in the next socket. Tap a filled socket to take it back.'));
    panel.appendChild(tokensWrap);
    panel.appendChild(feedback);
    panel.appendChild(hint.box);
    renderSlotsAndTokens();
    return el('div', {}, [panel]);
  }

  // ---------- The vault door: the crown's wheel ----------
  // Three geared rings, one per door, each engraved with twelve numbers and
  // wearing its door's rune at the brass window. Unlike the seal of rings in the
  // Deep Archive, they cannot be turned by hand: one crank drives them all. Each
  // turn moves the outer ring one number, the middle two and the inner three,
  // unless a clutch holds the middle or inner ring still. The outer ring has no
  // clutch, so it sets how many turns the team has to spend. Each ring carries
  // thirteen numbers: because 13 shares no factor with 2 or 3, every number on
  // every ring can reach the window, so every decoy is a real choice. The vault
  // never opens by itself: the team pulls the lever when they believe the rings
  // are right, and a wrong pull says nothing about which ring is off. A counter
  // on the crank tracks turns since the last release, and "Release the wheel"
  // puts every ring back where it started, so a muddled plan never traps anyone.
  const WHEEL_BANDS = [[46, 76], [76, 108], [108, 143]];   // inner, middle, outer
  const WHEEL_RUNES = ['A', 'V', 'R'];                       // Deep Archive, Cipher Vault, Reading Room
  const WHEEL_RATE = [3, 2, 1];                              // numbers moved per turn of the crank
  const WHEEL_SLOTS = 13;
  const WHEEL_STEP = 360 / WHEEL_SLOTS;
  const WHEEL_NUMS = [                                       // each door's number appears once on its own ring
    [13, 5, 38, 8, 23, 7, 1, 11, 19, 4, 26, 3, 17],           // (and as a decoy on the others)
    [7, 38, 5, 12, 13, 3, 9, 16, 4, 11, 6, 2, 21],
    [38, 7, 13, 22, 5, 14, 10, 30, 8, 23, 3, 16, 27]
  ];
  const WHEEL_START = [10, 9, 7];                            // the window opens on 26, 11 and 30
  const WHEEL_TURN_MS = 620;
  const WHEEL_LEVER_REST_MS = 3000;                          // a wrong pull: the lever needs a moment to reset
  const wheelTarget = (i) => VAULT_LINES.find((l) => l.rune === WHEEL_RUNES[i]).target;
  const wheelNumAt = (i, pos) => WHEEL_NUMS[i][((pos % WHEEL_SLOTS) + WHEEL_SLOTS) % WHEEL_SLOTS];

  function crownWheelSVG() {
    const band = (i) => {
      const [r0, r1] = WHEEL_BANDS[i], rm = (r0 + r1) / 2;
      const nums = WHEEL_NUMS[i].map((n, k) => `<g transform="rotate(${(k * WHEEL_STEP).toFixed(3)} 150 150)"><text x="150" y="${(150 - rm + 5).toFixed(1)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="${[14, 16, 17][i]}" fill="#2A1A08">${n}</text></g>`).join('');
      const teeth = Array.from({ length: WHEEL_SLOTS * 3 }).map((_, k) => `<rect x="148.6" y="${150 - r1 - 0.2}" width="2.8" height="3.2" fill="#5A3E12" transform="rotate(${(k * WHEEL_STEP / 3).toFixed(3)} 150 150)"/>`).join('');
      return `<g class="cw-ring" data-ring="${i}">
        <path d="M150 ${150 - r1} a ${r1} ${r1} 0 1 0 0.01 0 Z M150 ${150 - r0} a ${r0} ${r0} 0 1 1 -0.01 0 Z" fill="url(#cwBand${i})" fill-rule="evenodd"/>
        ${teeth}${nums}</g>`;
    };
    const runeMarks = WHEEL_BANDS.map(([r0, r1], i) => {
      const rm = (r0 + r1) / 2;
      return `<g transform="translate(169 ${150 - rm - 6})"><circle r="7.5" fill="#120D0A" stroke="#C9962E" stroke-width="1.2"/><g transform="scale(0.28)"><path d="${RUNE_PATHS[WHEEL_RUNES[i]]}" stroke="#E8B23A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
    }).join('');
    return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The vault door: three geared rings of numbers, each marked with a door's rune, turned together by one crank">
      <defs>
        <linearGradient id="cwBand0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4C07A"/><stop offset="1" stop-color="#A67A30"/></linearGradient>
        <linearGradient id="cwBand1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9AE62"/><stop offset="1" stop-color="#9A6E28"/></linearGradient>

      </defs>
      <circle cx="150" cy="150" r="148" fill="#1A120B" stroke="#8C6420" stroke-width="2"/>
      ${[2, 1, 0].map(band).join('')}
      <circle cx="150" cy="150" r="46" fill="url(#cwStone)"/>
      <path d="M130 162 L130 142 L139 150 L150 134 L161 150 L170 142 L170 162 Z" fill="#E8B23A" stroke="#120C06" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="128" y="162" width="44" height="6" rx="1.5" fill="#C9962E" stroke="#120C06" stroke-width="1.2"/>
      <g fill="none" stroke="#120C06" stroke-width="3.2"><circle cx="150" cy="150" r="46"/><circle cx="150" cy="150" r="76"/><circle cx="150" cy="150" r="108"/><circle cx="150" cy="150" r="143"/></g>
      <rect x="136" y="6" width="28" height="99" rx="4" fill="#FFE9A8" fill-opacity="0.10" stroke="#F0CD84" stroke-width="1.6"/>
      <path d="M143 1 H157 L150 9 Z" fill="#F0CD84" stroke="#120C06" stroke-width="1"/>
      ${runeMarks}
    </svg>`;
  }
