        slotsWrap.appendChild(slot);
      });

      tokensWrap.innerHTML = '';
      state.finalTray.forEach((seal) => {
        if (state.selectedRunes.includes(seal)) return; // already seated
        const btn = el('button', { class: 'rune-token', type: 'button', 'aria-label': PL('Rune of ' + doorForRune(seal).name, RUNE_OF_FR[doorForRune(seal).name]) });
        btn.innerHTML = runeIconSVG(seal);
        btn.addEventListener('click', () => {
          if (settled || state.selectedRunes.length >= state.rareSeals.length) return;
          playRunePlaceSound(state.selectedRunes.length);
          state.selectedRunes.push(seal);
          renderSlotsAndTokens();
          if (state.selectedRunes.length === state.rareSeals.length) checkAltar();
        });
        tokensWrap.appendChild(btn);
      });
    }

    function checkAltar() {
      const correct = state.rareSeals.every((s, i) => state.selectedRunes[i] === s);
      if (correct) {
        settled = true;
        feedback.className = 'feedback good';
        feedback.textContent = T('The runes hold. Deep in the stone, something moves\u2026');
        if (state.soundOn) playLockUnlockSound();
        panel.classList.add('seal-solved');
        const stepBack = text('button', 'continue-btn', 'Step back');
        stepBack.addEventListener('click', () => { shieldInput(); state.finalStage = 1.5; render(); }, { once: true });
        feedback.after(stepBack);
        setTimeout(() => stepBack.classList.add('ready'), 700);
      } else {
        registerMiss(FINAL_ALTAR, feedback, hint, 'The runes will not stay. The order is wrong, and they fall back into your hand.', 2);
        setTimeout(() => { state.selectedRunes.forEach((_, i) => setTimeout(() => playRuneRemoveSound(i), i * 110)); state.selectedRunes = []; renderSlotsAndTokens(); }, 1000);
      }
    }

    panel.appendChild(slotsWrap);
    panel.appendChild(howTo('Tap a rune below to set it in the next socket. Tap a filled socket to take it back.'));
    panel.appendChild(tokensWrap);
    panel.appendChild(feedback);
    panel.appendChild(hint.box);
    renderSlotsAndTokens();
    return el('div', {}, [panel]);
  }

  // ---------- The vault door: the crown's wheel ----------
  // Three geared rings, one per door, each engraved with twelve numbers and
  // wearing its door's rune at the brass window. Unlike the seal of rings in the
  // Deep Archive, they cannot be turned by hand: one crank drives them all. Each
  // turn moves the outer ring one number, the middle two and the inner three,
  // unless a clutch holds the middle or inner ring still. The outer ring has no
  // clutch, so it sets how many turns the team has to spend. Each ring carries
  // thirteen numbers: because 13 shares no factor with 2 or 3, every number on
  // every ring can reach the window, so every decoy is a real choice. The vault
  // never opens by itself: the team pulls the lever when they believe the rings
  // are right, and a wrong pull says nothing about which ring is off. A counter
  // on the crank tracks turns since the last release, and "Release the wheel"
  // puts every ring back where it started, so a muddled plan never traps anyone.
  const WHEEL_BANDS = [[46, 76], [76, 108], [108, 143]];   // inner, middle, outer
  const WHEEL_RUNES = ['A', 'V', 'R'];                       // Deep Archive, Cipher Vault, Reading Room
  const WHEEL_RATE = [3, 2, 1];                              // numbers moved per turn of the crank
  const WHEEL_SLOTS = 13;
  const WHEEL_STEP = 360 / WHEEL_SLOTS;
  const WHEEL_NUMS = [                                       // each door's number appears once on its own ring
    [13, 5, 38, 8, 23, 7, 1, 11, 19, 4, 26, 3, 17],           // (and as a decoy on the others)
    [7, 38, 5, 12, 13, 3, 9, 16, 4, 11, 6, 2, 21],
    [38, 7, 13, 22, 5, 14, 10, 30, 8, 23, 3, 16, 27]
  ];
  const WHEEL_START = [10, 9, 7];                            // the window opens on 26, 11 and 30
  const WHEEL_TURN_MS = 620;
  const WHEEL_LEVER_REST_MS = 3000;                          // a wrong pull: the lever needs a moment to reset
  const wheelTarget = (i) => VAULT_LINES.find((l) => l.rune === WHEEL_RUNES[i]).target;
  const wheelNumAt = (i, pos) => WHEEL_NUMS[i][((pos % WHEEL_SLOTS) + WHEEL_SLOTS) % WHEEL_SLOTS];

  function crownWheelSVG() {
    const band = (i) => {
      const [r0, r1] = WHEEL_BANDS[i], rm = (r0 + r1) / 2;
      const nums = WHEEL_NUMS[i].map((n, k) => `<g transform="rotate(${(k * WHEEL_STEP).toFixed(3)} 150 150)"><text x="150" y="${(150 - rm + 5).toFixed(1)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="${[14, 16, 17][i]}" fill="#2A1A08">${n}</text></g>`).join('');
      const teeth = Array.from({ length: WHEEL_SLOTS * 3 }).map((_, k) => `<rect x="148.6" y="${150 - r1 - 0.2}" width="2.8" height="3.2" fill="#5A3E12" transform="rotate(${(k * WHEEL_STEP / 3).toFixed(3)} 150 150)"/>`).join('');
      return `<g class="cw-ring" data-ring="${i}">
        <path d="M150 ${150 - r1} a ${r1} ${r1} 0 1 0 0.01 0 Z M150 ${150 - r0} a ${r0} ${r0} 0 1 1 -0.01 0 Z" fill="url(#cwBand${i})" fill-rule="evenodd"/>
        ${teeth}${nums}</g>`;
    };
    const runeMarks = WHEEL_BANDS.map(([r0, r1], i) => {
      const rm = (r0 + r1) / 2;
      return `<g transform="translate(169 ${150 - rm - 6})"><circle r="7.5" fill="#120D0A" stroke="#C9962E" stroke-width="1.2"/><g transform="scale(0.28)"><path d="${RUNE_PATHS[WHEEL_RUNES[i]]}" stroke="#E8B23A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
    }).join('');
    return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The vault door: three geared rings of numbers, each marked with a door's rune, turned together by one crank">
      <defs>
        <linearGradient id="cwBand0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4C07A"/><stop offset="1" stop-color="#A67A30"/></linearGradient>
        <linearGradient id="cwBand1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9AE62"/><stop offset="1" stop-color="#9A6E28"/></linearGradient>
        <linearGradient id="cwBand2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFA255"/><stop offset="1" stop-color="#8C6420"/></linearGradient>
        <radialGradient id="cwStone" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#5A3E1A"/><stop offset="1" stop-color="#2A1C0C"/></radialGradient>
      </defs>
      <circle cx="150" cy="150" r="148" fill="#1A120B" stroke="#8C6420" stroke-width="2"/>
      ${[2, 1, 0].map(band).join('')}
      <circle cx="150" cy="150" r="46" fill="url(#cwStone)"/>
      <path d="M130 162 L130 142 L139 150 L150 134 L161 150 L170 142 L170 162 Z" fill="#E8B23A" stroke="#120C06" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="128" y="162" width="44" height="6" rx="1.5" fill="#C9962E" stroke="#120C06" stroke-width="1.2"/>
      <g fill="none" stroke="#120C06" stroke-width="3.2"><circle cx="150" cy="150" r="46"/><circle cx="150" cy="150" r="76"/><circle cx="150" cy="150" r="108"/><circle cx="150" cy="150" r="143"/></g>
      <rect x="136" y="6" width="28" height="99" rx="4" fill="#FFE9A8" fill-opacity="0.10" stroke="#F0CD84" stroke-width="1.6"/>
      <path d="M143 1 H157 L150 9 Z" fill="#F0CD84" stroke="#120C06" stroke-width="1"/>
      ${runeMarks}
    </svg>`;
  }
  function crankSVG() {
    return `<svg viewBox="0 0 60 60" aria-hidden="true">
      <circle cx="30" cy="30" r="17" fill="none" stroke="#120C06" stroke-width="5"/>
      <circle cx="30" cy="30" r="17" fill="none" stroke="#C9962E" stroke-width="3"/>
      ${Array.from({ length: 12 }).map((_, k) => `<rect x="28.6" y="9.5" width="2.8" height="4" fill="#C9962E" stroke="#120C06" stroke-width="0.6" transform="rotate(${k * 30} 30 30)"/>`).join('')}
      <g class="crank-arm">
        <path d="M30 30 L49 30" stroke="#120C06" stroke-width="6" stroke-linecap="round"/>
        <path d="M30 30 L49 30" stroke="#E8B23A" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="49" cy="30" r="5" fill="#7A3A22" stroke="#120C06" stroke-width="1.2"/>
      </g>
      <circle cx="30" cy="30" r="5" fill="#E8B23A" stroke="#120C06" stroke-width="1.2"/>
    </svg>`;
  }
  function clutchSVG(engaged) {
    const tx = engaged ? 20 : 31, ty = engaged ? 8 : 14;
    return `<svg viewBox="0 0 40 40" aria-hidden="true">
      <rect x="8" y="30" width="24" height="6" rx="2" fill="#3A2A1C" stroke="#120C06" stroke-width="1"/>
      <path d="M20 31 L${tx} ${ty}" stroke="#120C06" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 31 L${tx} ${ty}" stroke="#C9962E" stroke-width="3" stroke-linecap="round"/>
      <circle cx="${tx}" cy="${ty}" r="4.4" fill="${engaged ? '#E8B23A' : '#7A5A30'}" stroke="#120C06" stroke-width="1.2"/>
      <circle cx="20" cy="31" r="2.6" fill="#E8B23A" stroke="#120C06" stroke-width="1"/>
    </svg>`;
  }
  function leverSVG() {
    return `<svg viewBox="0 0 40 40" aria-hidden="true">
      <rect x="6" y="31" width="28" height="6" rx="2" fill="#3A2A1C" stroke="#120C06" stroke-width="1"/>
      <g class="vault-lever-arm">
        <path d="M20 32 L20 8" stroke="#120C06" stroke-width="5.4" stroke-linecap="round"/>
        <path d="M20 32 L20 8" stroke="#C9962E" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="20" cy="7" r="5" fill="#7A3A22" stroke="#120C06" stroke-width="1.2"/>
      </g>
      <circle cx="20" cy="32" r="3" fill="#E8B23A" stroke="#120C06" stroke-width="1"/>
    </svg>`;
  }
  // The vault lock, iron and bronze: an iron crank with a heavy ratchet pawl and gears
  // meshing, a dull bronze chunk as each ring drops into its next notch, an iron latch for
  // each clutch, a lever that strains against the lock and stops dead, and gears spinning
  // back on release. No sound gives away a ring landing on its number.
  const LOCK_LEVEL = { crank: 0.31, clutch: 0.5, leverFail: 0.37, release: 0.415 };
  function playLockSound(kind, moved) {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    const N = playNoiseBurst, T = playTone, W = weightTone;
    withRoute(ctx, { trim: LOCK_LEVEL[kind], wet: 0.25 }, () => {
      if (kind === 'crank') {
        for (let k = 0; k < 5; k++) {
          const t = 0.04 + k * 0.12;
          N(ctx, { start: t, duration: 0.03, gain: 0.09, filterType: 'bandpass', filterFreq: rand(1100, 1400), q: 5 });
          T(ctx, { freq: 180, freqEnd: 130, type: 'triangle', start: t, duration: 0.02, gain: 0.05, attack: 0.002, release: 0.06 });
        }
        N(ctx, { duration: 0.62, gain: 0.06, filterType: 'bandpass', q: 2, filterFreqPath: [[0, 520], [0.3, 680], [0.62, 560]] });
        W(ctx, { freq: 62, type: 'sine', duration: 0.5, gain: 0.06, attack: 0.08, release: 0.2 });
        const turn = WHEEL_TURN_MS / 1000;
        (moved || []).forEach((ring) => {
          const n = WHEEL_RATE[ring];
          for (let k = 0; k < n; k++) {
            const t = 0.08 + turn * (0.28 + 0.62 * Math.pow((k + 1) / n, 0.85));
            W(ctx, { freq: [150, 130, 110][ring], freqEnd: [110, 95, 80][ring], type: 'sine', start: t, duration: 0.03, gain: 0.09, attack: 0.003, release: 0.12 }, [[2, 0.5], [3, 0.3]]);
            N(ctx, { start: t, duration: 0.05, gain: 0.05, filterType: 'bandpass', filterFreq: [700, 600, 500][ring], q: 3 });
          }
        });
      } else if (kind === 'clutch') {
        W(ctx, { freq: 120, freqEnd: 90, type: 'sine', duration: 0.04, gain: 0.1, attack: 0.003, release: 0.12 });
        N(ctx, { duration: 0.06, gain: 0.09, filterType: 'bandpass', filterFreq: 900, q: 4 });
        [0.07, 0.11, 0.16].forEach((t) => N(ctx, { start: t, duration: 0.02, gain: 0.02, filterType: 'bandpass', filterFreq: rand(2300, 2900), q: 6 }));
      } else if (kind === 'leverFail') {
        playIronGroan(ctx, { duration: 0.8, gain: 0.07 });
        [0, 0.05, 0.11, 0.18, 0.26].forEach((t) => N(ctx, { start: t, duration: 0.02, gain: 0.025, filterType: 'bandpass', filterFreq: rand(2100, 2800), q: 6 }));
        N(ctx, { start: 0.25, duration: 0.6, gain: 0.08, filterType: 'bandpass', q: 2, filterFreqPath: [[0, 300], [0.6, 520]] });
        W(ctx, { freq: 70, freqEnd: 48, type: 'sine', start: 0.85, duration: 0.08, gain: 0.2, attack: 0.004, release: 0.4 });
        N(ctx, { start: 0.85, duration: 0.08, gain: 0.08, filterType: 'bandpass', filterFreq: 320, q: 1.5 });
        N(ctx, { start: 0.97, duration: 0.03, gain: 0.04, filterType: 'bandpass', filterFreq: 1300, q: 5 });
      } else if (kind === 'release') {
        N(ctx, { duration: 1.0, gain: 0.07, filterType: 'bandpass', q: 2.5, filterFreqPath: [[0, 900], [1.0, 280]] });
        for (let k = 0; k < 9; k++) N(ctx, { start: 0.05 + k * 0.1 + k * k * 0.004, duration: 0.02, gain: 0.04, filterType: 'bandpass', filterFreq: 1200, q: 5 });
        W(ctx, { freq: 90, freqEnd: 60, type: 'sine', start: 1.05, duration: 0.06, gain: 0.14, attack: 0.004, release: 0.3 });
      }
    });
  }
  function playCrankSound() {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    try { playIronGroan(ctx, { duration: 0.35, gain: 0.05 }); } catch (e) { /* sound is decoration */ }
    playSoftTap('tick');
  }

  function buildVaultDoor() {
    if (!state.wheelPos) state.wheelPos = WHEEL_START.slice();
    if (!state.wheelEngaged) state.wheelEngaged = [true, true, true];
    if (!state.wheelTurns) state.wheelTurns = 0;
    const pos = state.wheelPos, engaged = state.wheelEngaged;
    const panel = el('div', { class: 'panel vault-final passage-final vault-door-panel' });
    panel.appendChild(text('p', 'panel-label', 'THE VAULT DOOR'));
    panel.appendChild(text('h2', null, 'The crown\u2019s wheel'));
    panel.appendChild(text('p', null, 'Behind the altar, the vault door waits: a great wheel of three rings, each wearing the rune of a door you opened. Unlike the seal in the Deep Archive, these rings cannot be turned by hand. A single crank drives them all, and beside two of the runes is a clutch that can hold its ring still. A great lever tries the door. Words are carved around the wheel\u2019s edge, one line for every door.'));

    const inscription = el('div', { class: 'vault-inscription' });
    VAULT_LINES.forEach((l) => {
      inscription.appendChild(el('div', { class: 'vault-line' }, [
        el('span', { class: 'vault-line-rune', html: runeIconSVG(l.rune) }),
        text('span', 'vault-line-text', l.line)
      ]));
    });
    panel.appendChild(inscription);
    panel.appendChild(el('div', { class: 'journal-inline-row' }, [journalLink('Open your journal')]));
    panel.appendChild(howTo('Turn the crank to move every ring that is engaged. Flip a clutch to hold its ring still. When each door\u2019s number sits in the brass window at the top, pull the lever to try the vault.'));

    const hint = buildHint(FINAL_VAULT);
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    const stage = el('div', { class: 'rings-stage cw-stage', html: crownWheelSVG() });
    const groups = [0, 1, 2].map((i) => stage.querySelector('.cw-ring[data-ring="' + i + '"]'));
    const reading = el('p', { class: 'sr-only', 'aria-live': 'polite' });
    const paint = (animate) => {
      groups.forEach((g, i) => {
        g.style.transition = animate ? 'transform ' + WHEEL_TURN_MS + 'ms cubic-bezier(0.45, 0, 0.3, 1)' : 'none';
        g.style.transform = 'rotate(' + (-pos[i] * WHEEL_STEP).toFixed(3) + 'deg)';
      });
      reading.textContent = PL(
        'In the window: outer ring ' + wheelNumAt(2, pos[2]) + ', middle ring ' + wheelNumAt(1, pos[1]) + ', inner ring ' + wheelNumAt(0, pos[0]) + '.',
        'Dans la fen\u00eatre\u00a0: anneau ext\u00e9rieur ' + wheelNumAt(2, pos[2]) + ', anneau du milieu ' + wheelNumAt(1, pos[1]) + ', anneau int\u00e9rieur ' + wheelNumAt(0, pos[0]) + '.');
    };
    panel.appendChild(stage);
    panel.appendChild(reading);

    let opened = !!state.vaultOpened, turning = false;
    const machine = el('div', { class: 'cw-machine' });
    const clutchBtns = [];
    [[2, 'R', 'OUTER'], [1, 'V', 'MIDDLE'], [0, 'A', 'INNER']].forEach(([i, rune, name]) => {
      const cell = el('div', { class: 'cw-clutch-cell' });
      cell.appendChild(el('span', { class: 'cw-ring-name' }, [el('span', { class: 'vault-line-rune', html: runeIconSVG(rune) }), TN(name)]));
      if (i === 2) {
        cell.appendChild(el('div', { class: 'cw-clutch fixed', 'aria-hidden': 'true', html: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="none" stroke="#120C06" stroke-width="4"/><circle cx="20" cy="20" r="11" fill="none" stroke="#8A6428" stroke-width="2.4"/><circle cx="20" cy="20" r="3" fill="#8A6428"/></svg>' }));
        cell.appendChild(text('span', 'cw-clutch-state', 'NO CLUTCH'));
      } else {
        const lower = name.toLowerCase();
        const b = el('button', { type: 'button', class: 'cw-clutch' });
        const label = text('span', 'cw-clutch-state', '');
        const draw = () => {
          b.innerHTML = clutchSVG(engaged[i]);
          b.classList.toggle('held', !engaged[i]);
          label.classList.toggle('held', !engaged[i]);
          b.setAttribute('aria-pressed', engaged[i] ? 'false' : 'true');
          b.setAttribute('aria-label', PL(
            'Clutch for the ' + lower + ' ring: ' + (engaged[i] ? 'it turns with the crank. Press to hold it still.' : 'it is held still. Press to let it turn.'),
            'Frein de l\u2019anneau ' + RING_NAMES_FR[name] + '\u00a0: ' + (engaged[i] ? 'il tourne avec la manivelle. Appuyez pour le bloquer.' : 'il est bloqu\u00e9. Appuyez pour le laisser tourner.')));
          label.textContent = T(engaged[i] ? 'TURNS' : 'HELD STILL');
        };
        b.addEventListener('click', () => {
          if (opened || turning) return;
          engaged[i] = !engaged[i];
          playLockSound('clutch');
          draw();
        });
        draw();
        clutchBtns.push(b);
        cell.appendChild(b);
        cell.appendChild(label);
      }
      machine.appendChild(cell);
    });
    panel.appendChild(machine);

    const crank = el('button', { type: 'button', class: 'cw-crank', 'aria-label': 'Turn the crank one full turn' });
    crank.appendChild(el('span', { class: 'cw-crank-pic', html: crankSVG() }));
    crank.appendChild(text('span', null, 'Turn the crank'));
    const counterValue = text('span', 'cw-counter-value', String(state.wheelTurns));
    const counter = el('div', { class: 'cw-counter', 'aria-live': 'polite' }, [text('span', 'cw-counter-label', 'TURNS SINCE RELEASE'), counterValue]);
    const setCounter = () => {
      counterValue.textContent = String(state.wheelTurns);
      counter.setAttribute('aria-label', PL('Turns since release: ' + state.wheelTurns, 'Tours depuis le rel\u00e2chement\u00a0: ' + state.wheelTurns));
    };
    setCounter();
    const lever = el('button', { type: 'button', class: 'cw-lever' }, [el('span', { class: 'cw-lever-pic', html: leverSVG() }), text('span', 'cw-lever-text', 'Pull the lever')]);
    lever.setAttribute('aria-label', T('Pull the lever to try the vault'));
    let leverResting = false;
    // Undo puts the rings back exactly where they were before the last turn
    // (a clutch cannot be used to move one ring alone by turning back).
    if (!Array.isArray(state.wheelHistory)) state.wheelHistory = [];
    const back = el('button', { type: 'button', class: 'ghost cw-back cw-undo', 'aria-label': 'Undo the last turn of the crank',
      html: '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 L3 9 L7 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.5 9 H12 A4.5 4.5 0 0 1 12 18 H9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' });
    back.appendChild(text('span', null, 'Undo last turn'));

      state.finalRevealSoundPlayed = false;
      state.pendingFinalUnlock = true;
      render();

    const lockAll = () => { [crank, back, release, lever].concat(clutchBtns).forEach((b) => { b.disabled = true; }); };
    const isOpen = () => [0, 1, 2].every((i) => wheelNumAt(i, pos[i]) === wheelTarget(i));
    function showOpened(fresh) {
      opened = true;
      state.vaultOpened = true;

      stage.classList.add('solved');

      const rows = Array.from(panel.querySelectorAll('.cw-crank-row'));
      if (fresh && board && document.body.classList.contains('stage-layout') && rows.length && rows[0].getBoundingClientRect().height) {
        // The result is laid over the space the controls (and the empty message line under
        // them) took, and the controls keep that space while hidden: nothing moves.
        const br = board.getBoundingClientRect(), r0 = rows[0].getBoundingClientRect();
        const bottom = Math.max(rows[rows.length - 1].getBoundingClientRect().bottom, feedback.getBoundingClientRect().bottom);
        const msg = el('div', { class: 'feedback good', role: 'status' }); msg.textContent = openedMsg;
        const res = el('div', { class: 'cw-result' }, [msg, openBtn.parentElement]);
        board.appendChild(res);
        const z = zoomOf(res);
        res.style.left = ((r0.left - br.left) / z).toFixed(1) + 'px';
        res.style.top = ((r0.top - br.top) / z).toFixed(1) + 'px';
        res.style.width = (r0.width / z).toFixed(1) + 'px';
        res.style.height = ((bottom - r0.top) / z).toFixed(1) + 'px';
        panel.classList.add('cw-swapped');
      } else {
        if (document.body.classList.contains('stage-layout')) panel.classList.add('cw-opened');
        feedback.className = 'feedback good';
        feedback.textContent = openedMsg;
      }
      if (fresh) {
        state.endTime = Date.now();
        clearInterval(state.timerHandle);
        if (state.soundOn) playLockUnlockSound();

  // Sound check: open the game with ?audiocheck at the end of the address.
  // Every sound is rendered silently, faster than real time, exactly as the
  // game builds it, then measured: loudness (LUFS), the loudest 400 ms moment,
  // and true peak. Nothing is played aloud, nothing is saved, and the game
  // itself does not start. Sound effects are compared with the music that is
  // playing under them in the game.
  // =====================================================================
  const SOUND_CHECK = (() => { try { return new URLSearchParams(location.search).has('audiocheck'); } catch (e) { return false; } })();
  // ---------- Loudness meter (ITU-R BS.1770-4 / EBU R128) ----------
  // Integrated loudness with the absolute (-70 LUFS) and relative (-10 LU)
  // gates, the loudest 400 ms moment, and true peak from 4x oversampling.
  // Built for 48 kHz renders: the K-weighting coefficients are the standard's.
  const SC_RATE = 48000;
  function scKWeight(x) {
    const st = [[1.53512485958697, -2.69169618940638, 1.19839281085285, -1.69065929318241, 0.73248077421585],
                [1.0, -2.0, 1.0, -1.99004745483398, 0.99007225036621]];
    let y = x;
    st.forEach(([b0, b1, b2, a1, a2]) => {
      const out = new Float64Array(y.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let i = 0; i < y.length; i++) {
        const v = y[i], r = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
        x2 = x1; x1 = v; y2 = y1; y1 = r; out[i] = r;

  }
  // 4x oversampling with a windowed-sinc interpolator (48 taps), as BS.1770 Annex 2.
  const SC_TP = (() => {
    const half = 12, phases = [];
    for (let p = 1; p < 4; p++) {
      const frac = p / 4, taps = [];
      for (let k = -half + 1; k <= half; k++) {
        const t = k - frac, w = 0.5 + 0.5 * Math.cos(Math.PI * t / half);
        taps.push(t === 0 ? 1 : (Math.sin(Math.PI * t) / (Math.PI * t)) * w);
      }

    }

    const { half, phases } = SC_TP; let peak = 0;
    for (let i = 0; i < x.length; i++) { const a = Math.abs(x[i]); if (a > peak) peak = a; }
    for (let i = half; i < x.length - half; i++) {

    { id: 'find', group: 'ui', label: 'Difference found', beds: ['p1', 'p2'], secs: 1.5, run: () => playSoftTap('find') },
    { id: 'miss', group: 'ui', label: 'Miss / wrong', beds: ['p1', 'p2', 'p3'], secs: 1, run: () => playSoftTap('miss') },
    { id: 'runein', group: 'ui', label: 'Rune set in the altar', beds: ['p4'], secs: 1.5, run: () => playRunePlaceSound(1) },
    { id: 'runeout', group: 'ui', label: 'Rune taken back', beds: ['p4'], secs: 1, run: () => playRuneRemoveSound(1) },
    { id: 'journal', group: 'ui', label: 'Journal opens', beds: ['p1'], secs: 1, run: () => { lastJournalSound = 0; playJournalOpenSound(); } },
    { id: 'thud', group: 'ui', label: 'Book placed', beds: ['p1'], secs: 1, run: () => playBookThud() },
    { id: 'shelf', group: 'event', label: 'Bookshelf solved (the door music dips under it)', beds: ['p1'], secs: 4.5, run: () => playShelfSolvedSound() },
    { id: 'crank', group: 'ui', label: 'Vault crank (all three rings turning)', beds: ['p4'], secs: 1.5, run: () => playLockSound('crank', [0, 1, 2]) },
    { id: 'clutch', group: 'ui', label: 'Vault clutch', beds: ['p4'], secs: 1, run: () => playLockSound('clutch') },
    { id: 'lever', group: 'ui', label: 'Vault lever (not yet right)', beds: ['p4'], secs: 2, run: () => playLockSound('leverFail') },
    { id: 'release', group: 'ui', label: 'Vault wheel released', beds: ['p4'], secs: 2, run: () => playLockSound('release') },
    // Played together, as the game plays them: the sum must not clip either.
    { id: 'mix-unlock', group: 'mix', label: 'Seal opens over Door 3 music', secs: 24, run: scMusic(3), later: [[20, () => playLockUnlockSound()]] },
    { id: 'mix-finale', group: 'mix', label: 'Vault opens into victory music', secs: 44,
      run: () => playGrandRevealSound(),
      later: [[13.95, (off) => EmberScore.renderInto(off, 'finale', 30, off.currentTime + 0.02, 0)]] }
  ];

  // Runs one cue in its own offline context. The live context and game state
  // are put back after every call, so a cue can never leak into the next.
  function scWithOffline(off, fn) {
    const keep = { ctx: audioCtx, sound: state.soundOn, seals: state.rareSeals };
    audioCtx = off; state.soundOn = true; state.rareSeals = ['R', 'V', 'A'];
    try { fn(off); } finally { audioCtx = keep.ctx; state.soundOn = false; state.rareSeals = keep.seals; }
  }
  async function scRender(cue) {
    const off = new OfflineAudioContext(2, Math.ceil(SC_RATE * cue.secs), SC_RATE);
    scWithOffline(off, cue.run);
    (cue.later || []).forEach(([t, fn]) => {
      off.suspend(t).then(() => { scWithOffline(off, fn); off.resume(); });
    });
    const buf = await off.startRendering(), from = Math.floor((cue.from || 0) * SC_RATE);
    return scMeasure([buf.getChannelData(0).subarray(from), buf.getChannelData(1).subarray(from)]);
  }

  const scFix = (v, d) => (isFinite(v) ? (v > 0 && d !== 'abs' ? '+' : '') + v.toFixed(1) : '\u2013');
  function scJudge(results) {
    const R = (id) => results[id], out = { rows: {}, checks: [] };
    const tpOk = (id) => R(id).truePeak <= SC_TARGETS.truePeakMax;
    SC_CUES.forEach((c) => {
      const r = R(c.id), notes = [];
      let ok = true;
      if (!isFinite(r.integrated)) { out.rows[c.id] = { gap: '', ok: false, note: 'No sound rendered' }; return; }
      if (!tpOk(c.id)) { ok = false; notes.push('True peak ' + scFix(r.truePeak, 'abs') + ' dBTP: over ' + SC_TARGETS.truePeakMax); }
      let gap = '';
      if (c.beds) {
        const gaps = c.beds.map((b) => r.momentaryMax - R(b).integrated);
        const lo = Math.min.apply(null, gaps), hi = Math.max.apply(null, gaps);
        gap = lo.toFixed(1) === hi.toFixed(1) ? scFix(hi) : scFix(lo) + ' to ' + scFix(hi);
        const over = c.group === 'event' ? SC_TARGETS.eventAbove[1] : SC_TARGETS.uiAboveMax;
        if (hi > over) { ok = false; notes.push((hi - over).toFixed(1) + ' LU too loud over ' + SC_MUSIC_NAME[c.beds[gaps.indexOf(hi)]]); }
        if (c.group === 'event' && lo < SC_TARGETS.eventAbove[0]) { ok = false; notes.push((SC_TARGETS.eventAbove[0] - lo).toFixed(1) + ' LU too quiet over ' + SC_MUSIC_NAME[c.beds[gaps.indexOf(lo)]]); }
      }
      out.rows[c.id] = { gap, ok, note: notes.join('; ') || 'On target' };
    });
    const tv = Math.abs(R('title').integrated - R('victory').integrated);
    out.checks.push({ ok: tv <= SC_TARGETS.titleVictoryLU, text: 'Title and victory music within ' + SC_TARGETS.titleVictoryLU + ' LU of each other: ' + tv.toFixed(1) + ' LU apart' });
    const below = R('title').integrated - R('p1').integrated, [bl, bh] = SC_TARGETS.puzzleBelowTitle;
    out.checks.push({ ok: below >= bl && below <= bh, text: 'Door 1 music ' + bl + '\u2013' + bh + ' LU below the title music: ' + below.toFixed(1) + ' LU below' });
    const grow = R('p3').integrated - R('p1').integrated;
    out.checks.push({ ok: grow <= SC_TARGETS.doorGrowthLU, text: 'Door 3 music at most ' + SC_TARGETS.doorGrowthLU + ' LU louder than Door 1: ' + scFix(grow) + ' LU (Door 2 ' + scFix(R('p2').integrated - R('p1').integrated) + ', final vault ' + scFix(R('p4').integrated - R('p1').integrated) + ')' });
    const tpBad = SC_CUES.filter((c) => isFinite(R(c.id).integrated) && !tpOk(c.id));
    out.checks.push({ ok: !tpBad.length, text: 'Every sound at or under ' + SC_TARGETS.truePeakMax + ' dBTP true peak' + (tpBad.length ? ': ' + tpBad.length + ' over' : '') });
    return out;
  }
  function scReportText(results, judged) {
    const lines = ['The Ember Crown: sound check', new Date().toISOString().slice(0, 16).replace('T', ' ') + '  ' + navigator.userAgent, '',
      ['Sound', 'Loudness LUFS', 'Loudest moment LUFS', 'True peak dBTP', 'Above music LU', 'Result'].join('\t')];
    SC_CUES.forEach((c) => {
      const r = results[c.id], j = judged.rows[c.id];
      lines.push([c.label, scFix(r.integrated, 'abs'), scFix(r.momentaryMax, 'abs'), scFix(r.truePeak, 'abs'), j.gap, j.note].join('\t'));
    });
    lines.push('', 'Checks');
    judged.checks.forEach((k) => lines.push((k.ok ? 'OK   ' : 'MISS ') + k.text));
    return lines.join('\n');
  }

  function buildSoundCheck() {
    document.title = 'Sound check \u2014 The Ember Crown';
    const app = document.getElementById('app');
    app.innerHTML = '';
    const status = el('p', { class: 'sc-status', role: 'status' }, [document.createTextNode('Ready. The check takes one to two minutes and plays nothing aloud.')]);
    const runBtn = el('button', { type: 'button' }, [document.createTextNode('Run the sound check')]);
    const copyBtn = el('button', { type: 'button', class: 'ghost' }, [document.createTextNode('Copy results')]);
    copyBtn.hidden = true;
    const results = el('div', { class: 'sc-results' });
    const panel = el('div', { class: 'panel sound-check' }, [
      el('h2', {}, [document.createTextNode('Sound check')]),
      el('p', {}, [document.createTextNode('Measures every piece of music and every sound effect, exactly as the game makes them. Sound effects are compared with the music that plays under them. Remove ?audiocheck from the address to play the game.')]),
      el('div', { class: 'sc-actions' }, [runBtn, copyBtn]),
      status, results
    ]);
    app.appendChild(panel);
    let report = '';
    if (typeof OfflineAudioContext === 'undefined') {
      runBtn.disabled = true;
      status.textContent = 'This browser cannot render sound offline. Use a recent Chrome, Edge, Firefox or Safari.';
      return;
    }
    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true; copyBtn.hidden = true; results.innerHTML = '';
      const res = {}, t0 = performance.now();
      try {
        for (let i = 0; i < SC_CUES.length; i++) {
          const c = SC_CUES[i];
          status.textContent = 'Measuring ' + (i + 1) + ' of ' + SC_CUES.length + ': ' + c.label + '\u2026';
          await new Promise((r) => setTimeout(r, 0));
          res[c.id] = await scRender(c);
        }
      } catch (e) {
        status.textContent = 'The check stopped: ' + (e && e.message ? e.message : e) + '. Reload the page and try again.';
        runBtn.disabled = false;
        return;
      }
      const judged = scJudge(res);
      report = scReportText(res, judged);
      const misses = Object.values(judged.rows).filter((r) => !r.ok).length + judged.checks.filter((k) => !k.ok).length;
      status.textContent = 'Done in ' + Math.round((performance.now() - t0) / 1000) + ' s. ' + (misses ? misses + ' result' + (misses > 1 ? 's' : '') + ' off target.' : 'Everything is on target.');
      const head = el('tr', {}, ['Sound', 'Loudness (LUFS)', 'Loudest moment (LUFS)', 'True peak (dBTP)', 'Above music (LU)', 'Result'].map((h) => el('th', { scope: 'col' }, [document.createTextNode(h)])));
      const groups = { music: 'Music', event: 'Moments', ui: 'Small sounds', mix: 'Played together' };
      const body = el('tbody');
      Object.keys(groups).forEach((g) => {
        body.appendChild(el('tr', { class: 'sc-group' }, [el('th', { colspan: '6', scope: 'colgroup' }, [document.createTextNode(groups[g])])]));
        SC_CUES.filter((c) => c.group === g).forEach((c) => {
          const r = res[c.id], j = judged.rows[c.id];
          body.appendChild(el('tr', { class: j.ok ? 'sc-ok' : 'sc-miss' }, [c.label, scFix(r.integrated, 'abs'), scFix(r.momentaryMax, 'abs'), scFix(r.truePeak, 'abs'), j.gap, j.note]
            .map((v, k) => el(k ? 'td' : 'th', k ? {} : { scope: 'row' }, [document.createTextNode(v)]))));
        });
      });
      results.appendChild(el('div', { class: 'sc-scroll' }, [el('table', { class: 'sc-table' }, [el('thead', {}, [head]), body])]));
      results.appendChild(el('ul', { class: 'sc-checks' }, judged.checks.map((k) => el('li', { class: k.ok ? 'sc-ok' : 'sc-miss' }, [document.createTextNode((k.ok ? 'On target. ' : 'Off target. ') + k.text)]))));
      copyBtn.hidden = false; runBtn.disabled = false;
      runBtn.textContent = 'Run it again';
    });
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(report); copyBtn.textContent = 'Copied'; }
      catch (e) {
        const ta = el('textarea', { class: 'sc-copy', readonly: 'readonly' }); ta.value = report;
        results.appendChild(ta); ta.select(); copyBtn.textContent = 'Select the text below and copy it';
      }
      setTimeout(() => { copyBtn.textContent = 'Copy results'; }, 2500);
    });
  }

  // Sound is decoration: if any sound fails on a device, the game carries on
  // silently instead of stopping mid-seal.
  function guardAudio(fn) {
    return function () {
      try { return fn.apply(this, arguments); } catch (e) { return undefined; }
    };
  }
  // Each moment plays at its own level (SFX_TRIM_DB).
  playLockUnlockSound = withSfxLevel(() => 'unlock', playLockUnlockSound);
  playDoorCrossingSound = withSfxLevel((themeKey) => 'x-' + themeKey, playDoorCrossingSound);
  playGrandRevealSound = withSfxLevel(() => 'reveal', playGrandRevealSound);
  playTreasureFanfare = withSfxLevel(() => 'reveal', playTreasureFanfare);   // the vault's fanfare
  playAltarSinkSound = withSfxLevel(() => 'altar', playAltarSinkSound);
  playScrollUnrollSound = withSfxLevel(() => 'scroll', playScrollUnrollSound);
  playSoftTap = withSfxLevel((kind) => (kind === 'find' ? 'find' : null), playSoftTap);
  playLockUnlockSound = guardAudio(playLockUnlockSound);
  playDoorCrossingSound = guardAudio(playDoorCrossingSound);
  playFinalRevealSound = guardAudio(playFinalRevealSound);
  playCallout = guardAudio(playCallout);
  playAltarSinkSound = guardAudio(playAltarSinkSound);
  playTreasureFanfare = guardAudio(playTreasureFanfare);
  playSoftTap = guardAudio(playSoftTap);
  playBookThud = guardAudio(playBookThud);
  playShelfSolvedSound = guardAudio(withSfxLevel(() => 'unlock', playShelfSolvedSound));
  playScrollUnrollSound = guardAudio(playScrollUnrollSound);
  startAmbience = guardAudio(startAmbience);
  stopAmbience = guardAudio(stopAmbience);
  setAmbienceMuted = guardAudio(setAmbienceMuted);
  duckAmbience = guardAudio(duckAmbience);
  stopVictoryMusic = guardAudio(stopVictoryMusic);
  playVictoryMusic = guardAudio(playVictoryMusic);
  playAdventureTheme = guardAudio(playAdventureTheme);
  stopAdventureTheme = guardAudio(stopAdventureTheme);
  playGrandRevealSound = guardAudio(playGrandRevealSound);

  applyLangToPage();
  if (SOUND_CHECK) buildSoundCheck();
  else { loadSave(); render(); }
})();
</script>
</body>
