      const now = Date.now(); if (now - lastTap < 90) return; lastTap = now;
      state.lockTaps = (state.lockTaps || 0) + 1;
      const tapHint = stamp.querySelector('.lock-tap-hint'); if (tapHint) tapHint.classList.add('gone');
      seal.classList.remove('wobble'); void seal.offsetWidth; seal.classList.add('wobble');
      const r = stamp.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      for (let i = 0; i < 9; i++) {
        const ang = Math.random() * Math.PI * 2, dist = 26 + Math.random() * 34;
        const sp = el('span', { class: 'lock-spark', style: 'left:' + x + 'px; top:' + y + 'px; background:' + colors[i % 5] + '; --dx:' + (Math.cos(ang) * dist).toFixed(1) + 'px; --dy:' + (Math.sin(ang) * dist - 12).toFixed(1) + 'px; animation-duration:' + (0.45 + Math.random() * 0.3).toFixed(2) + 's;' });
        stamp.appendChild(sp); setTimeout(() => sp.remove(), 800);
      }
      if (state.soundOn) {
        const ctx = getAudioCtx();
        if (ctx) {
          const f = 520 + Math.random() * 340;
          playTone(ctx, { freq: f, type: 'triangle', duration: 0.05, gain: 0.07, attack: 0.002, release: 0.25 });
          playTone(ctx, { freq: f * 2.76, type: 'sine', duration: 0.04, gain: 0.02, attack: 0.002, release: 0.18 });
          playNoiseBurst(ctx, { duration: 0.05, gain: 0.08, filterType: 'bandpass', filterFreq: 2400, q: 2 });
        }
      }
    });
    const after = el('div', { class: 'fx-after' });
    // Teach the tap early; once a team has found it, stop suggesting it.
    if ((state.lockTaps || 0) === 0 && state.solvedIds.length <= 3) after.appendChild(text('p', 'lock-tap-hint', 'Tap the seal'));
    after.appendChild(text('p', 'lock-caption', pa.note));
    const jn = el('button', { class: 'journal-note', type: 'button' }, [document.createTextNode(PL('\u2726 Recorded in your ', '\u2726 Not\u00e9 dans votre ')), text('span', 'journal-note-link', 'journal')]);
    jn.addEventListener('click', openJournal);
    after.appendChild(jn);
    const btn = text('button', 'continue-btn', 'Continue');
    btn.addEventListener('click', () => {
      shieldInput();
      if (pa.callout !== null && pa.callout !== undefined) { pa.showCallout = true; render(); return; }
      sealAdvance();
    }, { once: true });
    after.appendChild(btn);
    const replay = text('button', 'cine-replay', '\u21BA REPLAY');
    replay.type = 'button';
    replay.setAttribute('aria-label', T('Replay the seal opening'));
    replay.addEventListener('click', () => {
      shieldInput();
      stamp.remove(); panel.classList.remove('fx-ok'); panel.style.paddingBottom = '';
      if (state.soundOn) playLockUnlockSound();
      requestAnimationFrame(() => applySealMoment(panel, pa));
    });
    after.appendChild(replay);
    stamp.appendChild(after);
    // Centre the seal on the part the team answered with, so it lands where they were looking.
    const part = answeredPart(panel);
    if (part) {
      const pr = panel.getBoundingClientRect(), r = part.getBoundingClientRect();
      stamp.style.setProperty('--fx-top', Math.max(0, r.top - pr.top + r.height / 2 - 120) + 'px');
    }
    panel.appendChild(stamp);
    requestAnimationFrame(() => {
      // Make room if the words and the button reach past the bottom of the puzzle, and bring them into view.
      const pr = panel.getBoundingClientRect(), sr = stamp.getBoundingClientRect();
      const over = sr.bottom - pr.bottom + 24;
      if (over > 0) panel.style.paddingBottom = (parseFloat(getComputedStyle(panel).paddingBottom) + over) + 'px';
      const top = seal.getBoundingClientRect().top;
      if (top < 0 || sr.bottom > window.innerHeight) window.scrollTo({ top: Math.max(0, window.scrollY + top - 40), behavior: reduced ? 'auto' : 'smooth' });
    });
    setTimeout(() => after.classList.add('shown'), reduced ? 200 : 1500);
    setTimeout(() => { btn.classList.add('ready'); replay.classList.add('ready'); if (btn.isConnected) btn.focus({ preventScroll: true }); }, reduced ? 300 : 2100);
  }


  function runeGlyph(cx, cy, rot, scale, color, mirrored) {
    return `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${mirrored ? -scale : scale} ${scale})" class="rs-rune">
      <path d="M0 -14 L0 14 M0 -6 L9 -14 M0 6 L-9 14 M0 0 L8 4" stroke="${color}" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>`;
  }

  // Three visually distinct rune-marks, one per door, used for the rare seals
  // and the final combination lock.
  const RUNE_PATHS = {
    R: 'M0,14 L0,-14 M0,-2 L-9,-14 M0,-2 L9,-14',
    V: 'M0,14 L0,-14 M0,-14 L9,-6 L0,1',
    A: 'M-10,-14 L10,14 M10,-14 L-10,14 M-10,0 L10,0'
  };

  function runeIconSVG(id) {
    const path = RUNE_PATHS[id] || RUNE_PATHS.R;
    return `<svg viewBox="-16 -16 32 32" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <path d="${path}" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="rune-icon-path"/>
    </svg>`;
  }

  function buildRuneSlabSVG(theme) {
    const sidingRunes = [runeGlyph(13, 60, 0, 0.7, theme.rune), runeGlyph(13, 200, 15, 0.7, theme.rune), runeGlyph(187, 100, -10, 0.7, theme.rune), runeGlyph(187, 210, 5, 0.7, theme.rune)]

  // ---------- 3. Turning wheel (Deep Archive) — a great stone disc that spins and rolls aside ----------
  function buildWheelDoorSVG(theme) {
    // The wheel rolls left along a groove in the floor and comes to rest
    // against the wall beside the doorway, fully visible, leaving the way open.
    // The picture is widened to the left so it has room to rest inside the panel.
    const wcx = 100, wcy = 125, wr = 111; // height matches the full doorway, resting on the floor line
    const rim = Array.from({ length: 16 }).map((_, i) => {
      const a = (i / 16) * Math.PI * 2;
      const x1 = wcx + Math.cos(a) * (wr - 10), y1 = wcy + Math.sin(a) * (wr - 10);
      const x2 = wcx + Math.cos(a) * wr, y2 = wcy + Math.sin(a) * wr;
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${theme.panelLine}" stroke-width="3"/>`;
    }).join('');
    const glyphs = [0, 60, 120, 180, 240, 300].map((deg, i) => {
      const a = (deg * Math.PI) / 180;
      const x = wcx + Math.cos(a) * (wr * 0.54), y = wcy + Math.sin(a) * (wr * 0.54);
      return runeGlyph(x, y, deg, 0.8, theme.rune).replace('class="rs-rune"', `class="rs-rune" style="animation-delay:${1.6 + i * 0.14}s"`);
    }).join('');
    // Stone courses on the wall the wheel comes to rest against
    let courses = '';
    for (let row = 0; row < 9; row++) {
      const y = 12 + row * 25;
      courses += `<line x1="-226" y1="${y}" x2="10" y2="${y}" stroke="#000000" stroke-width="1" opacity="0.28"/>`;
      for (let k = 0; k < 6; k++) {
        const x = -226 + k * 44 + (row % 2 ? 22 : 0);
        if (x < 10) courses += `<line x1="${x}" y1="${y}" x2="${x}" y2="${Math.min(y + 25, 236)}" stroke="#000000" stroke-width="1" opacity="0.22"/>`;
      }
    }
    return `
    <svg viewBox="-230 0 430 260" xmlns="http://www.w3.org/2000/svg" overflow="visible">
      <defs>
        <radialGradient id="wdStone" cx="35%" cy="30%" r="70%">
          <stop offset="0%" stop-color="${theme.stoneTop}"/><stop offset="100%" stop-color="${theme.stoneBottom}"/>
        </radialGradient>
        <radialGradient id="wdGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${theme.glow}" stop-opacity="0.95"/><stop offset="100%" stop-color="${theme.glow}" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="wdWall" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="${theme.frame}" stop-opacity="0"/>

          <stop offset="100%" stop-color="${theme.frame}" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="wdBeyond" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${theme.glow}" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="${theme.glow}" stop-opacity="0.55"/>
        </linearGradient>
      </defs>
      <rect x="-226" y="12" width="236" height="224" fill="url(#wdWall)"/>
      ${courses}
      <rect class="beyond-glow" x="0" y="0" width="200" height="260" fill="url(#wdGlow)"/>
      <rect x="14" y="14" width="172" height="222" rx="6" fill="${theme.frame}"/>
      <rect class="beyond-glow" x="22" y="22" width="156" height="214" rx="4" fill="url(#wdBeyond)"/>
      <rect x="14" y="228" width="172" height="8" fill="#000000" opacity="0.35"/>
      <line x1="-226" y1="236" x2="186" y2="236" stroke="${theme.panelLine}" stroke-width="3"/>
      <line x1="-220" y1="233" x2="100" y2="233" stroke="#000000" stroke-width="2" opacity="0.35" stroke-dasharray="10 5"/>
      <g class="wd-shadow"><ellipse cx="${wcx}" cy="236" rx="${wr * 0.8}" ry="6" fill="#000000" opacity="0.3"/></g>
      <g class="wd-wheel">
        <circle cx="${wcx}" cy="${wcy}" r="${wr}" fill="url(#wdStone)" stroke="${theme.panelLine}" stroke-width="4"/>
        ${rim}
        ${glyphs}
        <circle cx="${wcx}" cy="${wcy}" r="20" fill="${theme.panelLine}"/>
        <circle cx="${wcx}" cy="${wcy}" r="8" fill="${theme.rune}" opacity="0.7"/>
      </g>
      <g class="door-dust">
        <circle class="dust-mote" style="animation-delay:2.9s" cx="30" cy="80" r="2.4" fill="${theme.dust}"/>
        <circle class="dust-mote" style="animation-delay:3.05s" cx="170" cy="200" r="2.2" fill="${theme.dust}"/>
        <circle class="dust-mote" style="animation-delay:3.2s" cx="40" cy="220" r="2.6" fill="${theme.dust}"/>
        <circle class="dust-mote" style="animation-delay:3.15s" cx="-40" cy="226" r="2.4" fill="${theme.dust}"/>
        <circle class="dust-mote" style="animation-delay:3.3s" cx="-190" cy="224" r="2.2" fill="${theme.dust}"/>
      </g>

  }

  function buildDoorSVG(theme) {

  // =====================================================================
  // The Archivist's story: the gear bank, the three callouts, the note.
  // One rule governs every callout: nothing is written tonight. The card,
  // the brass and the book were all set down long ago, before the door was
  // closed; the team is only the first to find them.
  // =====================================================================
  const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  // The coded plate and the phrase on the tiles, one pair per language. Both
  // are a shift of three, letters A\u2013Z only, and both fill 13 tiles.
  const CIPHERS = {
    en: { text: 'WHDPZRUN ZLQV', answer: 'TEAMWORK WINS' },
    fr: { text: 'XQLV RQ JDJQH', answer: 'UNIS ON GAGNE' }
  };
  const cipherText = () => CIPHERS[LANG] ? CIPHERS[LANG].text : CIPHERS.en.text;
  const cipherAnswer = () => CIPHERS[LANG] ? CIPHERS[LANG].answer : CIPHERS.en.answer;
  // Brass tiles carry A\u2013Z only, so an accented team name shows plainly
  // (\u00c9 as E) instead of falling off the end of the alphabet.
  function tileSafe(str) {
    return (str || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ');
  }

  // the shifted message, the book after the Archivist's Sum.
  const CALLOUT_AFTER = { books: 0, d1p0: 1, d2p1: 2 };

  function padCentre(str, n) {
    const l = Math.max(0, Math.floor((n - str.length) / 2));
    return (' '.repeat(l) + str + ' '.repeat(n)).slice(0, n);
  }
  // The gear bank is as wide as the answer, or the team's name if that is longer.
  function gearBankWidth() { return Math.max(cipherAnswer().length, (state.teamName || '').length); }
  // Every tile starts on a random letter: never the right one, different every playthrough.
  function scrambledStart(answerPadded) {
    return Array.from(answerPadded).map((ch) => {
      if (ch === ' ') return ' ';
      let r;
      do { r = ABC[Math.floor(Math.random() * 26)]; } while (r === ch);
      return r;
    }).join('');
  }
  function gbGearPath(cx, cy, r, teeth) {
    let d = '';
    const inner = r * 0.78;
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2, a1 = ((i + 0.42) / teeth) * Math.PI * 2, a2 = ((i + 0.58) / teeth) * Math.PI * 2, a3 = ((i + 1) / teeth) * Math.PI * 2;
      const p = (ang, rad) => (cx + Math.cos(ang) * rad).toFixed(1) + ' ' + (cy + Math.sin(ang) * rad).toFixed(1);
      d += (i === 0 ? 'M' : 'L') + p(a0, inner) + 'L' + p(a1, r) + 'L' + p(a2, r) + 'L' + p(a3, inner);
    }

    const cur = Array.from(startText).map(idxOf);
    const pw = Math.min(W - 60, 26 + cipherText().length * 15), px = (W - pw) / 2, py = 14;
    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      <text x="${W / 2}" y="${(py + plateH * 0.7).toFixed(1)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="17" letter-spacing="2" fill="#2A1A08">${cipherText()}</text>
      <path d="M${W / 2} ${py + plateH} V${TOP}" stroke="#2A1A06" stroke-width="3"/><path d="M${W / 2} ${py + plateH} V${TOP}" stroke="#A67A30" stroke-width="1.6"/>
      <rect x="14" y="${TOP}" width="${W - 28}" height="${FH.toFixed(1)}" rx="4" fill="#211732" stroke="#5A4478"/>
      <rect class="gb-lockglow" x="14" y="${TOP}" width="${W - 28}" height="${FH.toFixed(1)}" rx="4" fill="none" stroke="#F2C35A" stroke-width="2"/>`;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * pitch, gx = x + tw / 2, gy = i % 2 ? GY2 : GY1;
      let cells = '';
      for (let k = 0; k <= BLANK; k++) {
        const cy = y + k * th;
        if (k === BLANK) cells += `<rect x="${x.toFixed(2)}" y="${cy.toFixed(2)}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" fill="url(#${uid}Dark)"/><path d="M${(x + tw * 0.3).toFixed(1)} ${(cy + th / 2).toFixed(1)} H${(x + tw * 0.7).toFixed(1)}" stroke="#3A2808" stroke-width="1" opacity="0.8"/>`;
        else cells += `<rect x="${x.toFixed(2)}" y="${cy.toFixed(2)}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" fill="url(#${uid}Face)"/><text x="${(x + tw / 2).toFixed(2)}" y="${(cy + th * 0.66).toFixed(2)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="${(tw * 0.6).toFixed(1)}" fill="#2A1A08">${reelCells[k]}</text>`;
        cells += `<path d="M${x.toFixed(2)} ${(cy + th / 2).toFixed(2)} H${(x + tw).toFixed(2)}" stroke="#2A1A06" stroke-opacity="0.45" stroke-width="0.8"/>`;
      }
      svg += `<g class="gb-col" data-i="${i}">
        <rect x="${(x - gap / 2).toFixed(2)}" y="${TOP}" width="${pitch.toFixed(2)}" height="${FH.toFixed(1)}" fill="transparent"/>
        <path d="M${gx.toFixed(1)} ${(y + th).toFixed(1)} V${gy.toFixed(1)}" stroke="#2A1A06" stroke-width="${(tw * 0.2 + 1.2).toFixed(1)}" stroke-linecap="round"/>
        <path d="M${gx.toFixed(1)} ${(y + th).toFixed(1)} V${gy.toFixed(1)}" stroke="#A67A30" stroke-width="${(tw * 0.2).toFixed(1)}" stroke-linecap="round"/>
        <g class="gb-gear" style="transform-origin:${gx.toFixed(1)}px ${gy.toFixed(1)}px">
          <path d="${gbGearPath(gx, gy, GR, 10)}" fill="#6A4E22" stroke="#2A1A06" stroke-width="0.8"/>
          <circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${(GR * 0.3).toFixed(1)}" fill="#C9962E" stroke="#2A1A06" stroke-width="0.7"/></g>
        <g clip-path="url(#${uid}C${i})"><g class="gb-reel">${cells}</g></g>
        <rect x="${x.toFixed(2)}" y="${y}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="1.5" fill="none" stroke="#3A2608" stroke-width="0.9"/>
        <rect class="gb-flash" x="${x.toFixed(2)}" y="${y}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="1.5" fill="#FFF1C4" style="animation-delay:${(i * 0.07).toFixed(2)}s"/>
        <rect class="gb-sel" x="${(x - 2).toFixed(2)}" y="${y - 2}" width="${(tw + 4).toFixed(2)}" height="${(th + 4).toFixed(2)}" rx="2.5" fill="none" stroke="#F2C35A" stroke-width="1.6"/>
      </g>`;
    }
    svg += `<rect class="gb-lampbar" x="-140" y="${TOP}" width="130" height="${FH.toFixed(1)}" fill="url(#${uid}Sweep)" opacity="0"/></svg>`;
    const stage = el('div', { class: 'gb-stage', html: svg });
    const reels = Array.from(stage.querySelectorAll('.gb-reel'));
    const gears = Array.from(stage.querySelectorAll('.gb-gear'));
    const angle = new Array(n).fill(0);
    const place = (i, instant) => {
      reels[i].classList.toggle('snap', !!instant);
      reels[i].style.transform = 'translateY(' + (-cur[i] * th).toFixed(2) + 'px)';
    };
    for (let i = 0; i < n; i++) place(i, true);
    const turnGear = (i, deg, long) => {
      angle[i] += deg;
      gears[i].classList.toggle('long', !!long);
      gears[i].style.transform = 'rotate(' + angle[i] + 'deg)';
    };
    return {
      el: stage, n,
      letterAt: (i) => (cur[i] === BLANK ? ' ' : reelCells[cur[i]]),
      text: () => cur.map((k) => (k === BLANK ? ' ' : reelCells[k])).join(''),
      isBlank: (i) => cur[i] === BLANK,
      step(i, dir) {
        if (cur[i] === BLANK) return;
        cur[i] += dir;
        reels[i].classList.remove('long');
        place(i, false);
        turnGear(i, -dir * 40, false);
        // after the roll, move quietly back to the middle alphabet so the drum never runs out
        setTimeout(() => { if (cur[i] < 26 || cur[i] >= 52) { cur[i] = 26 + ((cur[i] % 26) + 26) % 26; place(i, true); } }, 320);
      },
      rollTo(i, ch, delayMs) {
        setTimeout(() => {
          const target = ch === ' ' ? BLANK : ((cur[i] === BLANK || cur[i] >= 52) ? 26 : 52) + ABC.indexOf(ch);
          reels[i].classList.add('long');
          reels[i].style.setProperty('--rd', (1 + Math.random() * 0.3 + i * 0.03).toFixed(2) + 's');
          cur[i] = target;
          place(i, false);
          gears[i].style.setProperty('--rd', '1.5s');
          turnGear(i, -(220 + i * 7), true);
        }, delayMs);
      },
      shake() { stage.classList.remove('gb-shake'); void stage.offsetWidth; stage.classList.add('gb-shake'); },
      lamp() { const l = stage.querySelector('.gb-lampbar'); l.classList.remove('gb-lamp'); void l.getBoundingClientRect(); l.classList.add('gb-lamp'); },
      solved() {
        stage.classList.add('gb-solved');
        for (let i = 0; i < n; i++) turnGear(i, -40, false);
        const s = stage.querySelector('svg');
        setTimeout(() => { s.classList.remove('gb-seat'); void s.getBoundingClientRect(); s.classList.add('gb-seat'); }, 120);
      }
    };
  }

  // ---------- The shifted message: turn the brass tiles to decode the plate ----------
  function buildGearCipher(puzzle, panel, hint, solve) {
    const n = gearBankWidth();
    const answer = padCentre(cipherAnswer(), n);
    // Tiles are kept per language: the two phrases put their gaps in
    // different places, so one language's half-finished row cannot be poured
    // into the other. Switching away and back brings your own row back.
    if (!state.gearTiles || typeof state.gearTiles !== 'object') state.gearTiles = {};
    const fits = (tiles) => typeof tiles === 'string' && tiles.length === n &&
      tiles.split('').every((ch, i) => (ch === ' ') === (answer[i] === ' '));
    if (!fits(state.gearTiles[LANG])) state.gearTiles[LANG] = scrambledStart(answer);
    const bank = GearBank(state.gearTiles[LANG]);
    const save = () => { state.gearTiles[LANG] = bank.text(); };
    panel.appendChild(howTo('Tap a tile to choose it. Turn it with \u2212 and +, or drag the letter up and down. On a keyboard, you can also type a letter or use the arrow keys. When the message is right, turn the key.'));
    panel.appendChild(bank.el);
    const live = el('p', { class: 'sr-only', 'aria-live': 'polite' });
    panel.appendChild(live);

    const minus = text('button', 'dial-btn', '\u2212'); minus.type = 'button'; minus.setAttribute('aria-label', T('Turn this tile back one letter'));
    const plus = text('button', 'dial-btn', '+'); plus.type = 'button'; plus.setAttribute('aria-label', T('Turn this tile forward one letter'));
    const drum = el('div', { class: 'dial-drum', role: 'img' });
    const strip = el('div', { class: 'dial-strip' });
    const nums = [-2, -1, 0, 1, 2].map((o) => { const d = el('div', { class: 'dial-num' + (o === 0 ? ' current' : ''), style: 'top:' + (o * 46 - 23) + 'px' }); strip.appendChild(d); return d; });
    drum.appendChild(strip); drum.appendChild(el('div', { class: 'dial-window' }));
    panel.appendChild(el('div', { class: 'dial-row gb-letter-row' }, [minus, drum, plus]));
    const prev = text('button', 'ghost cw-back', '\u2190 Previous'); prev.type = 'button'; prev.setAttribute('aria-label', T('Previous tile'));
    const next = text('button', 'ghost cw-back', 'Next \u2192'); next.type = 'button'; next.setAttribute('aria-label', T('Next tile'));
    const which = el('span', { class: 'gb-tile-label' });
    panel.appendChild(el('div', { class: 'gb-tile-row' }, [prev, which, next]));
    const key = el('button', { type: 'button', class: 'gb-key', html: '<span class="gb-key-pic"><svg viewBox="0 0 60 60" aria-hidden="true"><g class="key-body"><circle cx="30" cy="16" r="9" fill="none" stroke="#120C06" stroke-width="5"/><circle cx="30" cy="16" r="9" fill="none" stroke="#E8B23A" stroke-width="3"/><path d="M30 25 V50" stroke="#120C06" stroke-width="5.5" stroke-linecap="round"/><path d="M30 25 V50" stroke="#E8B23A" stroke-width="3.2" stroke-linecap="round"/><path d="M30 41 H37 M30 47 H39" stroke="#120C06" stroke-width="5" stroke-linecap="round"/><path d="M30 41 H37 M30 47 H39" stroke="#E8B23A" stroke-width="2.8" stroke-linecap="round"/></g></svg></span><span>' + T('Turn the key') + '</span>' });
    panel.appendChild(el('div', { class: 'gb-key-row' }, [key]));
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    panel.appendChild(feedback);

    const cols = Array.from(bank.el.querySelectorAll('.gb-col'));
    const lettersTotal = cipherAnswer().replace(/ /g, '').length;
    let sel = answer.search(/\S/), solved = false;
    const letterNo = () => answer.slice(0, sel + 1).replace(/ /g, '').length;
    const showLetter = (dir) => {
      const L = bank.letterAt(sel);
      nums.forEach((d, k) => { d.textContent = ABC[(ABC.indexOf(L) + k - 2 + 26) % 26]; });
      if (dir) { strip.classList.add('snap'); strip.style.transform = 'translateY(' + (dir * 46) + 'px)'; void strip.offsetWidth; strip.classList.remove('snap'); }
      strip.style.transform = 'translateY(0)';
      drum.setAttribute('aria-label', PL('Tile ' + letterNo() + ' shows ' + L, 'La tuile ' + letterNo() + ' affiche ' + L));
    };
    const select = (i) => {
      if (bank.isBlank(i) || answer[i] === ' ') return;
      sel = i;
      cols.forEach((c, k) => c.classList.toggle('selected', k === i));
      which.textContent = PL('TILE ' + letterNo() + ' OF ' + lettersTotal, 'TUILE ' + letterNo() + ' SUR ' + lettersTotal);
      showLetter(0);
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(i) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(i) + '.');
    };
    const move = (d) => { let i = sel; do { i = (i + d + n) % n; } while (answer[i] === ' '); select(i); };
    const turn = (dir) => {
      if (solved) return;
      bank.step(sel, dir); save(); playSoftTap('tick');
      feedback.className = 'feedback'; feedback.textContent = '';
      showLetter(dir);
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(sel) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(sel) + '.');
    };
    cols.forEach((c, i) => c.addEventListener('click', () => { if (!solved) select(i); }));
    prev.addEventListener('click', () => move(-1));
    next.addEventListener('click', () => move(1));
    minus.addEventListener('click', () => turn(-1));
    plus.addEventListener('click', () => turn(1));
    // Drag the drum with a finger or the mouse: down for earlier letters, up for later ones.
    let dragY = null, dragOff = 0;
    const STEP = 46;
    drum.addEventListener('pointerdown', (e) => {
      if (solved) return;
      dragY = e.clientY; dragOff = 0;
      drum.classList.add('dragging'); strip.classList.add('snap');
      drum.setPointerCapture(e.pointerId); e.preventDefault();
    });
    drum.addEventListener('pointermove', (e) => {
      if (dragY === null) return;
      dragOff += e.clientY - dragY; dragY = e.clientY;
      while (dragOff > STEP / 2) { dragOff -= STEP; bank.step(sel, -1); save(); playSoftTap('tick'); showLetterNow(); }
      while (dragOff < -STEP / 2) { dragOff += STEP; bank.step(sel, 1); save(); playSoftTap('tick'); showLetterNow(); }
      strip.style.transform = 'translateY(' + dragOff.toFixed(1) + 'px)';
    });
    const showLetterNow = () => {
      const L = bank.letterAt(sel);
      nums.forEach((d, k) => { d.textContent = ABC[(ABC.indexOf(L) + k - 2 + 26) % 26]; });
    };
    const endDrag = () => {
      if (dragY === null) return;
      dragY = null; drum.classList.remove('dragging'); strip.classList.remove('snap');
      strip.style.transform = 'translateY(0)';
      feedback.className = 'feedback'; feedback.textContent = '';
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(sel) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(sel) + '.');
    };
    drum.addEventListener('pointerup', endDrag);
    drum.addEventListener('pointercancel', endDrag);
    drum.addEventListener('wheel', (e) => { if (solved) return; e.preventDefault(); turn(e.deltaY > 0 ? 1 : -1); }, { passive: false });
    panel.tabIndex = -1;
    panel.addEventListener('keydown', (e) => {
      if (solved || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { move(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { move(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { turn(-1); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { turn(1); e.preventDefault(); }
      else if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const want = e.key.toUpperCase();
        let d = ABC.indexOf(want) - ABC.indexOf(bank.letterAt(sel));
        if (d > 13) d -= 26;
        if (d < -13) d += 26;
        const dir = d > 0 ? 1 : -1, tile = sel;
        for (let k = 0; k < Math.abs(d); k++) setTimeout(() => { bank.step(tile, dir); save(); if (sel === tile) showLetterNow(); }, k * 40);
        playSoftTap('tick');
        setTimeout(() => move(1), Math.abs(d) * 40 + 60);
      }
    });
    key.addEventListener('click', () => {
      if (solved) return;
      if (bank.text() === answer) {
        solved = true;
        [minus, plus, key, prev, next].forEach((b) => { b.disabled = true; });
        key.classList.add('turned');
        cols.forEach((c) => c.classList.remove('selected'));
        bank.solved(); bank.lamp();
        playSoftTap('find');
        state.collected.push(puzzle.title);
        // Let the light run along the tiles before the seal opens.
        setTimeout(solve, 1300);
      } else {
        bank.shake();
        registerMiss(puzzle, feedback, hint, 'The gears jam. At least one tile is wrong.', 3);
      }
    });
    setTimeout(() => { select(sel); if (panel.isConnected) panel.focus({ preventScroll: true }); }, 30);
  }

  // ---------- Callout I: the card, found under blown dust ----------
  function wrapWords(str, max) {
    const out = []; let line = '';
    str.split(' ').forEach((w) => { if ((line + ' ' + w).trim().length > max && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); });
    if (line) out.push(line);
    return out;
  }
  function escapeXML(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function coMotes(count, x0, y0, w) {
    return Array.from({ length: count }).map(() => {
      const x = x0 + Math.random() * w, y = y0 - Math.random() * 10;
      return `<circle class="co-mote" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(0.9 + Math.random()).toFixed(1)}" fill="#E9D2A8" style="--mx:${(Math.random() * 14 - 7).toFixed(0)}px; animation-delay:${(0.6 + Math.random() * 1.6).toFixed(2)}s"/>`;
    }).join('');
  }
  function calloutCard() {
    const L1 = TR('The moon was shelved beside the star. \u2014 A.');
    // Her pencil, before she could know anything else about them. The team's
    // name belongs to the next callout, where the brass tiles spell it out.
    const L2 = wrapWords(PL('I knew you could not get here alone.',
      'Je savais que vous ne pouviez pas arriver jusqu\u2019ici seuls.'), 36);
    const lines = [L1].concat(L2);
    const X = 28, CW = 304, LH = 25;
    const cardH = 44 + lines.length * LH + 16;
    const T = Math.round((200 - cardH) / 2);
    const base = (i) => T + 58 + i * LH;
    const l2top = base(1) - 18, l2h = L2.length * LH + 4;
    const clouds = Array.from({ length: 16 }).map((_, i) => {
      const x = X + 22 + (i % 8) * 36 + Math.random() * 8, y = l2top + 6 + Math.floor(i / 8) * Math.max(8, l2h / 2) + Math.random() * 5;
      const d = (0.95 + (i % 8) * 0.06 + Math.random() * 0.08).toFixed(2);
      return `<ellipse class="co-blow" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(18 + Math.random() * 10).toFixed(0)}" ry="${(8 + Math.random() * 4).toFixed(0)}" fill="#B8A782" style="--bx:${(48 + Math.random() * 46).toFixed(0)}px; --by:${(-10 - Math.random() * 14).toFixed(0)}px; animation-delay:${d}s"/>`;
    }).join('');
    return el('div', { class: 'co-stage', role: 'img', 'aria-label': PL('A library card. Dust is blown off it, and under her note there is a second line: ' + L2.join(' '),
        'Une fiche de biblioth\u00e8que. On souffle la poussi\u00e8re, et sous sa note il y a une deuxi\u00e8me ligne\u00a0: ' + L2.join(' ')), html: `
    <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="cdDesk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A2A1C"/><stop offset="1" stop-color="#1A1109"/></linearGradient>
        <linearGradient id="cdPaper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EEE0B8"/><stop offset="0.55" stop-color="#DFCB98"/><stop offset="1" stop-color="#CDB881"/></linearGradient>
        <radialGradient id="cdPool" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0.5"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient>
        <clipPath id="cdClip"><rect x="${X}" y="${T}" width="${CW}" height="${cardH}" rx="3"/></clipPath>
      </defs>
      <rect width="360" height="200" fill="url(#cdDesk)"/>
      ${Array.from({ length: 7 }).map((_, i) => `<path d="M0 ${18 + i * 27} H360" stroke="#000" stroke-opacity="0.18"/>`).join('')}
      <ellipse cx="180" cy="100" rx="160" ry="82" fill="url(#cdPool)"/>
      <g transform="rotate(-1.2 180 100)">
        <rect x="${X + 2}" y="${T + 3}" width="${CW}" height="${cardH}" rx="3" fill="#000" opacity="0.35"/>
        <rect x="${X}" y="${T}" width="${CW}" height="${cardH}" rx="3" fill="url(#cdPaper)" stroke="#8C7038"/>
        <g clip-path="url(#cdClip)">
          ${lines.map((_, i) => `<path d="M${X} ${base(i) + 7} H${X + CW}" stroke="#7A5A2E" stroke-opacity="0.2"/>`).join('')}
          <text x="${X + 16}" y="${T + 24}" font-family="Cinzel, Georgia, serif" font-size="9.5" letter-spacing="1.6" fill="#6B4A1E">${TR('LIBRARY CARD \u00b7 THIS SHELF')}</text>
          ${lines.map((t, i) => `<text x="${X + 16}" y="${base(i)}" font-family="Alegreya, Georgia, serif" font-style="italic" font-size="14.5" fill="#5D5246">${escapeXML(t)}</text>`).join('')}
          <rect class="co-blanket" x="${X + 8}" y="${l2top}" width="${CW - 16}" height="${l2h}" fill="#BCAB85" opacity="0.93" rx="3"/>
          ${clouds}
        </g>
      </g>
      ${coMotes(8, 170, 160, 160)}
    </svg>` });
  }
  // ---------- Callout II: the same gear bank rolls on to the name ----------
  function calloutGears(name) {
    const n = gearBankWidth();
    const bank = GearBank(padCentre(cipherAnswer(), n));
    const to = padCentre(tileSafe(name), n);
    const box = el('div', { class: 'co-gears', role: 'img', 'aria-label': name ? PL('The tiles turn from TEAMWORK WINS to ' + name + '.', 'Les tuiles passent de UNIS ON GAGNE \u00e0 ' + name + '.')
      : PL('The tiles turn from TEAMWORK WINS to empty faces.', 'Les tuiles passent de UNIS ON GAGNE \u00e0 des faces vides.') }, [bank.el]);
    setTimeout(() => {
      for (let i = 0; i < n; i++) bank.rollTo(i, to[i], i * 90);
      setTimeout(() => bank.lamp(), 400 + n * 90);
    }, 1100);
    return box;
  }
  // ---------- Callout III: her book, each page keeping its own lines ----------
  function calloutBook(name) {

      left.appendChild(el('div', { class: 'co-entry' }, [text('span', 'who', who), text('span', 'when', when)]));

  const CALLOUT_SCENES = [

  // ---------- The note under the crown: folded in three, lifted, then opened ----------
  function buildArchivistNote() {
    const body = 'I wrote your name three times before I closed this door: on a card, on brass, and at the end of my book. I never met you. I only knew one thing. One person alone could never reach this room. It would take many, working together, and they would have a name. The crown was never lost. It was kept for you.';

    let ph = 96;
    const content = () => el('div', { class: 'content', 'aria-hidden': 'true' }, [el('p', {}, [document.createTextNode(body)]), el('span', { class: 'sig' }, [document.createTextNode(sig)])]);
    [0, 1, 2].forEach((i) => {

    });

    wrap.appendChild(fold);
    // Size the three folds to the words, so each third of the paper carries its share.
    requestAnimationFrame(() => {

  // ---------- Memory seals: pairs rarely start side by side ----------
  // At most one side-by-side pair in a whole playthrough, across both memory
  // seals, and only in about one playthrough in four. Diagonals do not count.
  function sideBySidePairs(order, cols) {
    const rows = Math.ceil(order.length / cols); let c = 0;
    for (let i = 0; i < order.length; i++) {
      const r = Math.floor(i / cols), k = i % cols;
      if (k < cols - 1 && i + 1 < order.length && order[i] === order[i + 1]) c++;
      if (r < rows - 1 && i + cols < order.length && order[i] === order[i + cols]) c++;
    }
    return c;
  }
  function dealPairs(shapes) {
    const cols = shapes.length * 2 <= 6 ? 3 : 4;
    if (state.pairBudget === null || state.pairBudget === undefined) state.pairBudget = Math.random() < 0.25 ? 1 : 0;
    let order = shuffled(shapes.concat(shapes)), a = sideBySidePairs(order, cols);
    for (let tries = 0; tries < 500 && a > state.pairBudget; tries++) { order = shuffled(shapes.concat(shapes)); a = sideBySidePairs(order, cols); }
    while (a > state.pairBudget) { order = shuffled(shapes.concat(shapes)); a = sideBySidePairs(order, cols); }
    state.pairBudget -= a;
    return order;
  }

  // ---------- The misplaced books (Reading Room) ----------
  // Seven books. The faded library card shows every book's outline (height and
  // thickness) in order, but only two symbols can still be read; a pencilled
  // note settles the last pair.
  // The worn sequence: numbers carved clockwise around a stone rim, starting at
  // the flame; the last plaque has been worn smooth.
  function wornRimSVG(nums) {
    const plaques = [];
    for (let k = 0; k < 6; k++) {
      const a = (-90 + k * 60) * Math.PI / 180, x = 150 + Math.cos(a) * 104, y = 150 + Math.sin(a) * 104;

      } else {
        const scratches = Array.from({ length: 6 }).map((_, i) => `<path d="M${-16 + i * 6} ${-10 + (i % 3) * 4} l ${9 - i} ${12 - (i % 2) * 6}" stroke="#6E5A44" stroke-width="0.9" opacity="0.8"/>`).join('');
        plaques.push(`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect x="-24" y="-17" width="48" height="34" rx="5" fill="#3A2E24" stroke="#6E5A3A" stroke-width="1.2" stroke-dasharray="3 2"/>${scratches}<text x="0" y="8" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="22" font-weight="700" fill="#6E5A44" opacity="0.5">?</text></g>`);
      }
      if (k < 5) {
        const a2 = (-60 + k * 60) * Math.PI / 180;
        plaques.push(`<g transform="translate(${(150 + Math.cos(a2) * 104).toFixed(1)} ${(150 + Math.sin(a2) * 104).toFixed(1)}) rotate(${-60 + k * 60 + 90})"><path d="M-4 -5 L3 0 L-4 5" fill="none" stroke="#C9962E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`);
      }
    }
    const pits = Array.from({ length: 30 }).map((_, i) => {
      const x = 150 + Math.sin(i * 12.9898) * 110, y = 150 + Math.cos(i * 78.233) * 110;
      return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(3 + (i * 37 % 7)).toFixed(1)}" fill="#000" opacity="0.08"/>`;

      <defs><radialGradient id="rimStone" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#6A5440"/><stop offset="1" stop-color="#2E2218"/></radialGradient>
      <radialGradient id="rimGlow"><stop offset="0" stop-color="#E8762B" stop-opacity="0.35"/><stop offset="1" stop-color="#E8762B" stop-opacity="0"/></radialGradient></defs>
      <circle cx="150" cy="150" r="150" fill="url(#rimGlow)"/>
      <circle cx="150" cy="150" r="138" fill="url(#rimStone)" stroke="#C9962E" stroke-width="3"/>
      <circle cx="150" cy="150" r="132" fill="none" stroke="#7A5418" stroke-width="1"/>
      ${pits}
      <circle cx="150" cy="150" r="72" fill="none" stroke="#1A120B" stroke-width="2" opacity="0.7"/>
      <circle cx="150" cy="150" r="70" fill="none" stroke="#8A6A48" stroke-width="0.8" opacity="0.5"/>
      <g transform="translate(150 150)" fill="none" stroke="#C9962E" stroke-width="2.4" stroke-linejoin="round" opacity="0.8"><path d="M-30 18 L-30 -8 L-18 4 L-9 -16 L0 -2 L9 -16 L18 4 L30 -8 L30 18 Z"/><path d="M-32 24 H32"/></g>
      ${plaques.join('')}
      <g transform="translate(150 12)"><path d="M0 -10 C6 -3 7 2 5 6 A5.5 5.5 0 0 1 -5 6 C-7 2 -5 -2 -2 -6 C-1 -2 0 -3 0 -10 Z" fill="#E8762B" stroke="#3A1A08" stroke-width="0.8"/><path d="M0 -2 C2 1 2 3 1.5 5 A2 2 0 0 1 -1.5 5 C-2 3 -1 1 0 -2 Z" fill="#FFE6A8"/></g>
