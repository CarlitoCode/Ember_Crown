  // ---------- The Vault Passage (after the Deep Archive) ----------
  // Two screens. Screen 1: the team's solved tile lock glows, rumbles and falls
  // away, and the view tilts down into a dark pit with the faintest glimmer far
  // below. Screen 2: the camera drops in, and torches light an ancient passage,
  // pair by pair, toward the dormant altar and vault door (dials still off
  // centre and unlit). The floor scene is real CSS 3D; the passage is SVG.
  const VP_CAPTION_1 = 'The tiles of the lock flare, tremble, and fall away into the dark. Below, there is only blackness, and the faintest glimmer of light.';
  const VP_CAPTION_2 = 'You drop into an ancient passage. One by one, old torches flicker to life, lighting the way to an altar and a great door, waiting at the end.';
  const VP_READY_MS = { 1: 5200, 2: 5600 };   // when each screen's button appears
  const VP_LATE = { 1: { caption: 4.3, seal: 4.9 }, 2: { caption: 4.7 } };

  function vpFloorHTML() {
    const fp = (l, t, w, h) => `<div class="vp-fp" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"></div>`;
    let tiles = '<div class="vp-face"></div>';
    TILE_ANSWER.forEach((sym, i) => {
      const r = Math.floor(i / 5), c = i % 5;
      const g = ((r + c) * 0.06).toFixed(2);
      const o = (Math.hypot(c - 2, r - 2) * 0.12 + ((r * 7 + c * 3) % 4) * 0.03).toFixed(2);
      const rx = (((r * 5 + c * 11) % 7) - 3) * 28, ry = (((r * 3 + c * 7) % 7) - 3) * 30;
      tiles += `<div class="vp-tl ${TILE_GIVEN.includes(i) ? 'vp-cv' : 'vp-pl'}" style="left:${3 + c * 23}px;top:${3 + r * 23}px;--g:${g}s;--o:${o}s;--rx:${rx}deg;--ry:${ry}deg">${tileSymSVG(sym)}</div>`;
    });
    // the far floor, the pit's walls and floor, the lock, then the near floor (drawn after the lock so it hides it as it falls)
    return '<div class="vp-shelf"></div>' + fp(0, 0, 600, 360) +
      '<div class="vp-w" style="left:240px;top:360px;width:120px;height:300px;transform-origin:50% 0;transform:rotateX(-90deg)"></div>' +
      '<div class="vp-w" style="left:240px;top:360px;width:300px;height:120px;transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#301610,#0E0605 80%)"></div>' +
      '<div class="vp-w" style="left:60px;top:360px;width:300px;height:120px;transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(270deg,#301610,#0E0605 80%)"></div>' +
      '<div class="vp-pit"></div><div class="vp-glim"></div>' +
      `<div class="vp-brd">${tiles}</div>` +
      fp(0, 480, 600, 120) + fp(0, 360, 240, 120) + fp(360, 360, 240, 120);
  }

  // dust kicked up around the lock, the same puff as the altar scene's
  function vpDustSVG() {
    const puffs = [[118, 0.2, 176], [146, 0.55, 178], [178, 0.1, 178], [210, 0.4, 178], [240, 0.7, 176], [128, 0.9, 90], [226, 1.1, 90], [176, 0.35, 88]];
    return '<svg class="vp-ov" viewBox="0 0 360 240" aria-hidden="true">' + puffs.map(([x, d, y]) =>
      `<ellipse class="vp-ad" style="animation-delay:${(1.35 + d).toFixed(2)}s" cx="${x}" cy="${y}" rx="${((y < 120 ? 9 : 14) + (x % 9) * (y < 120 ? 0.6 : 1)).toFixed(1)}" ry="${y < 120 ? 4.5 : 6}" fill="#8C7C66"/>`).join('') + '</svg>';
  }

  function vpPassageSVG() {
    const vx = 180, vy = 128, W = 178, H = 118, C = 132, se = 0.22, S = [1, 0.72, 0.52, 0.38, 0.28];
    const X = (s, d) => vx + d * W * s, Yc = (s) => vy - C * s, Yf = (s) => vy + H * s;
    const P = (s, d, f) => `${X(s, d).toFixed(1)},${(Yc(s) + (Yf(s) - Yc(s)) * f).toFixed(1)}`;
    const pal = ['#3A1C12', '#40200F', '#351A11', '#452516', '#2E160E', '#3C1E14'];
    const L = S.concat([se]);
    let base = '<rect width="360" height="240" fill="#080403"/>';
    [-1, 1].forEach((d) => { base += `<polygon points="${P(1, d, 0)} ${P(se, d, 0)} ${P(se, d, 1)} ${P(1, d, 1)}" fill="#2A140E"/>`; });
    base += `<polygon points="${X(1, -1)},${Yc(1)} ${X(1, 1)},${Yc(1)} ${X(se, 1)},${Yc(se)} ${X(se, -1)},${Yc(se)}" fill="#100604"/>` +
      `<polygon points="${X(1, -1)},${Yf(1)} ${X(1, 1)},${Yf(1)} ${X(se, 1)},${Yf(se)} ${X(se, -1)},${Yf(se)}" fill="#1E0E09"/>`;
    // old stone blocks (a few missing), moss near the floor, sagging shelves of old books
    let blk = '', moss = '', sh = '';
    for (let i = 0; i < L.length - 1; i++) {
      const a = L[i], b = L[i + 1];
      [-1, 1].forEach((d) => {
        for (let r = 0; r < 6; r++) {
          const f0 = r / 6, f1 = (r + 1) / 6, cuts = r % 2 ? [0, 0.5, 1] : [0, 0.3, 0.72, 1];
          for (let j = 0; j < cuts.length - 1; j++) {
            const s0 = a + (b - a) * cuts[j], s1 = a + (b - a) * cuts[j + 1];
            const h = (i * 31 + r * 17 + (d > 0 ? 7 : 0) + j * 13) % 6, miss = (i * 7 + r * 5 + j * 3 + (d > 0 ? 2 : 0)) % 13 === 0;
            blk += `<polygon points="${P(s0, d, f0)} ${P(s1, d, f0)} ${P(s1, d, f1)} ${P(s0, d, f1)}" fill="${miss ? '#140805' : pal[h]}" stroke="#140704" stroke-width="${(1.1 * s0).toFixed(2)}"/>`;
            if (r >= 4 && h % 3 === 0) {
              const [mx, my] = P((s0 + s1) / 2, d, f1 - 0.03).split(',');
              moss += `<ellipse cx="${mx}" cy="${my}" rx="${(10 * s0).toFixed(1)}" ry="${(4 * s0).toFixed(1)}" fill="#3E4A26" opacity="0.35"/>`;
            }
          }
        }
        if ((i === 1 && d < 0) || (i === 2 && d > 0) || (i === 3 && d < 0)) {
          const n0 = a - (a - b) * 0.12, n1 = b + (a - b) * 0.12;
          sh += `<polygon points="${P(n0, d, 0.3)} ${P(n1, d, 0.3)} ${P(n1, d, 0.72)} ${P(n0, d, 0.72)}" fill="#0C0503" stroke="#4A2418" stroke-width="${(2 * a).toFixed(1)}"/>`;
          [0.51, 0.72].forEach((fy) => {
            for (let k = 0; k < 9; k++) {
              if ((k + i) % 4 === 3) continue;
              const s = n0 + (n1 - n0) * (k + 0.5) / 9, hgt = 0.12 + ((k * 7 + i) % 4) * 0.025, tilt = (k * 3 + i) % 5 === 0 ? 0.35 : 0;
              const [bx, by] = P(s, d, fy).split(',').map(Number);
              const [tx, ty] = P(s - (n0 - n1) * tilt / 9, d, fy - hgt).split(',').map(Number);
              sh += `<line x1="${bx}" y1="${by}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${['#5A2A1A', '#3A3A26', '#4A3A1A', '#5A2418', '#2E2436'][(k + i) % 5]}" stroke-width="${(6 * s).toFixed(1)}" opacity="0.75"/>`;
            }
            sh += `<polyline points="${P(n0, d, fy)} ${P((n0 + n1) / 2, d, fy + 0.03)} ${P(n1, d, fy)}" fill="none" stroke="#3A1A10" stroke-width="${(2.5 * a).toFixed(1)}"/>`;
          });
        }
      });
    }
    let ck = '';
    [[0.9, -1, 0.2], [0.55, 1, 0.35], [0.4, -1, 0.6], [0.7, 1, 0.15]].forEach(([s, d, f]) => {
      const pts = [];
      for (let k = 0; k < 5; k++) pts.push(P(s - k * 0.03, d, f + k * 0.08 + (k % 2 ? 0.03 : -0.02)));
      ck += `<polyline points="${pts.join(' ')}" fill="none" stroke="#0A0403" stroke-width="${(1.4 * s).toFixed(1)}"/>`;
    });
    let stn = '';

    S.slice().reverse().forEach((s, ri) => {

  function vpStage(part) {
    const stage = el('div', { class: 'vp-stage' });
    const label = part === 1
      ? 'The solved tile lock glows, rumbles and falls away into a dark pit, with a faint glimmer of light far below.'
      : 'Torches light an ancient passage, one pair at a time, toward an altar and the great vault door.';
    stage.setAttribute('role', 'img');
    stage.setAttribute('aria-label', T(label));
    stage.innerHTML = `<div class="vp-st vp-p${part}"><div class="vp-sc"><div class="vp-fl">${vpFloorHTML()}</div><div class="vp-fog"></div></div>` +
      (part === 1 ? vpDustSVG() : '') + '<div class="vp-blk"></div>' + (part === 2 ? vpPassageSVG() : '') + '</div>';
    // the scene is drawn at 360 x 240; scale it to the stage's width
    const inner = stage.firstChild;
    const fit = () => { const w = stage.clientWidth; if (w) inner.style.transform = `scale(${w / 360})`; };
    if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
    requestAnimationFrame(fit);
    return stage;
  }

  function buildPassageCrossing(pending) {
    const theme = DOOR_THEMES[pending.themeKey];
    const part = pending.part === 2 ? 2 : 1;
    const wrap = el('div', { class: 'panel door-crossing vault-passage' });
    wrap.appendChild(text('p', 'panel-label', theme.label.toUpperCase()));
    wrap.appendChild(vpStage(part));
    const cap = text('p', 'lock-caption vp-late', part === 1 ? VP_CAPTION_1 : VP_CAPTION_2);
    cap.style.setProperty('--late', VP_LATE[part].caption + 's');
    wrap.appendChild(cap);
    // the Deep Archive's rare seal is shown at the lock, like every other door's
    if (part === 1 && pending.rareSeal) {
      const seal = el('div', { class: 'rare-seal-reveal vp-late' }, [
        el('span', { class: 'rare-seal-label' }, [document.createTextNode(PL('RUNE EARNED', 'RUNE OBTENUE')), el('br'), document.createTextNode(T(doorForRune(pending.rareSeal).name).toUpperCase())]),
        el('div', { class: 'rare-seal-token', html: runeIconSVG(pending.rareSeal) })
      ]);
      seal.style.setProperty('--late', VP_LATE[1].seal + 's');
      wrap.appendChild(seal);
    }
    const btn = text('button', 'continue-btn', part === 1 ? 'Descend' : 'Approach the altar');
    btn.addEventListener('click', () => {
      shieldInput();
      if (part === 1) { pending.part = 2; pending.soundPlayed = false; saveGame(); render(); }
      else pending.onDone();   // the seal joins the team's collection here, once
    }, { once: true });
    wrap.appendChild(btn);
    stageCinematic(wrap, {
      btn, readyMs: VP_READY_MS[part],
      music: { focusMs: Math.max(CINE_HOLD_MS + VP_READY_MS[part], 3500) },
      sound: pending.soundPlayed ? null : () => { pending.soundPlayed = true; playDoorCrossingSound(pending.themeKey, part); },
      replay: () => { pending.soundPlayed = false; render(); }
    });
    return wrap;
  }

  function buildDoorCrossing(pending) {
    if (pending.themeKey === 'passage') return buildPassageCrossing(pending);
    const theme = DOOR_THEMES[pending.themeKey];
    const wrap = el('div', { class: 'panel door-crossing mech-' + theme.mechanism });
    wrap.appendChild(text('p', 'panel-label', theme.label.toUpperCase()));
    wrap.appendChild(el('div', { class: 'door-stage', html: buildDoorSVG(theme) }));
    wrap.appendChild(text('p', 'lock-caption', theme.revealCaption));
    if (pending.rareSeal) {
      wrap.appendChild(el('div', { class: 'rare-seal-reveal' }, [
        el('span', { class: 'rare-seal-label' }, [document.createTextNode(PL('RUNE EARNED', 'RUNE OBTENUE')), el('br'), document.createTextNode(T(doorForRune(pending.rareSeal).name).toUpperCase())]),
        el('div', { class: 'rare-seal-token', html: runeIconSVG(pending.rareSeal) })
      ]));
    }
    const btn = text('button', 'continue-btn', 'Continue');
    btn.addEventListener('click', () => { shieldInput(); pending.onDone(); }, { once: true });
    wrap.appendChild(btn);
    stageCinematic(wrap, {
      btn, readyMs: theme.revealDelayMs,
      music: { focusMs: Math.max(CINE_HOLD_MS + theme.revealDelayMs, 3500) },
      sound: pending.soundPlayed ? null : () => { pending.soundPlayed = true; playDoorCrossingSound(pending.themeKey); },
      replay: () => { pending.soundPlayed = false; render(); }
    });
    return wrap;
  }

  function playTreasureFanfare(ctx) {
    // a warm sustained pad, a rising arpeggio, and a scattering of bright sparkle tones
    playTone(ctx, { freq: midiToFreq(50), type: 'sine', start: 0, duration: 1.6, gain: 0.05, attack: 0.4, release: 1.2 });
    playTone(ctx, { freq: midiToFreq(57), type: 'sine', start: 0.05, duration: 1.6, gain: 0.04, attack: 0.4, release: 1.2 });
    [62, 66, 69, 74].forEach((n, i) => {
      playTone(ctx, { freq: midiToFreq(n), type: 'triangle', start: i * 0.18, duration: 0.5, gain: 0.06, attack: 0.02, release: 0.7 });
    });
    // (all in D major, the victory music's key)
    [1318.5, 1480.0, 1760, 1975.5, 2349.3].forEach((f, i) => {
      playTone(ctx, { freq: f, type: 'sine', start: 0.4 + i * 0.12, duration: 0.3, gain: 0.045, attack: 0.01, release: 0.5 });
    });
  }

  // ---------- The final reveal: the great vault opens and the crown wakes ----------
  // About twenty-eight seconds, in one continuous scene, using the same iris
  // vault door the team just approached. (Earlier timing, kept for reference;
  // the scene now follows the sound, see playGrandRevealSound.)
  //   0.2–2.6s  the three seal dials turn into line, one after another
  //   2.8–3.9s  fire runs down the seams; the centre seal flares and stays lit
  //   3.9–5.0s  the six blades pull back into the frame; golden light pours out
  //   4.8–6.4s  the light floods the screen
  //   5.5–7.1s  the view moves through the doorway into the treasure chamber
  //   7.1–10.1s the team's three runes rise, circle the crown, and set into it
  //   10.1s     the crown ignites with ember fire
  //   10.9s     "The Ember Crown is yours" and the team's name, burned in light
  const FINAL_REVEAL_MS = 28600;
  // On a wide screen the scene holds on the burning crown, then the page glides down to the
  // title, the caption and the note: Continue comes once the note is fully open.
  const FINAL_REVEAL_WIDE_READY_MS = 35000;
  const FR_CX = 180, FR_CY = 104;           // crown centre in the chamber
  const FR_SOCKETS = [[165, 118], [180, 116], [195, 118]];

  // The vault door: a solid iris of six blades. Three seal dials sit on it, one
  // for each door's rare seal, in that door's colour; the centre seal is the
  // blades' meeting point, so it stays lit and splits with them when they part.
  // p is the class prefix ('as' for the altar scene, 'fr' for the final reveal).
  const IRIS_DIAL_R = [62, 46, 30];
  const IRIS_DIAL_START = [130, -160, 210];   // how far each dial sits out of line (degrees)
  const IRIS_DIAL_OFFSET = [[-6, -12], [-12, -22], [-20, -30]];   // how far each dormant dial sits off centre (matches the CSS)
  function irisSealAccent(i) {
    const seal = state.rareSeals[i];
    return (DOORS.find((d) => d.rareSeal === seal) || DOORS[i]).accent;
  }
  function irisDoorSVG(p) {
    const cx = 180, cy = 100, R = 72, rad = Math.PI / 180, f = (n) => n.toFixed(1);
    let defs = `<clipPath id="${p}IrisDoor"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath>`, blades = '';
    for (let i = 0; i < 6; i++) {
      const a0 = (i * 60 - 120) * rad, a1 = a0 + 60 * rad, mid = a0 + 30 * rad;
      const x0 = cx + Math.cos(a0) * R, y0 = cy + Math.sin(a0) * R, x1 = cx + Math.cos(a1) * R, y1 = cy + Math.sin(a1) * R;
      const d = `M${cx} ${cy} L${f(x0)} ${f(y0)} A${R} ${R} 0 0 1 ${f(x1)} ${f(y1)} Z`;
      defs += `<clipPath id="${p}IrisBlade${i}"><path d="${d}"/></clipPath>`;
      let inner = `<path d="${d}" fill="${i % 2 ? '#453620' : '#4E3D24'}"/>`;
      IRIS_DIAL_R.forEach((r, j) => {
        const ac = irisSealAccent(j), lightAt = (p === 'as' ? ALTAR.land[ALTAR.rank[j]] : 1.9 + j * 0.15).toFixed(2), flareAt = (1.0 + j * 0.8).toFixed(1), my = cy - r;
        inner += `<g class="${p}-dial ${p}-dial-${j}">
            <path fill-rule="evenodd" d="M${cx} ${cy - r - 5} a${r + 5} ${r + 5} 0 1 0 0.01 0 Z M${cx} ${cy - r + 5} a${r - 5} ${r - 5} 0 1 0 0.01 0 Z" fill="#2E2416" stroke="#8C6420" stroke-width="0.8"/>
            <circle class="${p}-dial-lit" style="--d:${lightAt}s;--p:${flareAt}s" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ac}" stroke-width="1.8"/>
            <path class="${p}-dial-mark" style="--ac:${ac};--d:${lightAt}s" d="M${cx} ${my - 5} L${cx + 5} ${my} L${cx} ${my + 5} L${cx - 5} ${my} Z" fill="#1A1209" stroke="#C9962E" stroke-width="1"/>
          </g>`;
      });
      inner += `<circle class="${p}-hub" cx="${cx}" cy="${cy}" r="12" fill="#2A1E0C" stroke="#C9962E" stroke-width="2.5"/>`;
      const seam = (x, y) => `<line class="${p}-seam" x1="${cx}" y1="${cy}" x2="${f(x)}" y2="${f(y)}" stroke="#F2A93B" stroke-width="1.6" stroke-linecap="round"/>`;
      blades += `<g class="${p}-blade" style="--tx:${f(Math.cos(mid) * 82)}px;--ty:${f(Math.sin(mid) * 82)}px">
          <g clip-path="url(#${p}IrisBlade${i})">${inner}</g>
          <path d="${d}" fill="none" stroke="#2A1E0C" stroke-width="1.5"/>${seam(x0, y0)}${seam(x1, y1)}
        </g>`;
    }
    return `<defs>${defs}</defs>
      <g clip-path="url(#${p}IrisDoor)">${blades}</g>
      <circle cx="${cx}" cy="${cy}" r="73" fill="none" stroke="#C9962E" stroke-width="3"/>
      <path d="M174 12 L186 12 L180 20 Z" fill="#C9962E"/>`;
  }

  // The Ember Crown, drawn once and used wherever it appears (the vault and the
  // victory screen), so the two always match. Drawn in the vault's coordinates:
  // the band sits on y = 131, the three rune sockets and flames are FR_SOCKETS
  // and FR_FLAMES. p is the prefix of the gradients the drawing uses.
  const FR_FLAMES = [[160, 96], [180, 86], [200, 96]];
  function crownDefs(p, withGold) {
    return (withGold ? `<linearGradient id="${p}Gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE39A"/><stop offset="0.5" stop-color="#E8B23A"/><stop offset="1" stop-color="#9A6A1A"/></linearGradient>` : '') +
      `<radialGradient id="${p}Cap" cx="50%" cy="30%" r="75%"><stop offset="0" stop-color="#A8303E"/><stop offset="1" stop-color="#5A1220"/></radialGradient>` +

  }
  // five points tipped with pearls, a crimson velvet cap between them, a jewelled band
  function crownArt(p) {

          <path d="M149 126 L149 108 L155 113 L160 95 L169 108 L180 85 L191 108 L200 95 L205 113 L211 108 L211 126 Z" fill="url(#${p}Gold)" stroke="#5A3E12" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M149 108 L155 113 L160 95 L169 108 L180 85 L191 108 L200 95 L205 113 L211 108" fill="none" stroke="#FFF1C8" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/>
          <rect x="147" y="121" width="66" height="10" rx="2" fill="url(#${p}Gold)" stroke="#5A3E12" stroke-width="1.5"/>

  // the tasselled crimson cushion the crown rests on
  function crownCushion(p) {
    return `<path d="M147 132 C147 127 152 127 156 128.5 C170 130 190 130 204 128.5 C208 127 213 127 213 132 C213 137.5 208 138.5 204 137.5 C190 139 170 139 156 137.5 C152 138.5 147 137.5 147 132 Z" fill="url(#${p}Velvet)" stroke="#3A0A12" stroke-width="1"/>

  }
  // one flame, as it burns from each of the crown's three main points
  const crownFlame = (x, y) => `<path d="M${x} ${y - 10} C${x - 6} ${y - 2} ${x - 4} ${y + 6} ${x} ${y + 8} C${x + 4} ${y + 6} ${x + 6} ${y - 2} ${x} ${y - 10} Z" fill="#E2573A"/><path d="M${x} ${y - 4} C${x - 3} ${y + 1} ${x - 2} ${y + 6} ${x} ${y + 7} C${x + 2} ${y + 6} ${x + 3} ${y + 1} ${x} ${y - 4} Z" fill="#FFD27A"/>`;
  // a rune set into its socket on the crown (as it ends up after the vault scene)
  function crownRuneSet(seal, i) {
    const [sx, sy] = FR_SOCKETS[i];
    if (!seal) return `<circle cx="${sx}" cy="${sy}" r="5" fill="#2A1E0C" stroke="#5A3E12" stroke-width="1"/>`;
    const door = DOORS.find((d) => d.rareSeal === seal) || DOORS[i];
    return `<circle cx="${sx}" cy="${sy}" r="5" fill="#12101C" stroke="${door.accent}" stroke-width="1"/>

  }

  function finalRevealSVG() {
    const rays = Array.from({ length: 12 }).map((_, i) =>
      `<path d="M180 100 L${(180 + Math.cos(i * Math.PI / 6 - 0.06) * 260).toFixed(0)} ${(100 + Math.sin(i * Math.PI / 6 - 0.06) * 260).toFixed(0)} L${(180 + Math.cos(i * Math.PI / 6 + 0.06) * 260).toFixed(0)} ${(100 + Math.sin(i * Math.PI / 6 + 0.06) * 260).toFixed(0)} Z" fill="#FFE9A8" opacity="${i % 2 ? 0.18 : 0.3}"/>`).join('');

    // --- the treasure chamber ---
    const coins = [];
    const pile = (cx, baseY, w, h, n, seed) => {
      coins.push(`<path d="M${cx - w} ${baseY} Q${cx - w * 0.4} ${baseY - h * 1.1} ${cx} ${baseY - h} Q${cx + w * 0.5} ${baseY - h * 0.9} ${cx + w} ${baseY} Z" fill="#B8801F" stroke="#5A3E12" stroke-width="1.2"/>`);
      for (let i = 0; i < n; i++) {
        const t = ((i * 37 + seed * 13) % 100) / 100, u = ((i * 61 + seed * 29) % 100) / 100;
        const x = cx - w * 0.85 + t * w * 1.7;
        const top = baseY - h * (1 - Math.pow((x - cx) / w, 2)) * 0.95;
        const y = top + u * (baseY - top) * 0.8 + 2;
        coins.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="3.6" ry="1.6" fill="${i % 3 ? '#F2C35A' : '#E8B23A'}" stroke="#7A5414" stroke-width="0.6"/>`);
      }
    };
    pile(62, 222, 70, 34, 26, 1); pile(300, 222, 72, 38, 28, 2); pile(118, 226, 36, 16, 10, 3); pile(246, 226, 38, 16, 10, 4);
    const glints = [[40, 196], [86, 200], [280, 190], [322, 202], [132, 214], [236, 212]].map(([x, y], i) =>
      `<path class="fr-glint" style="animation-delay:${(17.4 + i * 0.45).toFixed(2)}s" d="M${x} ${y - 5} L${x + 1.2} ${y} L${x} ${y + 5} L${x - 1.2} ${y} Z M${x - 5} ${y} L${x + 5} ${y}" stroke="#FFF6D8" stroke-width="1" fill="#FFF6D8"/>`).join('');
    const embers = Array.from({ length: 14 }).map((_, i) => {
      const x = FR_CX - 22 + ((i * 29) % 44), d = (25.4 + (i * 0.23) % 2.2).toFixed(2);
      return `<circle class="fr-ember" style="animation-delay:${d}s;--drift:${(((i * 17) % 21) - 10)}px" cx="${x}" cy="${FR_CY - 4}" r="${1 + (i % 3) * 0.5}" fill="${i % 2 ? '#F2A93B' : '#E2573A'}"/>`;
    }).join('');
    const flames = [[160, 96], [180, 86], [200, 96]].map(([x, y], i) =>
      `<path class="fr-flame" style="animation-delay:${(25.2 + i * 0.06).toFixed(2)}s;transform-origin:${x}px ${y + 8}px" d="M${x} ${y - 10} C${x - 6} ${y - 2} ${x - 4} ${y + 6} ${x} ${y + 8} C${x + 4} ${y + 6} ${x + 6} ${y - 2} ${x} ${y - 10} Z" fill="#E2573A"/>
       <path class="fr-flame" style="animation-delay:${(25.25 + i * 0.06).toFixed(2)}s;transform-origin:${x}px ${y + 8}px" d="M${x} ${y - 4} C${x - 3} ${y + 1} ${x - 2} ${y + 6} ${x} ${y + 7} C${x + 2} ${y + 6} ${x + 3} ${y + 1} ${x} ${y - 4} Z" fill="#FFD27A"/>`).join('');
    const sockets = FR_SOCKETS.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="5" fill="#2A1E0C" stroke="#5A3E12" stroke-width="1"/>`).join('');

    // --- the runes: rise, circle the crown, then set into the sockets ---
    let runeCss = '';
    const runeEls = state.rareSeals.map((seal, i) => {
      const door = DOORS.find((d) => d.rareSeal === seal) || DOORS[i];
      const [sx, sy] = FR_SOCKETS[i] || FR_SOCKETS[1];
      const start = 20.2 + i * 0.4, dur = 4.35 - i * 0.4;   // all three fuse at 24.55 s, in the music's silence
      const R = 44, a0 = Math.PI / 2 + (i - 1) * 0.9;           // enter from below
      const frames = [];
      frames.push(`0%{transform:translate(${(FR_CX + Math.cos(a0) * R - sx).toFixed(1)}px,${(FR_CY + 110 - sy).toFixed(1)}px) scale(1.1);opacity:0}`);
      frames.push(`12%{opacity:1}`);
      const steps = 8;
      for (let k = 0; k <= steps; k++) {
        const pct = 18 + (k / steps) * 57;
        const a = a0 - (k / steps) * Math.PI * 2.25;               // one and a quarter turns
        frames.push(`${pct.toFixed(1)}%{transform:translate(${(FR_CX + Math.cos(a) * R - sx).toFixed(1)}px,${(FR_CY + Math.sin(a) * R * 0.55 - sy).toFixed(1)}px) scale(1.1);opacity:1}`);
      }
      frames.push(`92%{transform:translate(0px,-6px) scale(0.62)}`);
      frames.push(`100%{transform:translate(0px,0px) scale(0.5);opacity:1}`);
      runeCss += `@keyframes frRune${i}{${frames.join('')}} .fr-rune-${i}{animation:frRune${i} ${dur}s cubic-bezier(0.45,0,0.3,1) ${start}s both;transform-origin:${sx}px ${sy}px}`;
      return `<g class="fr-rune-${i}">
          <circle cx="${sx}" cy="${sy}" r="10" fill="#12101C" stroke="${door.accent}" stroke-width="2"/>
          <g transform="translate(${sx} ${sy}) scale(0.4)"><path d="${RUNE_PATHS[seal]}" stroke="#F2C35A" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
        </g>
        <circle class="fr-socket-flash" style="animation-delay:${(start + dur - 0.05).toFixed(2)}s" cx="${sx}" cy="${sy}" r="7" fill="${door.accent}"/>`;
    }).join('');

    return `
    <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${TR('The vault door opens. Inside, the Ember Crown rests on a crimson cushion. Your three runes circle it, set into it, and the crown bursts into ember fire.')}">
      <style>${runeCss}</style>
      <defs>
        <linearGradient id="frWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2338"/><stop offset="1" stop-color="#15111F"/></linearGradient>
        <radialGradient id="frDoor" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#6B5530"/><stop offset="1" stop-color="#2E2414"/></radialGradient>
        <radialGradient id="frBeyond" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF6D8"/><stop offset="0.5" stop-color="#FFD27A"/><stop offset="1" stop-color="#E8B23A" stop-opacity="0"/></radialGradient>
        <radialGradient id="frRoom" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#5A3E1A"/><stop offset="0.55" stop-color="#2A1C10"/><stop offset="1" stop-color="#0E0906"/></radialGradient>
        <linearGradient id="frBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0"/><stop offset="0.35" stop-color="#FFE9A8" stop-opacity="0.55"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0.15"/></linearGradient>
        <linearGradient id="frGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE39A"/><stop offset="0.5" stop-color="#E8B23A"/><stop offset="1" stop-color="#9A6A1A"/></linearGradient>
        <radialGradient id="frFire" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFB25A" stop-opacity="0.9"/><stop offset="1" stop-color="#E2573A" stop-opacity="0"/></radialGradient>
        <linearGradient id="frBasalt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#120E15"/><stop offset="0.45" stop-color="#3A3240"/><stop offset="1" stop-color="#100C13"/></linearGradient>
        ${crownDefs('fr', false)}
        <clipPath id="frDoorway"><circle cx="180" cy="100" r="74"/></clipPath>
      </defs>

      <!-- the treasure chamber, waiting behind everything -->
      <g class="fr-chamber">
        <rect width="360" height="240" fill="url(#frRoom)"/>
        <g fill="#1A120B" opacity="0.8">
          <rect x="18" y="20" width="22" height="190"/><rect x="320" y="20" width="22" height="190"/>
          <rect x="12" y="14" width="34" height="10"/><rect x="314" y="14" width="34" height="10"/>
        </g>
        <rect class="fr-beam" x="150" y="0" width="60" height="200" fill="url(#frBeam)"/>
        ${coins.join('')}
        <g transform="translate(180 108) scale(1.45) translate(-180 -108)">
        <circle class="fr-fireglow" cx="${FR_CX}" cy="${FR_CY}" r="60" fill="url(#frFire)"/>
        <!-- the crown rests on a tasselled crimson cushion, in a blackened iron brazier
             dish whose embers glow round it, on a dark basalt column ringed with the
             colours of the three doors -->
        <g class="fr-stand">
          <path d="M148 181 L212 181 L206 175 L154 175 Z" fill="#221C26" stroke="#0A080C" stroke-width="1"/>
          <path d="M157 175 L203 175 L199 170 L161 170 Z" fill="#2E2733" stroke="#0A080C" stroke-width="1"/>
          <path d="M169 170 L191 170 L188 148 L172 148 Z" fill="url(#frBasalt)" stroke="#0A080C" stroke-width="1"/>
          <path d="M175.5 168 L176 150 M180 168 L180 150 M184.5 168 L184 150" stroke="#0A080C" stroke-width="0.8" opacity="0.6"/>
          ${state.rareSeals.map((seal, i) => { const door = DOORS.find((d) => d.rareSeal === seal) || DOORS[i]; const y = 164 - i * 5, inset = i * 0.45; return `<rect class="fr-band fr-band-${i}" x="${169.8 + inset}" y="${y}" width="${20.4 - inset * 2}" height="1.6" fill="${door.accent}"/>`; }).join('')}
          <path d="M171 148 L189 148 L186 143 L174 143 Z" fill="#2A2422" stroke="#0A080C" stroke-width="1"/>
          <path d="M145 136 Q180 151 215 136 L212 139.5 Q180 154 148 139.5 Z" fill="#2A2422" stroke="#0A080C" stroke-width="1"/>
          <path d="M145 136 Q180 151 215 136" fill="none" stroke="#8A5A2A" stroke-width="0.9" opacity="0.85"/>
          <ellipse class="fr-coals" cx="180" cy="137.6" rx="31" ry="2.6" fill="#E2573A"/>
          ${crownCushion('fr')}
        </g>
        <g class="fr-crown">
          ${crownArt('fr')}
          
          ${sockets}
          ${flames}
          ${runeEls}
        </g>
        ${embers}
        </g>
        ${glints}
      </g>

      <!-- the vault wall and door, which the view moves through -->
      <g class="fr-front">
        <path fill-rule="evenodd" d="M0 0 H360 V240 H0 Z M180 26 a74 74 0 1 0 0.01 0 Z" fill="url(#frWall)"/>
        <g opacity="0.25" stroke="#0B0912" stroke-width="1">
          <path d="M0 40 H100 M260 40 H360 M0 80 H106 M254 80 H360 M0 120 H106 M254 120 H360 M0 160 H110 M250 160 H360"/>
        </g>
        <rect y="196" width="360" height="44" fill="#120F1A"/>
        <circle cx="180" cy="100" r="80" fill="none" stroke="#5A4520" stroke-width="7"/>
        <g clip-path="url(#frDoorway)">
          <circle class="fr-beyond" cx="180" cy="100" r="74" fill="url(#frBeyond)"/>
          <g class="fr-rays">${rays}</g>
        </g>
        ${irisDoorSVG('fr')}
      </g>

      <defs>
        <radialGradient id="frBloom" cx="180" cy="100" r="230" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#FFE7B0"/>
          <stop offset="28%" stop-color="#F6B25A"/>
          <stop offset="62%" stop-color="#C4561F"/>
          <stop offset="100%" stop-color="#4A1A08"/>
        </radialGradient>

      <rect class="fr-flood" width="360" height="240" fill="url(#frBloom)"/>
    </svg>`;
  }

  // ===== The vault, proposed: scored to the story =====
  // Timeline (seconds from the start of the scene; the CSS and the runes in finalRevealSVG follow it):
  //   0.0   the door music hands over: its rhythm drops out on the spot, its held
  //         D minor chord fades over about five seconds while the vault's own low
  //         D rises underneath it and the torches fade in, soft and wide
  //   3.0   seal 1 wakes (glow, a stone breath)   3.8 turns   5.0 locks
  //   5.6   seal 2 wakes                          6.4 turns   7.8 locks
  //   8.4   seal 3 wakes                          9.2 turns  10.9 locks
  //         each lock lands deeper, louder and longer, and leaves its note
  //         held in a choir, so the three stack into an open, unresolved D-A-D
  //  11.2   fire runs down the outlines; 11.9 the centre seal flares
  //  11.9   the door strains: the room trembles, a low rumble swells
  //  13.2   it breaks free and grinds open; light pours through
  //  13.95  the victory theme's drum roll begins under the grinding door
  //  15.2   the light whites out: release, the theme's call erupts
  //  20.2   the runes rise; the theme's answer climbs into prominence
  //  24.55  the music stops dead: the runes fuse to the crown in silence
  //  25.2   the flames ignite, the room lights up and the music lands its
  //         crescendo on the theme's home note, D
  const V2 = {
    rings: -15, door: -10, ignite: -10, torch: 0.025, pedal: 0.05,
    wake: [3.0, 5.6, 8.4], turn: [3.8, 6.4, 9.2], lock: [5.0, 7.8, 10.9],
    seams: 11.2, hub: 11.9, strain: 11.9, breakAt: 13.2, release: 15.2, victoryAt: 13.95,
    runes: 20.2, fuse: 24.55, ignite_at: 25.2
  };

  // Torches around the team: a soft, smooth bed, mixed wide and distant.
  // No low rumble (cut below 110 Hz) and no pumping: the flicker is a slow,
  // shallow breath. A faint airy top gives the flame its shape. The body sits
  // low and quiet so it never competes with the team's voices.
  function torchBed(ctx, out, t0, from, fadeIn, until, fadeOut) {
    const b = cineBuffers(ctx), end = t0 + until + fadeOut + 0.2;
    const bus = ctx.createGain();
    bus.gain.setValueAtTime(0, t0 + from);
    bus.gain.linearRampToValueAtTime(V2.torch, t0 + from + fadeIn);
    bus.gain.setValueAtTime(V2.torch, t0 + until);
    bus.gain.linearRampToValueAtTime(0, t0 + until + fadeOut);
    const wet = ctx.createGain(); wet.gain.value = 0.6;
    bus.connect(out); bus.connect(wet).connect(sharedRoom(ctx, out));
    [-0.8, 0.8].forEach((pan, i) => {
      const breath = ctx.createGain(); breath.gain.value = 0.9;
      [[0.21 + i * 0.07, 0.05], [0.83 + i * 0.19, 0.03]].forEach(([f, d]) => {
        const l = ctx.createOscillator(); l.frequency.value = f;
        const lg = ctx.createGain(); lg.gain.value = d; l.connect(lg).connect(breath.gain);
        l.start(t0 + from); l.stop(end);
      });
      const p = ctx.createStereoPanner(); p.pan.value = pan;
      breath.connect(p).connect(bus);
      [[b.brown, [['highpass', 110, 0.7], ['lowpass', 420, 0.6]], 1], [b.white, [['bandpass', 3600 + i * 400, 0.5]], 0.018]].forEach(([buf, fl, g]) => {
        const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true;
        let n = s;
        fl.forEach(([type, f, q]) => { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; n.connect(x); n = x; });
        const gg = ctx.createGain(); gg.gain.value = g;
        n.connect(gg).connect(breath);
        s.start(t0 + from, Math.random() * 3); s.stop(end);
      });
    });
  }

  // The vault waking: a low D pedal that grows with every seal and opens up
  // as the door strains, then is swallowed by the release.
  function vaultPedal(ctx, out, t0) {
    const sum = ctx.createGain(), lp = ctx.createBiquadFilter(), g = ctx.createGain();

  function gbGearPath(cx, cy, r, teeth) {
    let d = '';
    const inner = r * 0.78;
    for (let i = 0; i < teeth; i++) {
      const a0 = (i / teeth) * Math.PI * 2, a1 = ((i + 0.42) / teeth) * Math.PI * 2, a2 = ((i + 0.58) / teeth) * Math.PI * 2, a3 = ((i + 1) / teeth) * Math.PI * 2;
      const p = (ang, rad) => (cx + Math.cos(ang) * rad).toFixed(1) + ' ' + (cy + Math.sin(ang) * rad).toFixed(1);
      d += (i === 0 ? 'M' : 'L') + p(a0, inner) + 'L' + p(a1, r) + 'L' + p(a2, r) + 'L' + p(a3, inner);
    }
    return d + 'Z';
  }

  // One gear bank, shared by the seal and its callout, so they are the same object.
  // Each tile is a drum: three alphabets stacked, then one dark, empty face.
  // Every tile has its own gear on its own axle; neighbouring gears sit on two
  // staggered rows, spaced so no two gears ever touch, so each can turn alone.
  let gbUid = 0;
  function GearBank(startText) {
    const uid = 'gb' + (++gbUid);
    const n = startText.length;
    const W = 360, pad = 16, gap = n > 16 ? 2 : n > 12 ? 3 : 4;
    const tw = Math.min(30, (W - pad * 2 - (n - 1) * gap) / n);
    const th = tw * 1.4, totalW = n * tw + (n - 1) * gap, x0 = (W - totalW) / 2;
    const plateH = 30, TOP = 84, y = TOP + 24;
    const pitch = tw + gap, GR = pitch * 0.55, DY = GR * 1.3;
    const GY1 = y + th + GR + 5, GY2 = GY1 + DY, FB = GY2 + GR + 8, FH = FB - TOP;
    const H = Math.ceil(FB + 22);
    const reelCells = ABC + ABC + ABC;
    const BLANK = reelCells.length;
    const idxOf = (ch) => (ch === ' ' ? BLANK : 26 + ABC.indexOf(ch));
    const cur = Array.from(startText).map(idxOf);
    const pw = Math.min(W - 60, 26 + cipherText().length * 15), px = (W - pw) / 2, py = 14;
    let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="${uid}Room" cx="50%" cy="38%" r="62%"><stop offset="0" stop-color="#42305A"/><stop offset="1" stop-color="#150F20"/></radialGradient>
        <linearGradient id="${uid}Face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D28C"/><stop offset="0.52" stop-color="#C9962E"/><stop offset="1" stop-color="#7E5A1C"/></linearGradient>
        <linearGradient id="${uid}Dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A5E2C"/><stop offset="0.5" stop-color="#4A3512"/><stop offset="1" stop-color="#2E2009"/></linearGradient>
        <linearGradient id="${uid}Sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE9A8" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF3CE" stop-opacity="0.4"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></linearGradient>
        ${Array.from({ length: n }).map((_, i) => `<clipPath id="${uid}C${i}"><rect x="${(x0 + i * pitch).toFixed(2)}" y="${y}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="1.5"/></clipPath>`).join('')}
      </defs>
      <rect width="${W}" height="${H}" fill="url(#${uid}Room)"/>
      <rect x="${px.toFixed(1)}" y="${py + 1.5}" width="${pw.toFixed(1)}" height="${plateH}" rx="3" fill="#000" opacity="0.35"/>
      <rect x="${px.toFixed(1)}" y="${py}" width="${pw.toFixed(1)}" height="${plateH}" rx="3" fill="url(#${uid}Face)" stroke="#3A2608"/>
      <circle cx="${(px + 7).toFixed(1)}" cy="${py + plateH / 2}" r="1.6" fill="#5A3E12"/><circle cx="${(px + pw - 7).toFixed(1)}" cy="${py + plateH / 2}" r="1.6" fill="#5A3E12"/>
      <text x="${W / 2}" y="${(py + plateH * 0.7).toFixed(1)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="17" letter-spacing="2" fill="#2A1A08">${cipherText()}</text>
      <path d="M${W / 2} ${py + plateH} V${TOP}" stroke="#2A1A06" stroke-width="3"/><path d="M${W / 2} ${py + plateH} V${TOP}" stroke="#A67A30" stroke-width="1.6"/>
      <rect x="14" y="${TOP}" width="${W - 28}" height="${FH.toFixed(1)}" rx="4" fill="#211732" stroke="#5A4478"/>
      <rect class="gb-lockglow" x="14" y="${TOP}" width="${W - 28}" height="${FH.toFixed(1)}" rx="4" fill="none" stroke="#F2C35A" stroke-width="2"/>`;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * pitch, gx = x + tw / 2, gy = i % 2 ? GY2 : GY1;
      let cells = '';
      for (let k = 0; k <= BLANK; k++) {
        const cy = y + k * th;
        if (k === BLANK) cells += `<rect x="${x.toFixed(2)}" y="${cy.toFixed(2)}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" fill="url(#${uid}Dark)"/><path d="M${(x + tw * 0.3).toFixed(1)} ${(cy + th / 2).toFixed(1)} H${(x + tw * 0.7).toFixed(1)}" stroke="#3A2808" stroke-width="1" opacity="0.8"/>`;
        else cells += `<rect x="${x.toFixed(2)}" y="${cy.toFixed(2)}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" fill="url(#${uid}Face)"/><text x="${(x + tw / 2).toFixed(2)}" y="${(cy + th * 0.66).toFixed(2)}" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="${(tw * 0.6).toFixed(1)}" fill="#2A1A08">${reelCells[k]}</text>`;
        cells += `<path d="M${x.toFixed(2)} ${(cy + th / 2).toFixed(2)} H${(x + tw).toFixed(2)}" stroke="#2A1A06" stroke-opacity="0.45" stroke-width="0.8"/>`;
      }
      svg += `<g class="gb-col" data-i="${i}">
        <rect x="${(x - gap / 2).toFixed(2)}" y="${TOP}" width="${pitch.toFixed(2)}" height="${FH.toFixed(1)}" fill="transparent"/>
        <path d="M${gx.toFixed(1)} ${(y + th).toFixed(1)} V${gy.toFixed(1)}" stroke="#2A1A06" stroke-width="${(tw * 0.2 + 1.2).toFixed(1)}" stroke-linecap="round"/>
        <path d="M${gx.toFixed(1)} ${(y + th).toFixed(1)} V${gy.toFixed(1)}" stroke="#A67A30" stroke-width="${(tw * 0.2).toFixed(1)}" stroke-linecap="round"/>
        <g class="gb-gear" style="transform-origin:${gx.toFixed(1)}px ${gy.toFixed(1)}px">
          <path d="${gbGearPath(gx, gy, GR, 10)}" fill="#6A4E22" stroke="#2A1A06" stroke-width="0.8"/>
          <circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${(GR * 0.3).toFixed(1)}" fill="#C9962E" stroke="#2A1A06" stroke-width="0.7"/></g>
        <g clip-path="url(#${uid}C${i})"><g class="gb-reel">${cells}</g></g>
        <rect x="${x.toFixed(2)}" y="${y}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="1.5" fill="none" stroke="#3A2608" stroke-width="0.9"/>
        <rect class="gb-flash" x="${x.toFixed(2)}" y="${y}" width="${tw.toFixed(2)}" height="${th.toFixed(2)}" rx="1.5" fill="#FFF1C4" style="animation-delay:${(i * 0.07).toFixed(2)}s"/>
        <rect class="gb-sel" x="${(x - 2).toFixed(2)}" y="${y - 2}" width="${(tw + 4).toFixed(2)}" height="${(th + 4).toFixed(2)}" rx="2.5" fill="none" stroke="#F2C35A" stroke-width="1.6"/>
      </g>`;
    }
    svg += `<rect class="gb-lampbar" x="-140" y="${TOP}" width="130" height="${FH.toFixed(1)}" fill="url(#${uid}Sweep)" opacity="0"/></svg>`;
    const stage = el('div', { class: 'gb-stage', html: svg });
    const reels = Array.from(stage.querySelectorAll('.gb-reel'));
    const gears = Array.from(stage.querySelectorAll('.gb-gear'));
    const angle = new Array(n).fill(0);
    const place = (i, instant) => {
      reels[i].classList.toggle('snap', !!instant);
      reels[i].style.transform = 'translateY(' + (-cur[i] * th).toFixed(2) + 'px)';
    };
    for (let i = 0; i < n; i++) place(i, true);
    const turnGear = (i, deg, long) => {
      angle[i] += deg;
      gears[i].classList.toggle('long', !!long);
      gears[i].style.transform = 'rotate(' + angle[i] + 'deg)';
    };
    return {
      el: stage, n,
      letterAt: (i) => (cur[i] === BLANK ? ' ' : reelCells[cur[i]]),
      text: () => cur.map((k) => (k === BLANK ? ' ' : reelCells[k])).join(''),
      isBlank: (i) => cur[i] === BLANK,
      step(i, dir) {
        if (cur[i] === BLANK) return;
        cur[i] += dir;
        reels[i].classList.remove('long');
        place(i, false);

      rollTo(i, ch, delayMs, rd, slow) {
        setTimeout(() => {
          const target = ch === ' ' ? BLANK : ((cur[i] === BLANK || cur[i] >= 52) ? 26 : 52) + ABC.indexOf(ch);
          reels[i].classList.add('long');
          reels[i].classList.toggle('drama', slow === 'held' || slow === true);
          reels[i].classList.toggle('cinema', slow === 'cinema');
          reels[i].style.setProperty('--rd', (rd || (1 + Math.random() * 0.3 + i * 0.03)).toFixed(2) + 's');
          cur[i] = target;
          place(i, false);

      shake() { stage.classList.remove('gb-shake'); void stage.offsetWidth; stage.classList.add('gb-shake'); },
      lamp() { const l = stage.querySelector('.gb-lampbar'); l.classList.remove('gb-lamp'); void l.getBoundingClientRect(); l.classList.add('gb-lamp'); },
      solved() {
        stage.classList.add('gb-solved');
        for (let i = 0; i < n; i++) turnGear(i, -40, false);
        const s = stage.querySelector('svg');
        setTimeout(() => { s.classList.remove('gb-seat'); void s.getBoundingClientRect(); s.classList.add('gb-seat'); }, 120);
      }
    };
  }

  // ---------- The shifted message: turn the brass tiles to decode the plate ----------
  function buildGearCipher(puzzle, panel, hint, solve) {
    const n = cipherAnswer().length;   // the puzzle never grows with the team's name
    const answer = padCentre(cipherAnswer(), n);
    // Tiles are kept per language: the two phrases put their gaps in
    // different places, so one language's half-finished row cannot be poured
    // into the other. Switching away and back brings your own row back.
    if (!state.gearTiles || typeof state.gearTiles !== 'object') state.gearTiles = {};
    const fits = (tiles) => typeof tiles === 'string' && tiles.length === n &&
      tiles.split('').every((ch, i) => (ch === ' ') === (answer[i] === ' '));
    if (!fits(state.gearTiles[LANG])) state.gearTiles[LANG] = scrambledStart(answer);
    const bank = GearBank(state.gearTiles[LANG]);
    const save = () => { state.gearTiles[LANG] = bank.text(); };
    panel.appendChild(howTo('Tap a tile to choose it. Turn it with \u2212 and +, or drag the letter up and down. On a keyboard, you can also type a letter or use the arrow keys. When the message is right, turn the key.'));
    panel.appendChild(bank.el);
    const live = el('p', { class: 'sr-only', 'aria-live': 'polite' });
    panel.appendChild(live);

    const minus = text('button', 'dial-btn', '\u2212'); minus.type = 'button'; minus.setAttribute('aria-label', T('Turn this tile back one letter'));
    const plus = text('button', 'dial-btn', '+'); plus.type = 'button'; plus.setAttribute('aria-label', T('Turn this tile forward one letter'));
    const drum = el('div', { class: 'dial-drum', role: 'img' });
    const strip = el('div', { class: 'dial-strip' });
    const nums = [-2, -1, 0, 1, 2].map((o) => { const d = el('div', { class: 'dial-num' + (o === 0 ? ' current' : ''), style: 'top:' + (o * 46 - 23) + 'px' }); strip.appendChild(d); return d; });
    drum.appendChild(strip); drum.appendChild(el('div', { class: 'dial-window' }));
    panel.appendChild(el('div', { class: 'dial-row gb-letter-row' }, [minus, drum, plus]));
    const prev = text('button', 'ghost cw-back', '\u2190 Previous'); prev.type = 'button'; prev.setAttribute('aria-label', T('Previous tile'));
    const next = text('button', 'ghost cw-back', 'Next \u2192'); next.type = 'button'; next.setAttribute('aria-label', T('Next tile'));
    const which = el('span', { class: 'gb-tile-label' });
    panel.appendChild(el('div', { class: 'gb-tile-row' }, [prev, which, next]));
    const key = el('button', { type: 'button', class: 'gb-key', html: '<span class="gb-key-pic"><svg viewBox="0 0 60 60" aria-hidden="true"><g class="key-body"><circle cx="30" cy="16" r="9" fill="none" stroke="#120C06" stroke-width="5"/><circle cx="30" cy="16" r="9" fill="none" stroke="#E8B23A" stroke-width="3"/><path d="M30 25 V50" stroke="#120C06" stroke-width="5.5" stroke-linecap="round"/><path d="M30 25 V50" stroke="#E8B23A" stroke-width="3.2" stroke-linecap="round"/><path d="M30 41 H37 M30 47 H39" stroke="#120C06" stroke-width="5" stroke-linecap="round"/><path d="M30 41 H37 M30 47 H39" stroke="#E8B23A" stroke-width="2.8" stroke-linecap="round"/></g></svg></span><span>' + T('Turn the key') + '</span>' });
    panel.appendChild(el('div', { class: 'gb-key-row' }, [key]));
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    panel.appendChild(feedback);

    const cols = Array.from(bank.el.querySelectorAll('.gb-col'));
    const lettersTotal = cipherAnswer().replace(/ /g, '').length;
    let sel = answer.search(/\S/), solved = false;
    const letterNo = () => answer.slice(0, sel + 1).replace(/ /g, '').length;
    const showLetter = (dir) => {
      const L = bank.letterAt(sel);
      nums.forEach((d, k) => { d.textContent = ABC[(ABC.indexOf(L) + k - 2 + 26) % 26]; });
      if (dir) { strip.classList.add('snap'); strip.style.transform = 'translateY(' + (dir * 46) + 'px)'; void strip.offsetWidth; strip.classList.remove('snap'); }
      strip.style.transform = 'translateY(0)';
      drum.setAttribute('aria-label', PL('Tile ' + letterNo() + ' shows ' + L, 'La tuile ' + letterNo() + ' affiche ' + L));
    };
    const select = (i) => {
      if (bank.isBlank(i) || answer[i] === ' ') return;
      sel = i;
      cols.forEach((c, k) => c.classList.toggle('selected', k === i));
      which.textContent = PL('TILE ' + letterNo() + ' OF ' + lettersTotal, 'TUILE ' + letterNo() + ' SUR ' + lettersTotal);
      showLetter(0);
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(i) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(i) + '.');
    };
    const move = (d) => { let i = sel; do { i = (i + d + n) % n; } while (answer[i] === ' '); select(i); };
    const turn = (dir) => {
      if (solved) return;
      bank.step(sel, dir); save(); playSoftTap('tick');
      feedback.className = 'feedback'; feedback.textContent = '';
      showLetter(dir);
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(sel) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(sel) + '.');
    };
    cols.forEach((c, i) => c.addEventListener('click', () => { if (!solved) select(i); }));
    prev.addEventListener('click', () => move(-1));
    next.addEventListener('click', () => move(1));
    minus.addEventListener('click', () => turn(-1));
    plus.addEventListener('click', () => turn(1));
    // Drag the drum with a finger or the mouse: down for earlier letters, up for later ones.
    let dragY = null, dragOff = 0;
    const STEP = 46;
    drum.addEventListener('pointerdown', (e) => {
      if (solved) return;
      dragY = e.clientY; dragOff = 0;
      drum.classList.add('dragging'); strip.classList.add('snap');
      drum.setPointerCapture(e.pointerId); e.preventDefault();
    });
    drum.addEventListener('pointermove', (e) => {
      if (dragY === null) return;
      dragOff += e.clientY - dragY; dragY = e.clientY;
      while (dragOff > STEP / 2) { dragOff -= STEP; bank.step(sel, -1); save(); playSoftTap('tick'); showLetterNow(); }
      while (dragOff < -STEP / 2) { dragOff += STEP; bank.step(sel, 1); save(); playSoftTap('tick'); showLetterNow(); }
      strip.style.transform = 'translateY(' + dragOff.toFixed(1) + 'px)';
    });
    const showLetterNow = () => {
      const L = bank.letterAt(sel);
      nums.forEach((d, k) => { d.textContent = ABC[(ABC.indexOf(L) + k - 2 + 26) % 26]; });
    };
    const endDrag = () => {
      if (dragY === null) return;
      dragY = null; drum.classList.remove('dragging'); strip.classList.remove('snap');
      strip.style.transform = 'translateY(0)';
      feedback.className = 'feedback'; feedback.textContent = '';
      live.textContent = PL('Tile ' + letterNo() + ' shows ' + bank.letterAt(sel) + '.', 'La tuile ' + letterNo() + ' affiche ' + bank.letterAt(sel) + '.');
    };
    drum.addEventListener('pointerup', endDrag);
    drum.addEventListener('pointercancel', endDrag);
    drum.addEventListener('wheel', (e) => { if (solved) return; e.preventDefault(); turn(e.deltaY > 0 ? 1 : -1); }, { passive: false });
    panel.tabIndex = -1;
    panel.addEventListener('keydown', (e) => {
      if (solved || e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') { move(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { move(1); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { turn(-1); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { turn(1); e.preventDefault(); }
      else if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
        const want = e.key.toUpperCase();
        let d = ABC.indexOf(want) - ABC.indexOf(bank.letterAt(sel));
        if (d > 13) d -= 26;
        if (d < -13) d += 26;
        const dir = d > 0 ? 1 : -1, tile = sel;
        for (let k = 0; k < Math.abs(d); k++) setTimeout(() => { bank.step(tile, dir); save(); if (sel === tile) showLetterNow(); }, k * 40);
        playSoftTap('tick');
        setTimeout(() => move(1), Math.abs(d) * 40 + 60);
      }
    });
    key.addEventListener('click', () => {
      if (solved) return;
      if (bank.text() === answer) {
        solved = true;
        [minus, plus, key, prev, next].forEach((b) => { b.disabled = true; });
        key.classList.add('turned');
        cols.forEach((c) => c.classList.remove('selected'));
        bank.solved(); bank.lamp();
        playSoftTap('find');
        state.collected.push(puzzle.title);
        // Let the light run along the tiles before the seal opens.
        setTimeout(solve, 1300);
      } else {
        bank.shake();
        registerMiss(puzzle, feedback, hint, 'The gears jam. At least one tile is wrong.', 3);
      }
    });
    setTimeout(() => { select(sel); if (panel.isConnected) panel.focus({ preventScroll: true }); }, 30);
  }

  // ---------- Callout I: the card, found under blown dust ----------
  function wrapWords(str, max) {
    const out = []; let line = '';
    str.split(' ').forEach((w) => { if ((line + ' ' + w).trim().length > max && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); });
    if (line) out.push(line);
    return out;
  }
  function escapeXML(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function coMotes(count, x0, y0, w) {
    return Array.from({ length: count }).map(() => {
      const x = x0 + Math.random() * w, y = y0 - Math.random() * 10;
      return `<circle class="co-mote" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(0.9 + Math.random()).toFixed(1)}" fill="#E9D2A8" style="--mx:${(Math.random() * 14 - 7).toFixed(0)}px; animation-delay:${(0.6 + Math.random() * 1.6).toFixed(2)}s"/>`;
    }).join('');
  }
  // The card on the Reading Room shelf: a shelf list, the record of what stands on a shelf
  // and in what order (the puzzle's clue).
  const SHELF_CARD_TITLES = { A: 'SHELF LIST \u00b7 THE READING ROOM', B: 'THE READING ROOM \u00b7 CASE VII', C: 'THE ARCHIVIST\u2019S SHELF CARD' };
  const shelfCardTitle = () => SHELF_CARD_TITLES['B'] || 'LIBRARY CARD \u00b7 THIS SHELF';
  function calloutCard() {
    const L1 = TR('The moon was shelved beside the star. \u2014 A.');
    // Her pencil, before she could know anything else about them. The team's
    // name belongs to the next callout, where the brass tiles spell it out.
    const L2 = wrapWords(PL('I knew you could not get here alone.',
      'Je savais que vous ne pouviez pas arriver jusqu\u2019ici seuls.'), 36);
    const lines = [L1].concat(L2);
    const X = 28, CW = 304, LH = 25;
    const cardH = 44 + lines.length * LH + 16;
    const T = Math.round((200 - cardH) / 2);
    const base = (i) => T + 58 + i * LH;
    const l2top = base(1) - 18, l2h = L2.length * LH + 4;
    const clouds = Array.from({ length: 16 }).map((_, i) => {
      const x = X + 22 + (i % 8) * 36 + Math.random() * 8, y = l2top + 6 + Math.floor(i / 8) * Math.max(8, l2h / 2) + Math.random() * 5;
      const d = (0.95 + (i % 8) * 0.06 + Math.random() * 0.08).toFixed(2);
      return `<ellipse class="co-blow" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${(18 + Math.random() * 10).toFixed(0)}" ry="${(8 + Math.random() * 4).toFixed(0)}" fill="#B8A782" style="--bx:${(48 + Math.random() * 46).toFixed(0)}px; --by:${(-10 - Math.random() * 14).toFixed(0)}px; animation-delay:${d}s"/>`;
    }).join('');
    return el('div', { class: 'co-stage', role: 'img', 'aria-label': PL('A shelf card. Dust is blown off it, and under the Archivist\u2019s note there is a second line: ' + L2.join(' '),
        'Une fiche de rayon. On souffle la poussi\u00e8re, et sous la note de l\u2019Archiviste il y a une deuxi\u00e8me ligne\u00a0: ' + L2.join(' ')), html: `
    <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  // The brass tiles rolling on to the team's name, in the vault lock's iron and bronze.
  // Nothing in it has a pitch, so it never clashes with the call-out's music.
  // Quick reveal (lead < 0): gears turning beneath, each tile's letters ticking past,
  // each tile dropping into place with a small bronze chunk, left to right.
  // Cinematic reveal (lead >= 0): a shudder as something catches; the gears wind up from a
  // slow grind into a full whir; the tiles lock in one by one; under the held letters a low
  // pulse like a slow heartbeat builds the wait; the whir drops out for a breath before the
  // final letter, which lands with the heaviest chunk and the whole mechanism settling.
  const TILE_LEVEL = 0.5;
  function playTileRollSound(n, rds, slow, lead) {
    if (!state.soundOn) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    slow = slow || [];
    const cinema = lead != null && lead >= 0, L = cinema ? lead : 0;
    withRoute(ctx, { trim: TILE_LEVEL, wet: 0.22 }, () => {
      const at = (i) => (cinema ? 0 : i * 0.09);
      const landAt = rds.map((rd, i) => L + at(i) + rd);
      const last = Math.max.apply(null, landAt);
      if (cinema) {
        // the shudder: an iron clank, a rattle, a low groan

        playNoiseBurst(ctx, { duration: 0.07, gain: 0.08, filterType: 'bandpass', filterFreq: 520, q: 2 });
        [0.06, 0.1, 0.15, 0.22, 0.3].forEach((t) => playNoiseBurst(ctx, { start: t, duration: 0.02, gain: 0.025, filterType: 'bandpass', filterFreq: rand(2100, 2800), q: 6 }));
        playIronGroan(ctx, { start: 0.05, duration: 0.6, gain: 0.04 });
        // the gears wind up from a grind into a whir, hold, and fall away before the last letter
        const restEnd = Math.max.apply(null, landAt.filter((_, i) => slow.indexOf(i) < 0));
        const cut = last - 0.42;
        playNoiseBurst(ctx, { start: L, duration: Math.max(0.5, cut - L), gain: 0.06, filterType: 'bandpass', q: 1.8,
          filterFreqPath: [[0, 180], [1.2, 520], [restEnd - L, 600], [Math.max(restEnd - L + 0.1, cut - L - 0.1), 300], [Math.max(0.5, cut - L), 220]] });
        // a ratchet that speeds up as the tiles spin up, then slows with the held letters
        let t = L + 0.05, gap = 0.22;
        while (t < cut) {
          playNoiseBurst(ctx, { start: t, duration: 0.012, gain: 0.022, filterType: 'bandpass', filterFreq: rand(1100, 1400), q: 5 });
          gap = t < L + 1.3 ? Math.max(0.05, gap * 0.82) : t < restEnd ? 0.05 : Math.min(0.32, gap * 1.18);
          t += gap;
        }
        // the wait for the held letters: a slow, low pulse, felt more than heard
        for (let p = restEnd + 0.15, k = 0; p < cut - 0.1; p += 0.62, k++) {
          weightTone(ctx, { freq: 58, freqEnd: 44, type: 'sine', start: p, duration: 0.05, gain: 0.05 + k * 0.012, attack: 0.01, release: 0.3 });
        }

        const span = (n - 1) * 0.09 + Math.max.apply(null, rds);
        playNoiseBurst(ctx, { duration: span, gain: 0.045, filterType: 'bandpass', q: 2, filterFreqPath: [[0, 420], [span * 0.4, 600], [span, 460]] });
        weightTone(ctx, { freq: 62, type: 'sine', duration: span - 0.2, gain: 0.04, attack: 0.15, release: 0.3 });
      }
      for (let i = 0; i < n; i++) {
        const held = slow.indexOf(i) >= 0, stop = landAt[i], final = cinema && stop === last;
        if (!cinema || held) {
          // letters ticking past: fast then slowing (the held letters tick on slowly)
          const ticks = held ? (cinema ? 14 : 11) : 7, curve = held ? 2.2 : 3, t0 = L + at(i), rd = rds[i];
          for (let k = 1; k <= ticks; k++) {
            const u = 1 - Math.pow(1 - k / (ticks + 1), 1 / curve);
            playNoiseBurst(ctx, { start: t0 + rd * u * 0.94, duration: 0.012, gain: held ? 0.036 : 0.03, filterType: 'bandpass', filterFreq: rand(1900, 2500), q: 4 });
          }
        }
        weightTone(ctx, { freq: final ? 110 : held ? 130 : 150, freqEnd: final ? 70 : held ? 92 : 112, type: 'sine', start: stop, duration: 0.03, gain: final ? 0.12 : held ? 0.1 : 0.06, attack: 0.003, release: final ? 0.4 : held ? 0.2 : 0.1 }, [[2, 0.5], [3, 0.3]]);
        playNoiseBurst(ctx, { start: stop, duration: final ? 0.08 : 0.05, gain: final ? 0.07 : held ? 0.05 : 0.035, filterType: 'bandpass', filterFreq: final ? 520 : held ? 620 : 700, q: 3 });
      }
      // the whole mechanism settles after the last letter
      playNoiseBurst(ctx, { start: last + 0.02, duration: cinema ? 0.5 : 0.25, gain: cinema ? 0.045 : 0.03, filterType: 'lowpass', filterFreq: 300, q: 0.7 });
    });
  }

    const rds = Array.from({ length: n }, (_, i) => 1 + Math.random() * 0.3 + i * 0.03);
    // The reveal, played like a film: a beat of stillness; the mechanism shudders as
    // something catches; every tile winds up together, slowly at first, into a full spin;
    // then they lock in from left to right, quickly at first and then slower, while the
    // name's last three letters keep turning. Those arrive one at a time, each held a
    // little longer than the last, ticking over slowly and nudging past their letter before
    // settling back. A breath of silence, and the final letter drops; the lamp sweeps the

  }

  // ---------- Memory seals: pairs rarely start side by side ----------
  // At most one side-by-side pair in a whole playthrough, across both memory
  // seals, and only in about one playthrough in four. Diagonals do not count.
  function sideBySidePairs(order, cols) {
    const rows = Math.ceil(order.length / cols); let c = 0;
    for (let i = 0; i < order.length; i++) {
      const r = Math.floor(i / cols), k = i % cols;
      if (k < cols - 1 && i + 1 < order.length && order[i] === order[i + 1]) c++;
      if (r < rows - 1 && i + cols < order.length && order[i] === order[i + cols]) c++;
    }
    return c;
  }
  function dealPairs(shapes) {
    const cols = shapes.length * 2 <= 6 ? 3 : 4;
    if (state.pairBudget === null || state.pairBudget === undefined) state.pairBudget = Math.random() < 0.25 ? 1 : 0;
    let order = shuffled(shapes.concat(shapes)), a = sideBySidePairs(order, cols);
    for (let tries = 0; tries < 500 && a > state.pairBudget; tries++) { order = shuffled(shapes.concat(shapes)); a = sideBySidePairs(order, cols); }
    while (a > state.pairBudget) { order = shuffled(shapes.concat(shapes)); a = sideBySidePairs(order, cols); }
    state.pairBudget -= a;
    return order;
  }

  function buildFinalReveal(onDone) {
    const wrap = el('div', { class: 'panel door-crossing final-reveal grand' });
    wrap.appendChild(text('p', 'panel-label', 'THE FINAL VAULT'));
    wrap.appendChild(el('div', { class: 'fr-stage', html: finalRevealSVG() + '<div class="fr-roomlight"></div>' }));
    wrap.appendChild(el('div', { class: 'fr-title' }, [
      text('p', 'fr-title-line', 'The Ember Crown is yours,'),
      text('p', 'fr-title-name', state.teamName || PL('brave hands', 'vaillante \u00e9quipe'))

    wrap.appendChild(text('p', 'lock-caption fr-caption', 'Searched for across three doors and locked away for an age, it burns again. A folded note is tucked beneath it.'));
    const note = buildArchivistNote();

    wrap.appendChild(btn);

      btn, readyMs: wideReveal ? FINAL_REVEAL_WIDE_READY_MS : FINAL_REVEAL_MS,
      music: { final: true },
      sound: state.finalRevealSoundPlayed ? null : () => { state.finalRevealSoundPlayed = true; playFinalRevealSound(); },
      replay: () => { state.finalRevealSoundPlayed = false; render(); }

  }


  // ---------- The misplaced books (Reading Room) ----------

  const BOOK_SYMBOLS = {
    crown: '<path d="M4 17 L4 8.5 L8 12 L12 5.5 L16 12 L20 8.5 L20 17 Z" fill="currentColor"/><rect x="3.5" y="17.5" width="17" height="2.6" rx="0.8" fill="currentColor"/>',
    flame: '<path d="M12 2.5 C7.5 8 6.8 12.5 8.6 16.2 C9.7 18.4 11 19.5 12 19.5 C13 19.5 14.3 18.4 15.4 16.2 C17.2 12.5 16.5 8 12 2.5 Z M12 10 C10.6 12.5 10.7 14.8 12 17 C13.3 14.8 13.4 12.5 12 10 Z" fill="currentColor" fill-rule="evenodd"/>',
    key: '<circle cx="7.5" cy="12" r="3.8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11.3 12 H21 M17.5 12 V15.5 M20.3 12 V14.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    moon: '<path d="M16 3.5 A8.8 8.8 0 1 0 16 20.5 A10.5 10.5 0 0 1 16 3.5 Z" fill="currentColor" transform="translate(2.5 0)"/>',
    star: '<path d="M12 2.8 L14.6 8.9 L21.2 9.4 L16.2 13.7 L17.7 20.2 L12 16.7 L6.3 20.2 L7.8 13.7 L2.8 9.4 L9.4 8.9 Z" fill="currentColor"/>',
    eye: '<path d="M2 12 C5.5 6.5 9 5 12 5 C15 5 18.5 6.5 22 12 C18.5 17.5 15 19 12 19 C9 19 5.5 17.5 2 12 Z" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="3.3" fill="currentColor"/>',
    hourglass: '<path d="M6 3 H18 M6 21 H18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M7.5 3.5 C7.5 9 12 10 12 12 C12 14 7.5 15 7.5 20.5 H16.5 C16.5 15 12 14 12 12 C12 10 16.5 9 16.5 3.5 Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20 C9.5 17.5 14.5 17.5 15 20 Z" fill="currentColor"/>'
  };
  // Seven books: each has a height (tall, middle, short) and a thickness (wide,
  // thin). Outlines come in pairs except the hourglass; the two readable symbols
  // and the librarian's note ("the moon was shelved beside the star") leave
  // exactly one order that fits.
  const BOOKS = {
    crown: { h: 'T', w: 'W', spine: '#8C6420' }, flame: { h: 'T', w: 'W', spine: '#9C3A28' },
    key: { h: 'M', w: 'N', spine: '#2F6E68' },   moon: { h: 'M', w: 'N', spine: '#4B3F7A' },
    star: { h: 'S', w: 'W', spine: '#7A2E48' },  eye: { h: 'S', w: 'W', spine: '#4A4A52' },
    hourglass: { h: 'M', w: 'W', spine: '#5E6A3A' }
  };
  // Spoken names of the seven book symbols, for screen readers.
  const BOOK_NAMES_FR = { crown: 'couronne', flame: 'flamme', key: 'cl\u00e9', moon: 'lune', star: '\u00e9toile', eye: '\u0153il', hourglass: 'sablier' };
  const BOOK_HEIGHT = { T: 132, M: 112, S: 92 };
  const BOOK_WIDTH = { W: 42, N: 28 };
  const BOOK_ANSWER = ['key', 'crown', 'hourglass', 'eye', 'flame', 'star', 'moon'];
  const BOOK_READABLE = [1, 5];               // symbols still legible on the card
  const BOOK_START = ['flame', 'moon', 'star', 'key', 'hourglass', 'crown', 'eye'];
  const BOOK_NOTE = 'The moon was shelved beside the star. \u2014 A.';
  const bookSymbolSVG = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${BOOK_SYMBOLS[name]}</svg>`;

  function buildBooksPuzzle(puzzle, panel, hint, solve) {
    const id = puzzle.id;
    if (!state.bookOrder) state.bookOrder = {};
    if (!state.bookOrder[id]) state.bookOrder[id] = BOOK_START.slice();
    const order = state.bookOrder[id];

    const card = el('div', { class: 'library-card book-sweep' });
    card.appendChild(text('p', 'library-card-title', shelfCardTitle()));
    const sky = el('div', { class: 'library-card-sky' });
    BOOK_ANSWER.forEach((name, i) => {
      const slot = el('div', { class: 'card-slot' + (BOOK_READABLE.includes(i) ? ' inked' : ''), 'data-name': name, style: 'height:' + Math.round(BOOK_HEIGHT[BOOKS[name].h] * 0.5) + 'px; width:' + Math.round(BOOK_WIDTH[BOOKS[name].w] * 0.62) + 'px;' });
      slot.appendChild(BOOK_READABLE.includes(i)
        ? el('span', { class: 'card-ink', html: bookSymbolSVG(name) })
        : el('span', { class: 'card-faded', 'aria-hidden': 'true' }));
      sky.appendChild(slot);
    });
    card.appendChild(sky);
    const pencil = text('p', 'library-card-pencil', BOOK_NOTE);
    card.appendChild(pencil);
    panel.appendChild(card);
    panel.appendChild(howTo('Tap a book to pick it up, then tap another book to swap them. Tap the same book again to put it back.'));

    const shelf = el('div', { class: 'book-shelf book-sweep', role: 'group', 'aria-label': 'Bookshelf' });
    const board = el('div', { class: 'book-shelf-board' });
    const feedback = el('div', { class: 'feedback', 'aria-live': 'polite' });
    let selected = null, solved = false, landed = [];

    function draw() {
      shelf.innerHTML = '';
      order.forEach((name, pos) => {
        const b = BOOKS[name];
        const book = el('button', {
          class: 'book' + (selected === pos ? ' selected' : '') + (landed.includes(pos) ? ' landed' : ''),
          type: 'button',
          style: 'height:' + BOOK_HEIGHT[b.h] + 'px; width:' + BOOK_WIDTH[b.w] + 'px; --spine:' + b.spine + ';',
          'aria-label': PL('Book ' + (pos + 1) + ', ' + name, 'Livre ' + (pos + 1) + ', ' + BOOK_NAMES_FR[name])
        });
        book.appendChild(el('span', { class: 'book-band' }));
        book.appendChild(el('span', { class: 'book-symbol', html: bookSymbolSVG(name) }));
        book.appendChild(el('span', { class: 'book-band' }));
        book.addEventListener('click', () => tap(pos));
        shelf.appendChild(book);
      });
      landed = [];
    }
    function tap(pos) {
      if (solved) return;
      if (selected === null) { selected = pos; playSoftTap('tick'); draw(); return; }
      if (selected !== pos) {
        [order[selected], order[pos]] = [order[pos], order[selected]];
        landed = [selected, pos];
        playBookThud();
        registerMiss(puzzle, null, hint, '', 16);
      }
      selected = null;
      draw();
      if (order.every((name, i) => name === BOOK_ANSWER[i])) {
        solved = true;
        state.collected.push(puzzle.title);
        state.bookCelebrating = true;

      } else {
        const close = showNearMissLine();
        if (close) nearMiss();
      }
    }
    // Every outline fits but the order is wrong. The line is written on every
    // build too, so it survives a language change instead of vanishing.
    function showNearMissLine() {
      const close = !solved && order.every((name, i) =>
        BOOKS[name].h === BOOKS[BOOK_ANSWER[i]].h && BOOKS[name].w === BOOKS[BOOK_ANSWER[i]].w);
      feedback.className = close ? 'feedback nudge' : 'feedback';
      feedback.textContent = close ? T('Every outline matches the card, but the books are not in order yet.') : '';
      return close;
    }

    // Every outline fits, but the order is wrong: one shudder across the whole
    // shelf, and a flicker of the pencilled note. Nothing singles out a book,
    // so the near miss never says which one is in the wrong place.
    function nearMiss() {
      shelf.classList.remove('shudder');
      void shelf.offsetWidth;
      shelf.classList.add('shudder');
      pencil.classList.remove('flicker');
      void pencil.offsetWidth;
      setTimeout(() => { if (pencil.isConnected) pencil.classList.add('flicker'); }, 180);
    }

    // settles home and inks itself onto the card, then the library wakes.
    // `atOnce` finishes it immediately, for a rebuild or for reduced motion.
    function inkSlot(slot, animate) {

      if (ghost) {
        if (animate) ghost.classList.add('dissolving');

      const slots = [...card.querySelectorAll('.card-slot')];
      const books = [...shelf.querySelectorAll('.book')];
      const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (atOnce) {
        slots.forEach((slot) => inkSlot(slot, false));
        setTimeout(finishCelebration, 300);
        return;
      }
      // The door music steps back about 10 dB while the shelf plays its tune.
      if (state.soundOn) { try { EmberScore.duckFor(0.32, SHELF_BLOOM + 1.1, 1.8); } catch (e) {} }
      playShelfSolvedSound();
      if (reduced) {
        slots.forEach((slot) => inkSlot(slot, false));
        setTimeout(finishCelebration, (SHELF_BLOOM + 1.2) * 1000);
        return;
      }
      // Each book settles home on its note: it lifts, its symbol flares gold, a
      // spark rises from it, and its symbol inks onto the card at the same moment.
      const stageEl = panel;
      books.forEach((book, i) => setTimeout(() => {
        if (!book.isConnected) return;
        book.classList.add('chime');
        inkSlot(slots[i], true);
        const sr = stageEl.getBoundingClientRect(), r = book.getBoundingClientRect(), zp = zoomOf(stageEl), m = el('span', { class: 'book-mote', 'aria-hidden': 'true' });
        m.style.left = ((r.left - sr.left + r.width / 2) / zp) + 'px'; m.style.top = ((r.top - sr.top) / zp + 6) + 'px';
        stageEl.appendChild(m); setTimeout(() => m.remove(), 1400);

      // the card and the bands glow, and dust drifts up into the light.
      setTimeout(() => {
        if (!shelf.isConnected) return;
        card.classList.add('run', 'glow');
        shelf.classList.add('run', 'awake');
        board.classList.add('lit');
        books.forEach((book) => book.classList.add('lit'));
        const sr = stageEl.getBoundingClientRect(), br = board.getBoundingClientRect(), zp = zoomOf(stageEl);
